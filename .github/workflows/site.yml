name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build viewer and deploy to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install pyyaml
      - name: Validate bundle
        run: python3 scripts/validate_okf.py
      - name: Build viewer site
        run: python3 site/build.py
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          else
            git branch gh-pages
          fi
          git worktree add /tmp/gh-pages gh-pages
          find /tmp/gh-pages -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r site/dist/. /tmp/gh-pages/
          cd /tmp/gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "site: no changes to deploy"
          else
            git commit -m "site: rebuild viewer from main (${GITHUB_SHA::7})"
            git push origin gh-pages
          fi
