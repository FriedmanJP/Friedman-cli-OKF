name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Build viewer and deploy to api.friedman.jp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install pyyaml
      - name: Validate bundle
        run: python3 scripts/validate_okf.py
      - name: Build viewer site
        run: python3 site/build.py
      - name: Deploy to api.friedman.jp repo
        env:
          API_PAGES_TOKEN: ${{ secrets.API_PAGES_TOKEN }}
        run: |
          if [ -z "${API_PAGES_TOKEN}" ]; then
            echo "site deploy skipped (API_PAGES_TOKEN secret not set)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${API_PAGES_TOKEN}@github.com/FriedmanJP/api.friedman.jp.git" /tmp/api-site
          mkdir -p /tmp/api-site/Friedman-cli-OKF
          cp site/dist/index.html /tmp/api-site/Friedman-cli-OKF/index.html
          cd /tmp/api-site
          git add -A
          if git diff --cached --quiet; then
            echo "site: no changes to deploy"
          else
            git commit -m "site: rebuild Friedman-cli-OKF viewer"
            git push origin main
          fi
