estimator exists) | `panel_probit_fitted_probabilities` |\n| `friedman predict regime ms` | MS-regression regime-weighted conditional mean \u03a3\u2096 Pr(s=k)\u00b7E[y\\|s=k]; `--probs smoothed` (default; `y \u2212 fitted` reproduces residuals) or `filtered` | `ms_regression_fitted_values` (`t \\| fitted`) |\n| `friedman predict regime ms-ar` | MS-AR regime-weighted conditional mean; Hamilton constant-variance default | `ms_ar_fitted_values` |\n| `friedman predict regression reg` | OLS/WLS fitted values | `reg_fitted_values` |\n| `friedman predict regression statespace` | Kalman state paths, tidy long `period \\| state \\| filtered \\| smoothed` (model via `--kind`, not `--model`) | `state_space_state_paths` |\n| `friedman predict regression sur` | SUR per-equation fitted values, tidy long `equation \\| t \\| fitted`; `--config` required | `sur_fitted_values_per_equation` |\n| `friedman predict regression 3sls` | 3SLS per-equation fitted values, tidy long; `--config` required | `3sls_fitted_values_per_equation` |\n| `friedman predict univariate arima` | ARIMA fitted values (auto selection when `--p` omitted or `--auto`) | `arima_predictions` |\n| `friedman predict univariate sarima` | SARIMA fitted values | `sarima_predictions` |\n| `friedman predict univariate arfima` | ARFIMA fitted values | `arfima_predictions` |\n| `friedman predict volatility arch` | ARCH conditional variance + implied volatility | `arch_conditional_variance` |\n| `friedman predict volatility garch` | GARCH conditional variance + implied volatility | `garch_conditional_variance` |\n| `friedman predict volatility egarch` | EGARCH conditional variance + implied volatility | `egarch_conditional_variance` |\n| `friedman predict volatility gjr-garch` | GJR-GARCH conditional variance + implied volatility | `gjr_garch_conditional_variance` |\n| `friedman predict volatility igarch` | IGARCH conditional variance + implied volatility | `igarch_conditional_variance` |\n| `friedman predict volatility cgarch` | Component-GARCH conditional variance + implied volatility | `cgarch_conditional_variance` |\n| `friedman predict volatility aparch` | APARCH conditional variance + implied volatility | `aparch_conditional_variance` |\n| `friedman predict volatility figarch` | FIGARCH conditional variance + implied volatility | `figarch_conditional_variance` |\n| `friedman predict volatility fiegarch` | FIEGARCH conditional variance + implied volatility | `fiegarch_conditional_variance` |\n| `friedman predict volatility garch-midas` | GARCH-MIDAS conditional variance + implied volatility; `--m-freq` required | `garch_midas_conditional_variance` |\n| `friedman predict volatility sv` | Posterior-mean SV path (variance + volatility) per period | `sv_conditional_variance` |\n\nEvery leaf takes the `data` CSV positional plus `--format`/`-f`, `--output`/`-o`, and `--model` (saved-model handle, skips re-estimation):\n\n| Option / Flag | Leaves | Default | Description |\n|---|---|---|---|\n| `--dep` | choice \u00d77, panel \u00d74, reg, ms | first numeric | Dependent variable column name |\n| `--cov-type` | logit/probit/ologit/oprobit/mlogit (hc1; `ols\\|hc0-hc3\\|cluster`), poisson (`robust\\|mle\\|hc0-hc3\\|cluster`), reg (hc1), panel (cluster; `ols\\|cluster\\|twoway\\|driscoll-kraay`) | \u2014 | Covariance estimator |\n| `--clusters` | binary/ordered/multinomial choice, poisson, reg | \u2014 | Cluster variable column name |\n| `--weights` | reg | \u2014 | Weights column (WLS) |\n| `--threshold` | logit, probit | `0.5` | Classification threshold |\n| `--marginal-effects` (flag) | logit, probit, ologit, oprobit, mlogit | off | Average marginal effects (replaces fitted values on binary; appends per-category on ordered/multinomial) |\n| `--odds-ratio` (flag) | logit only | off | Odds ratios (replaces fitted values) |\n| `--classification-table` (flag) | logit, probit | off | Classification metrics + confusion matrix (replaces fitted values) |\n| `--offset` / `--exposure` | poisson, nbreg | \u2014 | Log-scale offset / strictly-positive exposure column (mutually exclusive) |\n| `--maxiter` / `--tol` | poisson (100), nbreg (1000), both tol 1e-10 | \u2014 | IRLS/optimizer iterations and convergence tolerance |\n| `--nfactors` / `-r` | static, dynamic, gdfm (`--nfactors` no short) | auto via IC | Factor counts |\n| `--factor-lags` / `-p` | dynamic | `1` | Factor VAR lag order |\n| `--method` | dynamic (`twostep\\|qml`) | `twostep` | Factor estimation method |\n| `--dynamic-rank` / `-q` | gdfm | auto | Dynamic rank |\n| `--lags` / `-p` | var (auto), bvar (4), vecm (2), favar (2) | \u2014 | Lag orders |\n| `--draws` / `-n` | bvar (2000), sv (5000) | \u2014 | MCMC draws |\n| `--sampler` | bvar | `direct` | Sampler |\n| `--config` (+ `--config-json`, `--set`, `--strict`) | bvar (prior), 3sls (equations+instruments, required), sur (equations, required), garch-midas (x_lf for `--rv macro`) | \u2014 | TOML configs |\n| `--rank` / `-r` | vecm | `auto` | Cointegration rank |\n| `--deterministic` | vecm | `constant` | `none`, `constant`, `trend` |\n| `--factors` / `-r` | favar | \u2014 | Number of factors |\n| `--key-vars` | favar | \u2014 | Key observed variables |\n| `--indep` | preg, plogit, pprobit | \u2014 | Independent variables (comma-separated) |\n| `--exog` / `--endog` / `--instruments` | piv | \u2014 | IV split (mirrors `estimate panel piv`; `--endog` required) |\n| `--id-col` / `--time-col` | panel \u00d74 | first/second column (piv: \u2014) | Panel group / time columns |\n| `--method` / `-m` | preg (`fe`), plogit/pprobit (`pooled`), piv (`fe`; `fe\\|re\\|fd\\|hausman-taylor`) | \u2014 | Panel estimation method |\n| `--k-regimes` | ms, ms-ar | `2` | Number of regimes (\u2265 2) |\n| `--max-iter` | ms (500), ms-ar (1000) | \u2014 | Max EM iterations |\n| `--tol` | ms | `1e-8` | EM convergence tolerance |\n| `--probs` | ms, ms-ar | `smoothed` | Regime weighting: `smoothed` or `filtered` |\n| `--no-switching-variance` (flag) | ms | off | Force common \u03c3\u00b2 (default: \u03c3\u00b2 switches) |\n| `--switching-variance` (flag) | ms-ar | off | Let \u03c3\u00b2 switch (default: Hamilton constant-variance form) |\n| `--instruments` | 3sls | `common` | Instrument mode: `common`, `perequation` |\n| `--no-intercept` (flag) | 3sls, sur | off | Do not add an intercept per equation |\n| `--iterate` (flag) | sur | off | Iterate feasible-GLS to convergence |\n| `--column` / `-c` | statespace, arima, sarima, arfima, all volatility | `1` | Column index |\n| `--kind` | statespace | `local-level` | `local-level`, `local-linear-trend` |\n| `--init-mode` / `--kappa` | statespace | `kappa` / `1e6` | Diffuse initialisation; large-\u03ba prior variance |\n| `--state` | statespace | `both` | `filtered`, `smoothed`, `both` |\n| `--p` / `--d` / `--q` | arima (auto/`0`/`0`), arfima (`0`/\u2014/`0`), sarima (auto/`0`/`0` + `--P`/`--D`/`--Q`/`--s` 12), vol pq (1/1), arch (`--q` 1), ms-ar (`--p` 1) | \u2014 | AR/differencing/MA and GARCH/ARCH orders |\n| `--method` / `-m` | arima (`ols\\|css\\|mle\\|css_mle`), arfima (`css\\|mle`), sarima (`css_mle\\|mle\\|css`) | \u2014 | Time-series estimators |\n| `--auto` (flag) | arima, sarima | off | Force automatic order selection |\n| `--max-p`/`--max-q`/`--max-P`/`--max-Q` + `--criterion` | sarima | `2`/`2`/`1`/`1`, `aic` | Auto-search bounds and criterion |\n| `--no-intercept` (flag) | sarima | off | Exclude intercept |\n| `--max-iter` | arfima, sarima | `500` | Optimizer iterations |\n| `--d0` | arfima (GPH), figarch/fiegarch (0.4) | \u2014 | Fractional-d starting value |\n| `--truncation` / `--dist` | figarch, fiegarch | `1000` / `normal` | ARCH(\u221e) truncation; innovation distribution |\n| `--fix-delta` / `--fix-gamma` | aparch | \u2014 | Fix power/asymmetry parameters |\n| `--m-freq` / `--k` / `--rv` / `--span` | garch-midas | required/`12`/`realized`/`fixed` | HF-per-LF block, MIDAS lags, driver, span |\n\n# Examples\n\n```bash\nfriedman predict regression reg :stackloss --dep stack.loss\nfriedman predict multivariate var :denmark --lags 2\nfriedman predict univariate arima :nile --p 1 --d 1 --q 1\nfriedman predict volatility garch :nile --p 1 --q 1\nfriedman predict multivariate vecm :denmark --lags 2 --rank 1 --deterministic constant\nfriedman predict choice logit :mroz --dep kidslt6 --marginal-effects\nfriedman predict regression statespace :nile --kind local-linear-trend\nfriedman predict regime ms-ar :nile --p 1 --probs filtered\nfriedman predict choice poisson :mroz --dep kidslt6\n```\n\n# See also\n\n* [Model Residuals](residuals.md) - the matching residual vector per leaf; SETAR/STAR exist only there\n* [Forecasting and Forecast Evaluation](forecast.md) - out-of-sample projections of the same models\n* [Trend-Cycle Filters and Nowcasting](filter-nowcast.md) - filters and mixed-frequency nowcasts", "forecast/residuals": "# Summary\n\nForty leaves return the matching residual vector per model: response residuals for regressions and choice models, standardized innovations for volatility models, one-step prediction errors for state-space models, idiosyncratic components for factor models, and per-category matrices for ordered and multinomial models. Every leaf re-estimates from the `data` CSV or reuses a `--model` handle; each `residuals` leaf mirrors its `estimate` sibling's fit options so any fit that changes the residuals can be reproduced, while inference-only options are omitted (`residuals regime setar` drops `--reps`/`--ci-level`/`--het` and skips the Hansen bootstrap entirely). Implementation shape (LEAVES.md open question 5, confirmed in `src/commands/fitted.jl`): the same 23-entry `FITTED_MODEL_KINDS` table behind `predict` expands into 23 residuals leaves, plus 17 hand-written specs \u2014 the same 15 as predict (sarima, poisson, nbreg, ms-ar, ms, statespace, sur, 3sls, arfima, six extended-GARCH) plus `setar` and `star`, which exist only here because upstream exposes `StatsAPI.residuals` but no fitted values for `ThresholdModel`/`STARModel` (adding a predict leaf that recomputes the MS-style weighted mean risks diverging from a definition upstream never published). Residual-kind notes: ordered/multinomial leaves take `--kind response` (default; `d\u2212P\u0302`, rows sum to zero), `pearson`, or `deviance`, and the ordered models add `--generalized` for the length-n Chesher\u2013Irish score residual \u2014 deliberately not offered on mlogit, where it is a usage error (exit 2); count models offer no `--kind` (upstream exposes a single residual vector); state-space `--standardized` divides by \u221aF_t for diagnostic checking; `period` on regime leaves is the effective-sample index (SETAR/STAR/MS-AR drop leading lags; MS regression drops nothing).\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman residuals choice logit` | Binary logit response residuals y \u2212 p | `logit_residuals` (one row per observation) |\n| `friedman residuals choice probit` | Binary probit response residuals y \u2212 p | `probit_residuals` |\n| `friedman residuals choice ologit` | Ordered-logit per-category residuals (+ optional generalized score residual) | `ordered_logit_residuals` (`resid_<cat>` per `--kind`); `ordered_logit_generalized_residuals` (`--generalized`) |\n| `friedman residuals choice oprobit` | Ordered-probit per-category residuals (+ optional generalized score residual) | `ordered_probit_residuals`; `ordered_probit_generalized_residuals` |\n| `friedman residuals choice mlogit` | Multinomial-logit per-alternative residuals (no `--generalized`: response residuals already are the generalized residuals) | `multinomial_logit_residuals` |\n| `friedman residuals choice poisson` | Poisson residuals y \u2212 \u03bc\u0302 (single kind upstream) | `poisson_residuals` |\n| `friedman residuals choice nbreg` | Negative-binomial residuals | `negative_binomial_residuals` |\n| `friedman residuals factor static` | Static-factor idiosyncratic component, one column per series | `static_factor_idiosyncratic_component` |\n| `friedman residuals factor dynamic` | Dynamic-factor idiosyncratic component | `dynamic_factor_idiosyncratic_component` |\n| `friedman residuals factor gdfm` | GDFM idiosyncratic component | `gdfm_idiosyncratic_component` |\n| `friedman residuals multivariate var` | VAR residuals, one column per variable | `var_residuals` |\n| `friedman residuals multivariate bvar` | BVAR residuals at the posterior mean | `bvar_residuals` |\n| `friedman residuals multivariate vecm` | VECM residuals via the VAR representation | `vecm_residuals` |\n| `friedman residuals multivariate favar` | FAVAR residuals | `favar_residuals` |\n| `friedman residuals panel piv` | Panel IV residuals | `panel_iv_residuals` |\n| `friedman residuals panel plogit` | Panel logit residuals | `panel_logit_residuals` |\n| `friedman residuals panel pprobit` | Panel probit residuals | `panel_probit_residuals` |\n| `friedman residuals panel preg` | Panel regression residuals | `panel_regression_residuals` |\n| `friedman residuals regime ms` | MS-regression smoothed-probability-weighted residuals (fit on levels; drops nothing) | `ms_regression_residuals` |\n| `friedman residuals regime ms-ar` | MS-AR smoothed-probability-weighted residuals; Hamilton constant-variance default | `ms_ar_residuals` (effective periods) |\n| `friedman residuals regime setar` | SETAR residuals; skips the Hansen bootstrap (no `--reps`/`--ci-level`/`--het`) | `setar_residuals` (effective periods) |\n| `friedman residuals regime star` | STAR residuals; `--transition-col 0` = self-exciting | `star_residuals` (effective periods) |\n| `friedman residuals regression 3sls` | 3SLS per-equation residuals, tidy long; `--config` required | `3sls_residuals_per_equation` |\n| `friedman residuals regression reg` | OLS/WLS residuals | `reg_residuals` |\n| `friedman residuals regression statespace` | One-step prediction errors v_t (long `period \\| residual`; `--standardized` gives v_t/\u221aF_t) | `state_space_innovations` |\n| `friedman residuals regression sur` | SUR per-equation residuals, tidy long; `--config` required | `sur_residuals_per_equation` |\n| `friedman residuals univariate arfima` | ARFIMA residuals | `arfima_residuals` |\n| `friedman residuals univariate arima` | ARIMA residuals | `arima_residuals` |\n| `friedman residuals univariate sarima` | SARIMA residuals | `sarima_residuals` |\n| `friedman residuals volatility arch` | ARCH standardized residuals | `arch_standardized_residuals` |\n| `friedman residuals volatility garch` | GARCH standardized residuals | `garch_standardized_residuals` |\n| `friedman residuals volatility egarch` | EGARCH standardized residuals | `egarch_standardized_residuals` |\n| `friedman residuals volatility gjr-garch` | GJR-GARCH standardized residuals | `gjr_garch_standardized_residuals` |\n| `friedman residuals volatility igarch` | IGARCH standardized residuals | `igarch_standardized_residuals` |\n| `friedman residuals volatility cgarch` | CGARCH standardized residuals | `cgarch_standardized_residuals` |\n| `friedman residuals volatility aparch` | APARCH standardized residuals | `aparch_standardized_residuals` |\n| `friedman residuals volatility figarch` | FIGARCH standardized residuals | `figarch_standardized_residuals` |\n| `friedman residuals volatility fiegarch` | FIEGARCH standardized residuals | `fiegarch_standardized_residuals` |\n| `friedman residuals volatility garch-midas` | GARCH-MIDAS standardized residuals; `--m-freq` required | `garch_midas_standardized_residuals` |\n| `friedman residuals volatility sv` | SV standardized residuals | `sv_standardized_residuals` |\n\nEvery leaf takes the `data` CSV positional plus `--format`/`-f`, `--output`/`-o`, and `--model` (saved-model handle, skips re-estimation). Option sets mirror the `predict` sibling except for the residual-kind surface:\n\n| Option / Flag | Leaves | Default | Description |\n|---|---|---|---|\n| `--dep` | choice \u00d77, panel \u00d74, reg, ms | first numeric | Dependent variable column name |\n| `--kind` | ologit, oprobit, mlogit | `response` | `response`, `pearson`, `deviance` |\n| `--generalized` (flag) | ologit, oprobit only | off | Length-n Chesher\u2013Irish score residual (usage error on mlogit) |\n| `--cov-type` | binary/ordered/multinomial choice (hc1), poisson (robust), reg (hc1), panel (cluster) | \u2014 | Covariance estimator (same choices as predict) |\n| `--clusters` | binary/ordered/multinomial choice, poisson, reg | \u2014 | Cluster variable column name |\n| `--weights` | reg | \u2014 | Weights column (WLS) |\n| `--offset` / `--exposure` | poisson, nbreg | \u2014 | Log-scale offset / exposure column (mutually exclusive) |\n| `--maxiter` / `--tol` | poisson (100), nbreg (1000), both tol 1e-10 | \u2014 | IRLS/optimizer iterations and tolerance |\n| `--nfactors` / `-r` | static, dynamic, gdfm (no short) | auto via IC | Factor counts |\n| `--factor-lags` / `-p` | dynamic | `1` | Factor VAR lag order |\n| `--method` | dynamic (`twostep\\|qml`) | `twostep` | Factor estimation method |\n| `--dynamic-rank` / `-q` | gdfm | auto | Dynamic rank |\n| `--lags` / `-p` | var (auto), bvar (4), vecm (2), favar (2) | \u2014 | Lag orders |\n| `--draws` / `-n` | bvar (2000), sv (5000) | \u2014 | MCMC draws |\n| `--sampler` | bvar | `direct` | Sampler |\n| `--config` (+ `--config-json`, `--set`, `--strict`) | bvar (prior), 3sls (equations+instruments, required), sur (equations, required), garch-midas (x_lf) | \u2014 | TOML configs |\n| `--rank` / `-r` | vecm | `auto` | Cointegration rank |\n| `--deterministic` | vecm | `constant` | `none`, `constant`, `trend` |\n| `--factors` / `-r` | favar | \u2014 | Number of factors |\n| `--key-vars` | favar | \u2014 | Key observed variables |\n| `--indep` | preg, plogit, pprobit | \u2014 | Independent variables (comma-separated) |\n| `--exog` / `--endog` / `--instruments` | piv | \u2014 | IV split; `--endog` required |\n| `--id-col` / `--time-col` | panel \u00d74 | first/second column (piv: \u2014) | Panel group / time columns |\n| `--method` / `-m` | preg (`fe`), plogit/pprobit (`pooled`), piv (`fe`) | \u2014 | Panel estimation method |\n| `--k-regimes` | ms, ms-ar | `2` | Number of regimes (\u2265 2) |\n| `--max-iter` | ms (500), ms-ar (1000) | \u2014 | Max EM iterations |\n| `--tol` | ms | `1e-8` | EM convergence tolerance |\n| `--no-switching-variance` (flag) | ms | off | Force common \u03c3\u00b2 (default: \u03c3\u00b2 switches) |\n| `--switching-variance` (flag) | ms-ar | off | Let \u03c3\u00b2 switch (default: Hamilton constant-variance form) |\n| `--column` / `-c` | ms-ar, setar, star, statespace, arima, sarima, arfima, all volatility | `1` | Column index |\n| `--p` | ms-ar, setar, star (1), arima (auto), arfima (0), sarima (auto), vol pq (1) | \u2014 | AR/GARCH orders |\n| `--d` | setar (`1`, String: int or `auto`), star (`1`), arima (`0`), sarima (`0` + `--P`/`--D`/`--Q`/`--s` 12) | \u2014 | Delay lag / differencing / seasonal orders |\n| `--trim` | setar | `0.15` | Threshold-grid trimming fraction in (0, 0.5) |\n| `--type` | star | `auto` | `lstr1`, `lstr2`, `estr`, `auto` |\n| `--n-gamma` / `--n-c` | star | `15` / `15` | Grid points for \u03b3 / c start values (\u2265 2) |\n| `--transition-col` | star | `0` | External transition-variable column (0 = self-exciting y[t\u2212d]) |\n| `--q` | arima/auto, vol arch (1), vol pq (1) | \u2014 | MA/ARCH orders |\n| `--method` / `-m` | arima, arfima, sarima | `css_mle`/`css`/`css_mle` | Time-series estimators (same choices as predict) |\n| `--auto` (flag) | arima, sarima | off | Force automatic order selection |\n| `--max-p`/`--max-q`/`--max-P`/`--max-Q` + `--criterion` | sarima | `2`/`2`/`1`/`1`, `aic` | Auto-search bounds and criterion |\n| `--no-intercept` (flag) | sarima, 3sls, sur | off | Exclude intercept |\n| `--max-iter` | arfima, sarima | `500` | Optimizer iterations |\n| `--d0` | arfima (GPH), figarch/fiegarch (0.4) | \u2014 | Fractional-d starting value |\n| `--truncation` / `--dist` | figarch, fiegarch | `1000` / `normal` | ARCH(\u221e) truncation; innovation distribution |\n| `--fix-delta` / `--fix-gamma` | aparch | \u2014 | Fix power/asymmetry parameters |\n| `--m-freq` / `--k` / `--rv` / `--span` | garch-midas | required/`12`/`realized`/`fixed` | HF-per-LF block, MIDAS lags, driver, span |\n| `--instruments` | 3sls | `common` | `common`, `perequation` |\n| `--iterate` (flag) | sur | off | Iterate feasible-GLS to convergence |\n| `--kind` | statespace | `local-level` | `local-level`, `local-linear-trend` |\n| `--init-mode` / `--kappa` | statespace | `kappa` / `1e6` | Diffuse initialisation; large-\u03ba prior variance |\n| `--standardized` (flag) | statespace | off | Standardized innovations v_t/\u221aF_t (replaces raw v_t) |\n\n# Examples\n\n```bash\nfriedman residuals multivariate var :denmark --lags 2\nfriedman residuals univariate arima :nile --p 1 --d 1 --q 1\nfriedman residuals volatility garch :nile --p 1 --q 1\nfriedman residuals multivariate vecm :denmark --lags 2 --rank 1 --deterministic constant\nfriedman residuals regime setar :nile --p 1 --d auto\nfriedman residuals regime star :nile --p 1 --type lstr1\nfriedman residuals regime ms-ar :nile --p 1 --k-regimes 3\nfriedman residuals regime ms :stackloss --dep stack.loss --k-regimes 2\nfriedman residuals choice ologit :mroz --dep kidslt6 --kind deviance\nfriedman residuals regression statespace :nile --standardized\nfriedman residuals choice nbreg :mroz --dep kidslt6\n```\n\n# See also\n\n* [In-Sample Fitted Values](predict.md) - fitted values from the same loop; `y \u2212 fitted` reproduces residuals on the linear leaves\n* [Forecasting and Forecast Evaluation](forecast.md) - out-of-sample projections of the same models\n* [Trend-Cycle Filters and Nowcasting](filter-nowcast.md) - filters and mixed-frequency nowcasts", "impulse/fevd": "# Summary\n\nThese 7 leaves report each structural shock's share of forecast-error variance by horizon: identified VAR FEVD (with the Pesaran-Shin `--generalized` flag), posterior-mean Bayesian FEVD, bias-corrected LP FEVD (Gorodnichenko-Lee 2019), VECM FEVD via the VAR representation, panel FEVD, FAVAR FEVD, and factor-space SDFM FEVD. Every leaf takes a required `data` CSV plus `--output`/`-o`, `--format`/`-f`, `--model`, `--result`/`--save-result` (except `pvar`, which has `--model` but no result handles), and `--plot`/`--plot-save`.\n\nOutput layout: `var`, `vecm`, `favar`, and `sdfm` render one tidy `horizon|variable|shock|value` table with shares in [0,1]; `bvar`, `lp`, and `pvar` use the older wide layout (columns are shocks, rows are horizons). `--generalized` (VAR only) sidesteps identification entirely \u2014 its correlated-shock shares do not sum to 1 unless `--normalize` rescales them, a convention rather than a derivation. There is no `fevd tvpvar` leaf upstream: TVP-VAR variance shares are not wrapped.\n\n# Functions\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman fevd var` | Identified or generalized VAR FEVD | `fevd`, `generalized_fevd`, `fevd_by_variable_*` |\n| `friedman fevd bvar` | Posterior-mean Bayesian FEVD | `bayesian_fevd_*` |\n| `friedman fevd lp` | Bias-corrected structural LP FEVD | `lp_fevd_*` |\n| `friedman fevd vecm` | VECM FEVD via VAR representation | `vecm_fevd` |\n| `friedman fevd pvar` | Panel VAR FEVD | `panel_var_fevd_*` |\n| `friedman fevd favar` | FAVAR FEVD | `favar_fevd` |\n| `friedman fevd sdfm` | Structural DFM FEVD (factor space) | `sdfm_fevd` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `var` | `data` (required) | `--lags`/`-p` (auto), `--horizons` (20), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|arias\\|uhlig\\|proxy\\|max-share\\|gmm-moments\\|narrative-adrr\\|lewis-tvv\\|sv-em), `--config`, `--instrument` (proxy), `--target-var` (max-share); flags `--generalized`, `--normalize` |\n| `bvar` | `data` (required) | `--lags`/`-p` (4), `--horizons` (20), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun), `--draws`/`-n` (2000), `--sampler` (`direct`: direct\\|gibbs), `--config` |\n| `lp` | `data` (required) | `--horizons` (20), `--lags`/`-p` (4), `--var-lags` (=lags), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun), `--vcov` (`newey_west`: newey_west\\|white\\|driscoll_kraay), `--config` |\n| `vecm` | `data` (required) | `--lags`/`-p` (2, levels), `--rank`/`-r` (`auto`), `--deterministic` (`constant`: none\\|constant\\|trend), `--horizons` (20), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|svec\\|lewis-tvv\\|sv-em), `--config` |\n| `pvar` | `data` (required, panel) | `--id-col`, `--time-col`, `--lags`/`-p` (1), `--horizons` (10) |\n| `favar` | `data` (required) | `--factors`/`-r` (auto), `--lags`/`-p` (2), `--key-vars`, `--horizons` (20), `--id` (`cholesky`), `--config` |\n| `sdfm` | `data` (required) | `--factors`/`-q` (auto), `--id` (`cholesky`: cholesky\\|sign\\|proxy\\|lewis-tvv\\|sv-em\\|gmm-moments), `--q-method` (`hallin-liska`: hallin-liska\\|bai-ng\\|amengual-watson), `--method` (`fglr`: fglr\\|gdfm-var), `--spectral` (`lag-window`: lag-window\\|smoothed-periodogram), `--instrument`, `--var-lags` (1), `--horizons` (20), `--config` |\n\n# Examples\n\n```bash\nfriedman fevd var :denmark --horizons=20 --id=cholesky\nfriedman fevd var :denmark --id=sign --config=sign_restrictions.toml\nfriedman fevd var :denmark --horizons=20 --generalized\nfriedman fevd var :denmark --horizons=20 --generalized --normalize\nfriedman fevd bvar :denmark --horizons=20 --draws=5000 --sampler=gibbs\nfriedman fevd lp :denmark --horizons=20 --id=cholesky\nfriedman fevd vecm :denmark --rank=2 --deterministic=constant --lags=4\nfriedman fevd pvar :grunfeld --id-col=group --time-col=time --horizons=10\nfriedman fevd sdfm :denmark --factors=2 --horizons=20\n```\n\n# See also\n\n* [Impulse responses](irf.md) - dynamic responses of the same identified shocks\n* [Historical decomposition](hd.md) - shock contributions over history\n* [Time-series estimation](../estimate/timeseries.md) - fitting the VAR/BVAR/LP/VECM/FAVAR/SDFM inputs", "impulse/hd": "# Summary\n\nThese 6 leaves split each observed series into per-period contributions from every structural shock plus initial conditions: frequentist VAR HD, posterior-mean Bayesian HD, structural LP HD, VECM HD via the VAR representation, FAVAR HD, and structural DFM HD in panel or factor space. Every leaf takes a required `data` CSV plus `--output`/`-o`, `--format`/`-f`, `--model`, `--result`/`--save-result`, and `--plot`/`--plot-save`.\n\nEvery leaf emits one table per variable with columns `period|actual|initial|contrib_<shock>\u2026`, each carrying a decomposition check (contributions plus initial conditions reconstruct the series). `sdfm` defaults to `--space panel` (N variables into q shocks plus an idiosyncratic column, droppable with `--no-idiosyncratic`); `--space factor` decomposes the q factors with no idiosyncratic column. There is no `hd pvar` leaf: upstream has no `historical_decomposition` method for `PVARModel`, and the guide documents it as not shipped rather than wrapping an unsupported API. Likewise there is no `hd tvpvar`.\n\n# Functions\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman hd var` | Frequentist historical decomposition | `historical_decomposition_*` |\n| `friedman hd bvar` | Posterior-mean Bayesian HD | `bayesian_hd_*` |\n| `friedman hd lp` | HD via structural local projections | `lp_historical_decomposition_*` |\n| `friedman hd vecm` | VECM HD via VAR representation | `vecm_historical_decomposition_*` |\n| `friedman hd favar` | FAVAR historical decomposition | `favar_historical_decomposition_*` |\n| `friedman hd sdfm` | Structural DFM HD, panel or factor space | `sdfm_historical_decomposition_*` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `var` | `data` (required) | `--lags`/`-p` (auto), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|arias\\|uhlig\\|proxy\\|max-share\\|gmm-moments\\|narrative-adrr\\|lewis-tvv\\|sv-em), `--config`, `--instrument` (proxy), `--target-var` (max-share) |\n| `bvar` | `data` (required) | `--lags`/`-p` (4), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun), `--draws`/`-n` (2000), `--sampler` (`direct`: direct\\|gibbs), `--config` |\n| `lp` | `data` (required) | `--lags`/`-p` (4), `--var-lags` (=lags), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun), `--vcov` (`newey_west`: newey_west\\|white\\|driscoll_kraay), `--config` |\n| `vecm` | `data` (required) | `--lags`/`-p` (2, levels), `--rank`/`-r` (`auto`), `--deterministic` (`constant`: none\\|constant\\|trend), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|svec\\|lewis-tvv\\|sv-em), `--config` |\n| `favar` | `data` (required) | `--factors`/`-r` (auto), `--lags`/`-p` (2), `--key-vars`, `--horizons` (20), `--id` (`cholesky`), `--config` |\n| `sdfm` | `data` (required) | `--factors`/`-q` (auto), `--id` (`cholesky`: cholesky\\|sign\\|proxy\\|lewis-tvv\\|sv-em\\|gmm-moments), `--q-method` (`hallin-liska`: hallin-liska\\|bai-ng\\|amengual-watson), `--method` (`fglr`: fglr\\|gdfm-var), `--spectral` (`lag-window`: lag-window\\|smoothed-periodogram), `--instrument`, `--var-lags` (1), `--horizons` (20), `--config`, `--space` (`panel`: panel\\|factor); flag `--no-idiosyncratic` (panel only) |\n\n# Examples\n\n```bash\nfriedman hd var :denmark --id=cholesky\nfriedman hd var :denmark --id=longrun --lags=4\nfriedman hd var :denmark --id=sign --config=sign_restrictions.toml\nfriedman hd bvar :denmark --draws=2000\nfriedman hd lp :denmark --id=sign --config=sign_restrictions.toml --vcov=white\nfriedman hd vecm :denmark --rank=2 --deterministic=constant --lags=4\nfriedman hd favar :denmark --lags=2 --key-vars=LRM,LRY,LPY\nfriedman hd sdfm :denmark --factors=2 --horizons=20\nfriedman hd sdfm :denmark --factors=2 --space=factor\n```\n\n# See also\n\n* [Impulse responses](irf.md) - dynamic responses of the same identified shocks\n* [Variance decomposition](fevd.md) - variance shares of the same identified shocks\n* [Time-series estimation](../estimate/timeseries.md) - fitting the VAR/BVAR/LP/VECM/FAVAR/SDFM inputs", "impulse/irf": "# Summary\n\nThese 8 leaves trace dynamic responses to structural shocks: frequentist VAR IRFs with the full 22-method identification surface, Bayesian IRFs with 68% credible bands (plus Giacomini-Kitagawa robust Bayes), date-specific TVP-VAR-SV IRFs, multi-shock structural LP IRFs, VECM IRFs via the VAR representation, panel OIRF/GIRF, and factor-wide FAVAR/SDFM IRFs. Every leaf takes a required `data` CSV plus `--output`/`-o`, `--format`/`-f`, `--model` (skip re-estimation from a saved handle), `--result`/`--save-result` (except `pvar`, which has `--model` but no result handles), and `--plot`/`--plot-save`.\n\nOutput layout: `var`, `bvar`, `tvpvar`, `lp`, `vecm`, `favar`, and `sdfm` render one tidy `horizon|variable|shock|value|lower|upper` table (`var`/`bvar`/`tvpvar`/`vecm` filter to `--shock`; `lp` to `--shock`/`--shocks`; `favar`/`sdfm` return every shock). `pvar` and the Arias/Uhlig/identified-set paths use the older wide per-shock layout. Sign/narrative IRFs report the identified-set median with set-robust bands by default; `--identified-set` with `--summary` selects an alternative set summary.\n\n# Functions\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman irf var` | Frequentist IRFs, full identification surface | `irf`, `irf_identified_set`, `arias_importance_sampling_diagnostics` |\n| `friedman irf bvar` | Bayesian IRFs, 68% credible bands | `bayesian_irf`, `robust_bayes_bands`, `robust_bayes_diagnostics` |\n| `friedman irf tvpvar` | Date-specific TVP-VAR-SV IRF | `tvpvar_irf` |\n| `friedman irf lp` | Structural LP IRFs, multi-shock | `lp_irf` |\n| `friedman irf vecm` | VECM IRFs via VAR representation | `vecm_irf` |\n| `friedman irf pvar` | Panel OIRF/GIRF with bootstrap bands | `panel_var_oirf_*`, `panel_var_girf_*` |\n| `friedman irf favar` | FAVAR IRFs, factor- or panel-wide | `favar_irf` |\n| `friedman irf sdfm` | Structural DFM IRFs, panel-wide | `sdfm_irf` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `var` | `data` (required) | `--lags`/`-p` (auto), `--shock` (1), `--horizons` (20), `--id` (`cholesky`: 22 methods incl. sign/narrative/longrun/arias/uhlig/fastica/jade/sobi/dcov/hsic/student_t/mixture_normal/pml/skew_normal/markov_switching/garch_id/proxy/max-share/gmm-moments/narrative-adrr/lewis-tvv/sv-em), `--ci` (`bootstrap`: none\\|bootstrap\\|theoretical), `--replications` (1000), `--instrument` (proxy), `--target-var` (max-share), `--bootstrap` (`iid`: iid\\|wild\\|block), `--block-length` (0), `--wild-dist` (`rademacher`: rademacher\\|mammen), `--bias-reps` (0), `--config`, `--summary` (`none`: none\\|median-target\\|modal-model\\|joint-band\\|sup-t-band); flags `--cumulative`, `--identified-set`, `--stationary-only`, `--bias-correct` |\n| `bvar` | `data` (required) | `--lags`/`-p` (4), `--shock` (1), `--horizons` (20), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|robust-bayes), `--draws`/`-n` (2000), `--sampler` (`direct`: direct\\|gibbs), `--config`; flag `--cumulative` |\n| `tvpvar` | `data` (required) | `--date` (required, 1:T_eff), `--horizons` (20), `--shock` (1), `--lags`/`-p` (2), `--draws`/`-n` (2000), `--burnin` (1000), `--thin` (1), `--n-train` (0), `--k-q` (0.01), `--k-s` (0.1), `--k-w` (0.01), `--irf-draws` (500); flags `--no-tvp`, `--no-sv`, `--no-stationary-only` |\n| `lp` | `data` (required) | `--shock` (1), `--shocks` (comma-list), `--horizons` (20), `--lags`/`-p` (4), `--var-lags` (=lags), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun), `--ci` (`none`: none\\|bootstrap), `--replications` (200), `--conf-level` (0.95), `--vcov` (`newey_west`: newey_west\\|white\\|driscoll_kraay), `--config`; flag `--cumulative` |\n| `vecm` | `data` (required) | `--lags`/`-p` (2, levels), `--rank`/`-r` (`auto`), `--deterministic` (`constant`: none\\|constant\\|trend), `--shock` (1), `--horizons` (20), `--id` (`cholesky`: cholesky\\|sign\\|narrative\\|longrun\\|svec\\|lewis-tvv\\|sv-em), `--ci` (`bootstrap`), `--replications` (1000), `--config` |\n| `pvar` | `data` (required, panel) | `--id-col`, `--time-col`, `--lags`/`-p` (1), `--horizons` (10), `--irf-type` (`oirf`: oirf\\|girf), `--boot-draws` (500), `--confidence` (0.95) |\n| `favar` | `data` (required) | `--factors`/`-r` (auto), `--lags`/`-p` (2), `--key-vars`, `--horizons` (20), `--id` (`cholesky`), `--config`; flag `--panel-irf` |\n| `sdfm` | `data` (required) | `--factors`/`-q` (auto), `--id` (`cholesky`: cholesky\\|sign\\|proxy\\|lewis-tvv\\|sv-em\\|gmm-moments), `--q-method` (`hallin-liska`: hallin-liska\\|bai-ng\\|amengual-watson), `--method` (`fglr`: fglr\\|gdfm-var), `--spectral` (`lag-window`: lag-window\\|smoothed-periodogram), `--instrument`, `--var-lags` (1), `--horizons` (40), `--config`, `--ci` (`none`: none\\|bootstrap), `--reps` (200) |\n\n# Examples\n\n```bash\nfriedman irf var :denmark --shock=1 --horizons=20\nfriedman irf var :denmark --id=sign --config=sign_restrictions.toml\nfriedman irf var :denmark --id=longrun --horizons=40\nfriedman irf var :denmark --ci=bootstrap --bootstrap=wild --wild-dist=mammen\nfriedman irf bvar :denmark --shock=1 --horizons=20 --draws=5000 --sampler=gibbs\nfriedman irf tvpvar :denmark --date=40 --shock=1 --horizons=20\nfriedman irf lp :denmark --shocks=1,2,3 --id=cholesky --horizons=30\nfriedman irf pvar :grunfeld --id-col=group --time-col=time --irf-type=girf\nfriedman irf favar :denmark --lags=2 --panel-irf\nfriedman irf sdfm :denmark --factors=2 --horizons=40\n```\n\n# See also\n\n* [Variance decomposition](fevd.md) - variance shares of the same identified shocks\n* [Historical decomposition](hd.md) - shock contributions over history\n* [Time-series estimation](../estimate/timeseries.md) - fitting the VAR/BVAR/LP/VECM/FAVAR/SDFM inputs", "infra/model-handles": "# Summary\n\nThe `model` group holds exactly two leaves: `model info` reads a handle header (magic, model type, writing vs runtime CLI/MEMs versions, dimensions) without re-running estimation, and `model reproduce` re-runs the estimator from the recorded seed and diffs fields bit-for-bit. Both accept `.jld2` (native MEMs `save_model`), `.fmod` (interim Serialization with a `FRIEDMAN_FMOD_v1` header), and `model://` serve-session handles.\n\nLEAVES.md open question 2 resolved: `model.md` has exactly `friedman model info` and `friedman model reproduce` \u2014 there is no `schema` leaf in this file. `schema` is a separate registry-hidden singleton leaf (`friedman schema [path...]`, `src/commands/schema.jl`) with its own dispatcher and raw-JSON output; see [CLI Engine](../configuration/cli-engine.md).\n\n# Functions\n\n| Leaf | Summary | Output tables |\n|---|---|---|\n| `friedman model info` | Inspect a handle: type, versions, dimensions | `model_handle_info` |\n| `friedman model reproduce` | Verify a handle by re-running its estimator from the recorded seed | `model_reproduce_summary`, `model_reproduce_fields` (only when field diffs exist) |\n\n`model info` arguments:\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `path` | `String` | yes | Path to `.jld2`/`.fmod` handle or `model://` session handle |\n\n`model info` options:\n\n| Option | Short | Type | Default | Choices | Description |\n|---|---|---|---|---|---|\n| `--output` | `-o` | `String` | `\"\"` | \u2014 | Export results to file |\n| `--format` | `-f` | `String` | `table` | `table`, `csv`, `json` | table\\|csv\\|json |\n\n`model reproduce` arguments:\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `path` | `String` | yes | Handle path (`.jld2`, `.fmod`, or `model://` session handle) |\n\n`model reproduce` options:\n\n| Option | Short | Type | Default | Choices | Description |\n|---|---|---|---|---|---|\n| `--output` | `-o` | `String` | `\"\"` | \u2014 | Export results to file |\n| `--format` | `-f` | `String` | `table` | `table`, `csv`, `json` | table\\|csv\\|json |\n\nBehavior notes (from `src/commands/model.jl`, `src/model_handle.jl`):\n\n- `model info` on `model://` describes the live serve-session object (magic reads `serve-session (model://)`); on `.jld2` it reads the native header; otherwise the `.fmod` header. A native-only `note` row appears when the header carries one.\n- `model reproduce` exit is 0 whenever the handle loads: `matched=true` is bit-for-bit equality, `matched=missing` renders `unverifiable (no recorded seed)` (no seed recorded, or a type upstream never implemented `reproduce` for). Only an unloadable handle errors.\n- `.fmod` loads enforce exact CLI and MEMs version equality (`env/model-version`, exit 6); a bad magic or corrupt payload is also exit 6. Native `.jld2` uses MEMs' own versioned registry (352 types at v1.0.0).\n- The reproduce report records `threads_captured \u2192 threads_current`: a thread-count change can break bit-equality honestly.\n\n# Examples\n\n```bash\nfriedman estimate multivariate var macro.csv --lags 2 --save-model var\nfriedman model info var\nfriedman model info var.jld2 --format json\nfriedman model reproduce var --seed 7\n```\n\n# See also\n\n* [Serve & Show](serve-show.md) - `show` renders any handle's payload; `serve --mcp` hosts `model://` handles\n* [REPL & Completions](repl-completions.md) - in-memory result cache as the alternative to `--save-model` files\n* [Handles & Output](../configuration/output-envelope.md) - stem resolution and the `.jld2`/`.fmod` save rules", "infra/repl-completions": "# Summary\n\nLEAVES.md open question 1 resolved: the REPL is not a generated leaf \u2014 `friedman repl` is intercepted as the first argv token in `run_cli` (`src/Friedman.jl`) and launches `start_repl()`; it never enters the registry tree. Inside, every `friedman <args>` invocation runs as `<args>` at the `friedman>` prompt, plus session state: `data use` loads a dataset once, later commands omit the positional (injected by tree-walking the registry), `estimate` results are cached in memory keyed by model type, and downstream commands (`irf`, `fevd`, `hd`, `forecast`, `predict`, `residuals`) reuse the cache instead of re-estimating. Session data and cached models vanish on exit \u2014 nothing is written unless `--save-model`/`--output` is used.\n\n# Functions\n\n| Leaf | Summary | Output tables |\n|---|---|---|\n| `friedman completions bash` | Print bash completion script | none (prints a script, not a table) |\n| `friedman completions fish` | Print fish completion script | none (prints a script, not a table) |\n| `friedman completions zsh` | Print zsh completion script | none (prints a script, not a table) |\n\nEach completions leaf takes no arguments and one option:\n\n| Option | Short | Type | Default | Description |\n|---|---|---|---|---|\n| `--output` | `-o` | `String` | `\"\"` | Write script to file instead of stdout |\n\nREPL-only commands (from `repl_dispatch`, not registry leaves):\n\n| Command | Description |\n|---|---|\n| `data use <path>` | Load a CSV file into the session (`~` expanded; stems resolved as in `data load`) |\n| `data use :<name>` | Load a bundled dataset (any name from `data list`, either separator spelling) |\n| `data current` | Show session path, dimensions, and cached model types |\n| `data clear` | Clear dataset and all cached results |\n| `exit` / `quit` | Leave the REPL (also Ctrl-D / EOF) |\n\nBehavior notes (from `src/repl.jl`, `docs/src/repl.md`):\n\n- Data injection walks the registry tree (`_walk_command_path`, no extension sniffing) and inserts the session path after the command path when the leaf has no positional yet; an explicit positional overrides for that invocation. Loading new data clears all cached results.\n- Model-type detection follows v1.0.0 family paths (`estimate|predict|residuals|forecast|test <family> <model>`); multiple model types coexist (`irf var` uses cached VAR, `irf bvar` cached BVAR); re-estimating replaces the cache entry.\n- Tab completion is precomputed once per session (`CompletionIndex`: subcommand names per path plus `--option`/`--flag` names per leaf); quoted strings are respected when splitting input lines.\n- Errors print a message and return to the prompt; the REPL never calls `exit()`, so exit codes do not apply inside a session.\n- Completions scripts live in `completions/` (`friedman.bash`, `friedman.zsh`, `_friedman.fish`), regenerated by `docs/generate_cli_reference.jl`; a missing file is `env/completions-missing` (exit 6).\n\n# Examples\n\n```bash\nfriedman completions bash > /etc/bash_completion.d/friedman\nfriedman completions zsh --output _friedman\nfriedman repl\n```\n\n```text\nfriedman> data use :fred-md\nfriedman> estimate multivariate var --lags 4\nfriedman> irf var --horizons 20\nfriedman> fevd var --horizons 20\nfriedman> data current\nfriedman> data clear\nfriedman> exit\n```\n\n# See also\n\n* [Model Handles](model-handles.md) - `--save-model` files as the persistent alternative to the REPL cache\n* [Serve & Show](serve-show.md) - `serve --mcp` sessions vs interactive REPL sessions\n* [Handles & Output](../configuration/output-envelope.md) - stem resolution shared by `data use` and argv paths", "infra/serve-show": "# Summary\n\n`friedman serve` is a singleton leaf (no subcommands) that projects the whole registry as MCP tools: `tools/list` mirrors every leaf with its draft-07 `inputSchema`, and `tools/call` reconstructs an argv, runs it through `run_cli` with `--format json` forced, and returns the JSON envelope verbatim as text content (`isError` on nonzero exit). `friedman show` is the read side of the handle system: it resolves one stem and renders whatever it holds \u2014 descriptive statistics for data containers, `long_table`/`DataFrame`/field dump for models and results, keys-only table for bundles.\n\n# Functions\n\n| Leaf | Summary | Output tables |\n|---|---|---|\n| `friedman serve` | Serve every command as an MCP tool over stdio (`--mcp`) | none (stdout is the JSON-RPC channel) |\n| `friedman show` | Render any loadable handle (data, model, or result) | `show_payload`, `show_summary` |\n\n`serve` flags (no arguments, no options):\n\n| Flag | Short | Description |\n|---|---|---|\n| `--mcp` | \u2014 | MCP server: JSON-RPC 2.0 on stdio; tools/list mirrors the registry, tools/call returns the JSON envelope verbatim |\n\n`show` arguments:\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `path` | `String` | yes | Handle stem or path |\n\n`show` options:\n\n| Option | Short | Type | Default | Choices | Description |\n|---|---|---|---|---|---|\n| `--output` | `-o` | `String` | `\"\"` | \u2014 | Write to file instead of stdout |\n| `--format` | `-f` | `String` | `table` | `table`, `csv`, `json` | table\\|csv\\|json |\n| `--plot-save` | \u2014 | `String` | `\"\"` | \u2014 | Save interactive plot to HTML file |\n\n`show` flags:\n\n| Flag | Short | Description |\n|---|---|---|\n| `--plot` | \u2014 | Open interactive plot if a recipe exists |\n\nBehavior notes (from source):\n\n- `serve` without `--mcp` is `usage/missing` (exit 2); `--mcp` is the only supported mode. The server speaks line-delimited JSON-RPC 2.0 (`initialize`, `tools/list` with optional `prefix` filter, `tools/call`, `ping`); `serve` itself is excluded from the tool list. Request handling is serial.\n- MCP argv reconstruction: positionals in declared order (stops at the first absent one), then options as `--name value`, then flags when `true`; unknown keys are passed through so the strict parser answers with its typed did-you-mean error.\n- The session `model://` store lives exactly as long as the serve loop; each tool call runs under stdout redirection to a tempfile (Julia 1.13 has no `redirect_stdout(IOBuffer)`) while responses go to the `output` IO captured at loop start.\n- `show` resolves via `resolve_stem(; slot=:result)`: `STEM.jld2` if it exists, else the exact path \u2014 no CSV fallback. `:timeseries`/`:panel`/`:cross_section` emit descriptive stats; `:io` and other kinds fall through to `long_table`/`DataFrame`/field dump (never `to_matrix` on IO data). `--plot`/`--plot-save` call `_maybe_plot`; a missing recipe is `model/unsupported` (exit 5).\n\n# Examples\n\n```bash\nfriedman serve --mcp\nfriedman show var\nfriedman show irf --format json\nfriedman show macro --plot --plot-save macro.html\n```\n\n# See also\n\n* [Model Handles](model-handles.md) - header inspection and bit-for-bit verification of the same handles\n* [REPL & Completions](repl-completions.md) - interactive alternative to the serve session\n* [CLI Engine](../configuration/cli-engine.md) - registry, `schema`, and the dispatch pipeline behind MCP", "installation-architecture/architecture": "# Summary\n\n`bin/friedman ARGS` activates the project, instantiates when the Manifest is absent, and runs `Friedman.main(ARGS)` \u2192 `run_cli(ARGS)` \u2192 `dispatch(APP, args)`, where `APP` is the registry-built tree memoized once at precompile. CSV is the import format, not the working format: commands take stems, `data import` converts to typed `.jld2` (MEMs `save_model`/`load_model`), estimators save `--save-model` handles, downstream leaves reload via `--model`/`--result`, and `show STEM` renders anything loadable. Results reach DataFrames through `long_table` (array-valued results), `DataFrame(model)` (coefficient models), or hand-built frames where MEMs has no matching type; `io` matrices and regime-transition matrices render wide. The machine surface \u2014 command tree, option surface, envelope schema, stable table keys, error taxonomy, exit codes \u2014 is the API: envelope v1 is frozen at v1.0.0, minors are additive-only, removals happen only at majors after a deprecation alias.\n\n# Functions\n\n| Stage | Component | Role |\n|---|---|---|\n| Launch | `bin/friedman` | Activate, instantiate-if-needed, `Friedman.main(ARGS)` |\n| Entry | `run_cli` | Intercept `repl`, strip leading globals, dispatch, map errors to exits |\n| Tree | `build_app` / `APP` | Register every top-level group once; memoized const |\n| Dispatch | `dispatch_node` / `dispatch_leaf` | Token-match walk; tokenize \u2192 bind \u2192 handler |\n| Data in | `data import --kind` | CSV/`:example` \u2192 typed `STEM.jld2` |\n| Persist | `--save-model` / `--model` | Estimator \u2192 handle; downstream reload (skip re-estimation) |\n| Result cache | `--save-result` / `--result` | Result object \u2192 handle; re-render without recompute |\n| Render | `output_result` | `:table` PrettyTables / `:csv` CSV.write / `:json` envelope |\n| Plot | `_maybe_plot` | `--plot` / `--plot-save` on every show path |\n\nStem rules (from `docs/src/architecture.md`, `src/handles.jl`):\n\n| Direction | Rule |\n|---|---|\n| Save, no suffix | Append `.jld2` (native `save_model`) |\n| Save `.jld2` | Native handle (incl. `data import -o out.jld2`) |\n| Save `.fmod` | Interim Serialization handle (unregistered types) |\n| Save `.csv` (data-edit only) | CSV export; frequency/tcode/dates dropped |\n| Save `.jld2` from CSV edit | Refused (`usage/invalid`; run `data import` first) |\n| Load data slot | `path.jld2` if exists, else `path.csv`, else exact path; else `data/file-not-found` |\n| Load `--model` | `STEM.jld2` if exists (no CSV fallback), then type-check |\n| Load `--result` / `show` | `STEM.jld2` if exists, else exact path; no CSV fallback |\n\nModule structure (`src/`):\n\n| Path | Role |\n|---|---|\n| `Friedman.jl` | Imports, includes, `build_app`, `APP`, `run_cli`, `main`, `julia_main` |\n| `cli/types.jl`, `parser.jl`, `dispatch.jl`, `help.jl` | Command structs, tokenizer/binder, dispatcher, help printer |\n| `io.jl` | Example datasets, `load_data`, emitters, global flags, path validation |\n| `output/errors.jl`, `envelope.jl`, `render.jl` | Error taxonomy, envelope accumulator, renderers |\n| `config.jl` | TOML loaders and `get_*` accessors |\n| `model_handle.jl`, `handles.jl` | `.fmod`/native dispatch, stem resolver |\n| `registry/spec.jl`, `adapter.jl`, `families.jl` | `CommandSpec`, `wrap_legacy` adapter, family promotion |\n| `commands/*.jl` | One file per family (`shared.jl` first; `fitted.jl` = predict+residuals; `multipliers.jl` helpers only) |\n| `repl.jl` | Interactive session |\n\nDependencies (from `Project.toml`, `docs/src/architecture.md`):\n\n| Package | Purpose |\n|---|---|\n| `MacroEconometricModels` (=1.0.0) | Core econometric library |\n| `CSV`, `DataFrames`, `PrettyTables`, `JSON3` | Loading, tables, terminal format, JSON |\n| `JLD2` (explicit import) | Activates the MEMs JLD2 extension for native handles |\n| `FFTW` | Activates the MEMs FFTW extension (GDFM/spectral) |\n| `TOML`, `LinearAlgebra`, `Statistics`, `SparseArrays`, `Random`, `Logging`, `Serialization`, `Dates` | Stdlib: config, math, RNG, logging, `.fmod`, dates |\n| JuMP + Ipopt | DSGE constrained optimization; bundled in release builds (no separate install) |\n| PATHSolver | Never bundled; niche DSGE constrained path only (`Pkg.add(\"PATHSolver\")` if needed) |\n\n# Examples\n\n```bash\nfriedman data import macro.csv --kind timeseries -o macro\nfriedman estimate multivariate var macro --lags 2 --save-model var\nfriedman irf var --model var --horizons 20 --save-result irf\nfriedman show irf\nfriedman forecast evaluate metrics macro --actual gdp --result fcst_var,fcst_bvar\n```\n\n# See also\n\n* [Installation](installation.md) - getting the launcher and sysimage onto PATH\n* [Testing & Releases](testing.md) - tiers that guard this structure\n* [CLI Engine](../configuration/cli-engine.md) - tree, parser, and registry in depth", "installation-architecture/installation": "# Summary\n\nOne-line installers fetch a platform archive from GitHub Releases into `~/.friedman-cli/` and put `friedman` on PATH. The installer first ensures Julia 1.13 (via juliaup \u2014 installing juliaup itself when needed \u2014 without changing the default Julia), resolves the version (latest via the GitHub API, or a pinned `--version` / `$env:FRIEDMAN_VERSION`), downloads `friedman-vX.Y.Z-<platform>-<arch>.tar.gz` (`.zip` on Windows), verifies `checksums.sha256` when possible, extracts with safe replacement of the old install, and symlinks `~/.local/bin/friedman` (macOS/Linux) or extends the user PATH (Windows). Re-running upgrades; removal is one `rm`. From source, `Pkg.instantiate()` plus `julia --project bin/friedman` is enough, or `julia build_release.jl` builds a local sysimage.\n\n# Functions\n\n| Step | macOS/Linux (`install.sh`) | Windows (`install.ps1`) |\n|---|---|---|\n| Quick install | `curl -fsSL .../install.sh \\| bash` | `irm .../install.ps1 \\| iex` |\n| Pin a version | `bash -s -- --version 1.0.0` | `$env:FRIEDMAN_VERSION = \"1.0.0\"; irm ... \\| iex` |\n| Archive name | `friedman-vX.Y.Z-darwin-arm64.tar.gz` / `-linux-x86_64.tar.gz` | `friedman-vX.Y.Z-windows-x86_64.zip` |\n| Julia bootstrap | juliaup, or existing Julia \u2265 1.13 kept | juliaup via winget, or existing Julia \u2265 1.13 kept |\n| Install dir | `~/.friedman-cli/`, shim `~/.local/bin/friedman` | `%USERPROFILE%\\.friedman-cli\\`, `bin` on user PATH |\n| Uninstall | `rm -rf ~/.friedman-cli ~/.local/bin/friedman` | Remove dir + `%USERPROFILE%\\.friedman-cli\\bin` from PATH |\n\nRequirements and build-from-source (from `docs/src/installation.md`, `Project.toml`):\n\n| Item | Value |\n|---|---|\n| Julia | `>= 1.13` (compat `julia = \"1.13\"`; installer adds 1.13 via juliaup) |\n| CLI version | `1.0.0` (single source of truth: `Project.toml`, read as `FRIEDMAN_VERSION` at precompile) |\n| MacroEconometricModels | `=1.0.0` (exact pin) |\n| Source build | `git clone ... && julia --project -e 'using Pkg; Pkg.instantiate()'` |\n| Run from source | `julia --project bin/friedman <command> ...` (auto-instantiates when Manifest absent) |\n| Local sysimage | `julia build_release.jl`, then `~/.friedman-cli/bin/friedman --version` |\n\nBehavior notes:\n\n- Version fetch failures (e.g. GitHub API rate limits) print a pin-a-version workaround and exit 1; unsupported OS/arch exits 1 with the supported list.\n- Checksum verification uses `sha256sum` (Linux) or `shasum -a 256` (macOS); a missing tool or checksums file warns and continues rather than failing.\n- Release sysimages use `--strip-metadata` when healthy; x86-64 images target baseline `generic` so the compile fits the Linux runner.\n- `bin/friedman-wrapper` prefers `friedman.so` when present, else plain Julia (see [CLI Engine](../configuration/cli-engine.md)).\n\n# Examples\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/FriedmanJP/Friedman-cli/master/install.sh | bash\ncurl -fsSL https://raw.githubusercontent.com/FriedmanJP/Friedman-cli/master/install.sh | bash -s -- --version 1.0.0\nfriedman --version\nrm -rf ~/.friedman-cli ~/.local/bin/friedman\n```\n\n```powershell\nirm https://raw.githubusercontent.com/FriedmanJP/Friedman-cli/master/install.ps1 | iex\n```\n\n```bash\ngit clone https://github.com/FriedmanJP/Friedman-cli.git\ncd Friedman-cli\njulia --project -e 'using Pkg; Pkg.instantiate()'\njulia --project bin/friedman estimate multivariate var macro.csv --lags 2\n```\n\n# See also\n\n* [Architecture](architecture.md) - what the installed launcher executes\n* [Testing & Releases](testing.md) - verifying a source checkout and the release record\n* [CLI Engine](../configuration/cli-engine.md) - `bin/friedman` vs `bin/friedman-wrapper` dispatch", "installation-architecture/testing": "# Summary\n\nThree tiers: fast (`test/runtests.jl` \u2014 engine units plus handler tests against `test/mocks.jl`, no MacroEconometricModels needed), integration (`test/integration/runtests.jl` \u2014 the gate for handler changes, run against real MEMs with hermetic DGP fixtures in `test/integration/dgp.jl`, asserting envelope schema-validity, scalar sanity, and non-empty shapes), and e2e (`test/test_e2e.jl` \u2014 T4 subprocess battery, active when `CI=1` or `FRIEDMAN_E2E=1`, asserting stdout is exactly one JSON document per invocation). `test/golden/` pins byte-level output (render envelope/table/CSV, spectral, filter, estimate/forecast, error envelopes); `test/tools/` holds drift gates (`check_table_keys.jl` for W3 envelope-key stability, `check_handle_kinds.jl`, `check_mock_surface.jl`, `check_plot_coverage.jl`, `validate_envelopes.py` conformant draft-07 validation, `regen_golden.jl`). The CHANGELOG (Keep a Changelog + SemVer; pre-v0.6.0 in git tags) records v1.0.0 as the freeze: 477 leaves / 21 top-levels, MEMs exact `=1.0.0`, Julia 1.13, family promotion, `var`\u2192`multivariate` rename, frozen envelope v1, removed snake_case aliases and `FRIEDMAN_LEGACY_OUTPUT`.\n\n# Functions\n\n| Tier | Command | What it proves |\n|---|---|---|\n| Fast | `julia --project test/runtests.jl` | Engine (types/parser/help/dispatch), handlers on mocks, single-JSON-per-invocation, golden byte-equality |\n| Integration | `julia --project test/integration/runtests.jl` | Real-MEMs envelopes schema-valid, scalars sane, tables non-empty; closed-form VAR checks (`var_irf`, `var_fevd`, `lyapunov_gamma0`) |\n| E2E (T4) | `CI=1 julia --project test/runtests.jl` | Subprocess stdout is exactly one JSON document; real launcher path |\n\nTest-tree layout:\n\n| Path | Contents |\n|---|---|\n| `test/runtests.jl` | Fast runner (includes engine files + `mocks.jl` directly) |\n| `test/test_commands.jl` | Handler suites (estimate/test/irf/\u2026 incl. kebab-only C055 checks) |\n| `test/test_handles.jl` | Stem resolution and handle-type suites |\n| `test/test_repl.jl` | Session injection/caching suites |\n| `test/test_e2e.jl` | T4 subprocess battery (gated on `CI`/`FRIEDMAN_E2E`) |\n| `test/golden/` | Pinned outputs (`render.*`, `spectral.*`, `filter.*`, `estimate.*`, `forecast.*`, error envelopes) |\n| `test/integration/runtests.jl` (+`_full.jl`, `dgp.jl`, `fixtures/`) | Real-MEMs gate with hermetic generators |\n| `test/integration/schema_validate.jl` | In-repo envelope subset validator |\n| `test/tools/` | `check_table_keys`, `check_handle_kinds`, `check_mock_surface`, `check_plot_coverage`, `dump_input_schemas`, `regen_golden`, `validate_envelopes.py` |\n| `test/schema_validator.jl`, `support.jl`, `mocks.jl` | Shared validators, helpers, mock MEMs surface |\n\nRelease record notes (from `CHANGELOG.md` head):\n\n- v1.0.0 (2026-09-20): first major; depth-2 leaves gain family middle segments (`estimate volatility garch`, `test unit-root adf`; family `other` stays flat); `did test *` \u2192 `test did *`; 11 HouseholdSystem leaves \u2192 top-level `hadsge`; `multipliers nardl` folds onto `estimate univariate nardl`; removed spellings exit 2 naming the new path.\n- `data simulate` (21 leaves): each emits `simulated_data` + flattened `population_truth` + `simulation_settings`; `--seed` builds the `Xoshiro` the simulators require.\n- Julia 1.13: ~1.8x faster cold runs vs 1.12; tempfile stdout capture stays (`redirect_stdout(IOBuffer)` unavailable).\n\n# Examples\n\n```bash\njulia --project test/runtests.jl\njulia --project test/integration/runtests.jl\nCI=1 julia --project test/runtests.jl\nFRIEDMAN_T3_DUMP_ENVELOPES=/tmp/env-dump julia --project test/integration/runtests.jl\npython3 test/tools/validate_envelopes.py /tmp/env-dump\n```\n\n# See also\n\n* [Installation](installation.md) - source checkout these commands run from\n* [Architecture](architecture.md) - the structure under test\n* [Handles & Output](../configuration/output-envelope.md) - envelope schema the validators enforce", "io/classical": "# Summary\n\nClassical linear IO over the Leontief inverse `L = (I - A)^-1` (demand-driven, `A = Z x^-1`) and the Ghosh inverse `G = (I - B)^-1` (supply-driven, `B = x^-1 Z`). Square matrices render wide (first column `sector`, then one column per sector); vector results render one row per sector. All leaves accept the shared IO input options (`--data`, `--n-sectors`, `--n-fd`, `--sectors`; default `:wiot`) plus `--format`/`--output`; leaves reading downloaded MRIO tables add `--parser csv|icio`.\n\nResolved open question \u2014 multipliers coverage: the counted leaf is `friedman io multipliers` (registered at `src/commands/io.jl` path `[\"io\",\"multipliers\"]`, in `generated/io.md`). `src/commands/multipliers.jl` is helpers-only \u2014 the legacy top-level `multipliers nardl` was folded into `estimate univariate nardl` at v1.0.0 (see the path-replacement map in `src/registry/families.jl` and the INVENTORY.md note \"NO multipliers top-level\"); there is no `generated/multipliers.md` and no separate leaf to count. The word \"multipliers\" in `estimate.md` output tables (`ardl_long_run_coefficients`, `nardl_*`) denotes tables of the NARDL/ARDL leaves, not leaves. No double-count.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman io leontief` | Demand-driven `A` and `L` | `technical_coefficients_a`, `leontief_inverse_l` |\n| `friedman io ghosh` | Supply-driven `B` and `G` | `allocation_coefficients_b`, `ghosh_inverse_g` |\n| `friedman io multipliers` | Output/income/employment multipliers, Type I & II | `io_multipliers` |\n| `friedman io linkages` | Backward/forward linkages + Rasmussen Ui/Uj indices | `linkages` |\n| `friedman io key-sectors` | Rasmussen quadrant classification only | `key_sectors` |\n| `friedman io sda` | Structural decomposition of change between two periods | `structural_decomposition` |\n| `friedman io extract` | Hypothetical extraction: output loss from removing sectors | `hypothetical_extraction_loss`, `hypothetical_extraction_summary` |\n| `friedman io footprint` | Consumption-based footprint of a satellite account | `footprint`, `footprint_by_sector` (+ `regional_footprint`, `intensities_s`, `emission_multipliers`) |\n| `friedman io price` | Leontief cost-push (or Ghosh dual) price model | `price_model` |\n| `friedman io impact` | Final-demand scenario through `L` | `impact_summary`, `impact_by_sector` |\n| `friedman io network-stats` | Domar weights, Herfindahl, APL, degrees, up/down-streamness | `network_stats_summary`, `network_stats_sectors` |\n\nLeaf-specific options (beyond the shared input set and `--format`/`--output`):\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `leontief` | `--matrix` | `L` | `L` (inverse) / `A` (technical coefs) / `both` |\n| `ghosh` | `--matrix` | `G` | `G` (inverse) / `B` (allocation coefs) / `both` |\n| `multipliers` | `--kind` | `output` | `output` (column sums of `L`) / `income` (VA-weighted) / `employment` (jobs-weighted; needs account) |\n| `multipliers` | `--type` | `I` | Type I (open) / Type II (household-closed) |\n| `linkages` | `--forward` | `ghosh` | Forward basis: `ghosh` (row sums of `G`) / `leontief` |\n| `key-sectors` | `--forward` | `ghosh` | Same basis; quadrant counts on stderr |\n| `sda` | `--data2` | `\"\"` | Second-period table (default: same as `--data`) |\n| `sda` | `--method` | `additive` | `additive` (exact, zero residual) / `multiplicative` |\n| `sda` | `--factors` | `\"\"` | Comma-separated SDA factors (kebab); omit for legacy `L_effect`/`Y_effect` |\n| `sda` | `--on` | `output` | `output` or satellite account name (emission SDA: intensity/technology/final_demand) |\n| `sda` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `extract` | `--sectors-extract` | `\"\"` (required) | Sector names or 1-based indices, comma-separated |\n| `extract` | `--mode` | `complete` | `complete\\|backward\\|forward\\|partial` |\n| `extract` | `--share` | `1.0` | Partial extraction share in (0, 1] |\n| `extract` | `--region` | `\"\"` | Extract a whole MRIO region block |\n| `extract` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `footprint` | `--account` | `\"\"` | Satellite account (default: first available, e.g. CO2) |\n| `footprint` | `--by` | `sector` | `sector` / `region` (MRIO production vs consumption) |\n| `footprint` | `--detail` (flag) | off | Also emit intensities `S` and emission multipliers `M = SL` |\n| `price` | `--dva` / `--dtax` | `\"\"` | VA-coef / production-tax shocks: comma list or `sector=value` |\n| `price` | `--mode` | `leontief` | `leontief` (cost-push dual) / `ghosh` (descriptive dual) |\n| `price` | `--parser` / `--plot` / `--plot-save` | `csv` / off | MRIO parser / browser plot / save HTML |\n| `impact` | `--dy` | `\"\"` (required) | Final-demand change: comma list or `sector=value` |\n| `impact` | `--kind` | `output` | `output\\|va\\|income\\|employment\\|<satellite>` |\n| `impact` | `--type` | `I` | Type I (open) / Type II (household-closed) |\n| `impact` | `--parser` / `--plot` / `--plot-save` | `csv` / off | MRIO parser / browser plot / save HTML |\n| `network-stats` | `--parser` / `--plot` / `--plot-save` | `csv` / off | MRIO parser / browser plot / save HTML |\n\n# Examples\n\n```bash\nfriedman io leontief --matrix both\nfriedman io ghosh --matrix both\nfriedman io multipliers --kind output --type I\nfriedman io multipliers --kind employment\nfriedman io linkages --forward leontief\nfriedman io key-sectors\nfriedman io sda --on CO2\nfriedman io extract --sectors-extract Manufacturing --mode partial --share 0.5\nfriedman io footprint --account CO2 --detail\nfriedman io price --dva 0.1,0\nfriedman io impact --dy 10,0\nfriedman io network-stats\n```\n\n# See also\n\n* [Tables and Sources](tables.md) - load and balance the tables these leaves read\n* [Networks and Trade](networks.md) - nonlinear Baqaee-Farhi and MRIO trade leaves", "io/networks": "# Summary\n\n`io bf` is an intermediate node (not a leaf): its 7 sub-leaves calibrate a Baqaee-Farhi nested-CES `ProductionNetwork` from the IO table and run exact nonlinear counterfactuals on it. Every `bf` leaf shares the network-calibration options `--theta` (production elasticity, scalar or per-sector list, default `1.0`), `--sigma` (consumption elasticity, `1.0`), `--epsilon`/`--eta` (two-nest elasticities, `1.0`), `--nests` (`single`/`two`), `--factors` (`single` sum VA rows / `va-cats` one factor per VA row), `--mu` (markups >= 1, `1.0` = efficient), and `--no-check` (allow clipped negative cost shares above 1%), plus `--parser`, `--model` (load a saved handle, skip re-estimation; `network` uses `--save-model` instead), `--plot`/`--plot-save`, and the shared IO input set with `--format`/`--output`. The scalar `io baqaee-farhi` leaf is the simpler 2019 interface (Domar weights, influence vector, centralities, optional second-order Hessian; Cobb-Douglas default makes Hulten exact). MRIO trade leaves (`bilateral-trade`, `export-decomposition`, `vertical-specialization`) need a multi-region table (e.g. via `io download` + `--parser icio`); the single-region `:wiot` example has no second region to address.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman io baqaee-farhi` | 2019 Domar/influence/centralities (+ optional Hessian) | `baqaee_farhi_2019_decomposition`, `second_order_hessian_beyond_hulten` |\n| `friedman io bf network` | Calibrate the `ProductionNetwork` | `production_network_summary`, `production_network_sectors` |\n| `friedman io bf equilibrium` | Exact nested-CES counterfactual equilibrium | `bf_equilibrium_summary`, `bf_equilibrium_sectors` |\n| `friedman io bf local` | Local Hulten weights + second-order Hessian | `bf_local_hulten`, `bf_local_hessian` |\n| `friedman io bf elasticities` | Factor/goods-price and Domar-share incidence at base point | `price_incidence`, `factor_price_incidence` |\n| `friedman io bf shock-curve` | One-sector shock: exact vs Hulten vs second-order over a grid | `bf_shock_curve` |\n| `friedman io bf wedges` | 2020 Theorem 1 technology vs allocative-efficiency split | `bf_wedge_decomp`, `bf_wedge_domar` |\n| `friedman io bf misallocation` | Prop. 5 Harberger misallocation distance | `bf_misallocation_summary`, `bf_misallocation_sectors` |\n| `friedman io bilateral-trade` | Bilateral intermediate/final/total trade, exporter to importer | `bilateral_trade_summary`, `bilateral_trade_by_sector` |\n| `friedman io export-decomposition` | KWW (2014) DVA/RDV/FVA/PDC decomposition of gross exports | `kww_export_aggregates`, `kww_export_by_sector` |\n| `friedman io vertical-specialization` | Hummels-Ishii-Yi / KWW import content of exports | `vertical_specialization`, `vertical_specialization_by_sector` |\n\nLeaf-specific options beyond the shared sets in the Summary:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `baqaee-farhi` | `--theta` / `--sigma` (Float64) | `1.0` / `1.0` | Scalar substitution elasticities |\n| `baqaee-farhi` | `--second-order` (flag) | off | Also emit the sector x sector Hessian |\n| `equilibrium` | `--dlog-a` / `--dlog-l` / `--dlog-mu` | `\"\"` | Productivity / factor-supply / markup shocks (scalar or list; default 0) |\n| `equilibrium` | `--method` / `--tol` / `--maxiter` / `--damping` | `newton` / `1e-10` / `500` / `0.5` | Inner price solver (`newton\\|fixedpoint`) and settings |\n| `local` | `--hessian` | `auto` | Form n x n Hessian: `auto` (n<=500) / `full` / `none` |\n| `local` | `--no-elasticities` (flag) | off | Skip the attached BFElasticities block |\n| `shock-curve` | `--sector` | `\"\"` (required) | Shocked sector: name or 1-based index |\n| `shock-curve` | `--range` / `--points` | `-0.5,0.5` / `41` | (lo,hi) grid for dlogA / grid points (>= 2) |\n| `wedges` | `--dlog-a` / `--dlog-l` / `--dlog-mu` | `\"\"` | Shock bundle (scalar or list; default 0) |\n| `misallocation` | `--point` | `efficient` | Evaluation point: `efficient\\|observed` |\n| `misallocation` | `--hessian` | `auto` | Form n x n H_mu: `auto\\|full\\|none` |\n| `bilateral-trade` | `--exporter` / `--importer` | `\"\"` (required) | Region name or 1-based index |\n| `bilateral-trade` | `--kind` | `total` | `total\\|intermediate\\|final` |\n| `export-decomposition` | `--region` | `\"\"` | Region name/index (required when nregions > 1) |\n| `export-decomposition` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `vertical-specialization` | `--region` | `\"\"` | Region name/index (required when nregions > 1) |\n| `vertical-specialization` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n\n# Examples\n\n```bash\nfriedman io baqaee-farhi --theta 0.5 --sigma 0.9 --second-order\nfriedman io bf network\nfriedman io bf equilibrium --dlog-a 0.01,0\nfriedman io bf local --hessian full\nfriedman io bf elasticities\nfriedman io bf shock-curve --sector 1 --range -0.2,0.2\nfriedman io bf wedges --dlog-a 0.01,0 --dlog-mu 0,0.02\nfriedman io bf misallocation --point observed\nfriedman io export-decomposition --region 1\nfriedman io vertical-specialization --region 1\n```\n\n# See also\n\n* [Tables and Sources](tables.md) - download the multi-region tables trade leaves need\n* [Classical IO](classical.md) - linear multipliers, linkages, SDA", "io/tables": "# Summary\n\nEvery IO analysis leaf runs offline out of the box: with no `--data`, the bundled **`:wiot`** example (the Miller & Blair 2009 2-sector table, with `employment` and `CO2` satellite accounts) is used. Analysis leaves share the input options `--data` (CSV path, `:wiot` default, another `:example`, or a saved `.jld2`/`model://` handle), `--n-sectors` (required for CSV: `Z` is the first `n_sectors` columns), `--n-fd` (final-demand columns, default 1), and `--sectors` (CSV labels). A plain CSV carries no satellite accounts (needed for `employment` multipliers and `footprint`); use `:wiot` or a full MRIO archive. `io download` is the only network-touching leaf and respects `--offline` (exit 6 `env/network`); SHA-256 verification is on by default but the upstream checksum registry ships unpopulated, so unverified downloads warn rather than fail.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman io sources` | List downloadable IO/MRIO sources (offline catalog) | `io_mrio_sources` |\n| `friedman io download` | Download an IO/MRIO archive (network; respects `--offline`) | `download_summary`, `download_log` |\n| `friedman io load` | Parse/inspect a table: dimensions, balance, per-sector totals | `io_table_summary`, `sectors` |\n| `friedman io aggregate` | Aggregate over regions and/or sector types | `io_table_summary`, `sectors` |\n| `friedman io balance` | Repair intermediate flows via RAS/GRAS | `io_table_summary`, `sectors` |\n\n`sources` options: `--format, -f` (`table`), `--output, -o` (`\"\"`).\n\n`download` options:\n\n| Option | Default | Description |\n|---|---|---|\n| `--source` | `\"\"` (required) | `oecd\\|wiod\\|exiobase3\\|eora26\\|gloria` |\n| `--storage` | `\"\"` (required) | Destination folder for downloaded archives |\n| `--source-version` | `\"\"` | Source version (e.g. OECD `v2023`; not `--version`, the reserved CLI global) |\n| `--years` | `\"\"` | Comma-separated year filter (default: all) |\n| `--system` | `pxp` | EXIOBASE `pxp` (product-by-product) / `ixi` (industry-by-industry) |\n| `--email` / `--password` | `\"\"` | Account credentials (EORA26 only) |\n| `--offline` (flag) | off | Refuse network access (exit 6) |\n| `--overwrite` (flag) | off | Re-download existing files |\n| `--no-verify` (flag) | off | Skip SHA-256 checksum verification |\n| `--format, -f` / `--output, -o` | `table` / `\"\"` | Output format / file |\n\n`load` options (shared input set plus ICIO parser flags):\n\n| Option | Default | Description |\n|---|---|---|\n| `--data` / `--n-sectors` / `--n-fd` / `--sectors` | `\"\"` / `0` / `1` / `\"\"` | Shared IO input options (see Summary) |\n| `--parser` | `csv` | `csv` (`parse_io`) / `icio` (OECD ICIO text; `.zip` needs ZipFile) |\n| `--year` / `--member` | `\"\"` | ICIO year / member filter |\n| `--no-aggregate-cn-mx` (flag) | off | ICIO: do not aggregate CN/MX processing units |\n| `--check` (flag) | off | ICIO: run parser balance checks |\n| `--save-model` | `\"\"` | Save parsed table to a handle (`.jld2` native, `.fmod` interim) |\n| `--format, -f` / `--output, -o` | `table` / `\"\"` | Output format / file |\n\n`aggregate` options: shared input set plus `--parser` (`csv`), `--region-map` (`old=new` pairs, comma-separated), `--sector-map` (`old=new` sector-type pairs), `--save-model`, `--format`/`--output`.\n\n`balance` options: shared input set plus `--parser` (`csv`), `--method` (`ras`: `ras` non-negative / `gras` sign-preserving), `--tol` (`1e-10`), `--maxiter` (`1000`), `--save-model`, `--format`/`--output`.\n\n# Examples\n\n```bash\nfriedman io sources\nfriedman io download --source oecd --storage ./io_data --source-version v2023 --years 2018\nfriedman io download --source exiobase3 --storage ./io_data --system pxp\nfriedman io load\nfriedman io load --data :wiot\nfriedman io aggregate --region-map \"USA=NAFTA,MEX=NAFTA\"\nfriedman io balance --method gras\n```\n\n# See also\n\n* [Classical IO](classical.md) - multipliers, linkages, SDA, extraction, footprints\n* [Networks and Trade](networks.md) - Baqaee-Farhi networks and MRIO trade\n* [Handles and Examples](../data/handles.md) - `:example` dataset conventions", "overview": "# Summary\n\nFriedman-cli is a command-line interface for macroeconometric research\nand analysis. It wraps MacroEconometricModels.jl behind 21 top-level\ncommands and 477 leaf commands covering estimation, testing, impulse\nanalysis, forecasting, data handling, input-output analysis, DSGE\nmodelling, causal policy evaluation, and spectral methods, plus the\nconfiguration, envelope, and installation machinery shared by every\ncommand. Every leaf emits one JSON envelope (or a table/CSV rendering\nof it) and exits with a documented status code.\n\n# Feature map\n\n| Domain | Contents |\n|---|---|\n| [Estimate](estimate/timeseries.md) | [Time-series and factor](estimate/timeseries.md), [regression](estimate/regression.md), [regime/volatility](estimate/regime-volatility.md), [panel and discrete-choice](estimate/panel-choice.md) estimation |\n| [Test](test/unit-root.md) | [Unit-root](test/unit-root.md), [cointegration](test/cointegration.md), [diagnostics](test/diagnostics.md), [panel/VAR/IV/DiD](test/panel-var.md) tests |\n| [Impulse](impulse/irf.md) | [Impulse responses](impulse/irf.md), [FEVD](impulse/fevd.md), [historical decomposition](impulse/hd.md) |\n| [Forecast](forecast/forecast.md) | [Forecasting and evaluation](forecast/forecast.md), [fitted values](forecast/predict.md), [residuals](forecast/residuals.md), [filters and nowcasting](forecast/filter-nowcast.md) |\n| [Data](data/handles.md) | [Handles and examples](data/handles.md), [simulation](data/simulate.md), [cleaning and transforms](data/clean.md) |\n| [Input-output](io/tables.md) | [Tables and sources](io/tables.md), [classical analysis](io/classical.md), [networks and MRIO](io/networks.md) |\n| [DSGE](dsge/core.md) | [Core](dsge/core.md), [Bayesian estimation](dsge/bayes.md), [HA-DSGE](dsge/hadsge.md), [family models](dsge/family.md) |\n| [Causal policy](causal-policy/did.md) | [Difference-in-differences](causal-policy/did.md), [counterfactuals and optimal policy](causal-policy/policy-counterfactual.md), [causal-effect menus](causal-policy/policy-menus.md) |\n| [Spectral filter](spectral-filter/spectral-density.md) | [Correlograms and spectral density](spectral-filter/spectral-density.md), [cross-spectra](spectral-filter/spectral-cross.md) |\n| [Infrastructure](infra/model-handles.md) | [Model handles](infra/model-handles.md), [serve and show](infra/serve-show.md), [REPL and completions](infra/repl-completions.md) |\n| [Configuration](configuration/config-files.md) | [Config files](configuration/config-files.md), [envelope and globals](configuration/output-envelope.md), [CLI engine](configuration/cli-engine.md) |\n| [Installation & architecture](installation-architecture/installation.md) | [Installation](installation-architecture/installation.md), [architecture](installation-architecture/architecture.md), [testing](installation-architecture/testing.md) |\n\n# Usage\n\nInstall with the upstream installer:\n\n```sh\ncurl -fsSL https://github.com/FriedmanJP/Friedman-cli/raw/main/install.sh | sh\n```\n\nThen estimate a VAR on a CSV file:\n\n```sh\nfriedman estimate multivariate var macro.csv --lags 2\n```\n\nPick a domain from the feature map above for the estimators, command\ntables, and worked examples behind each command family.", "spectral-filter/spectral-cross": "# Summary\n\nTwo leaves relate series in the frequency domain or evaluate a filter with no data at all. `spectral cross` runs cross-spectral analysis of two columns: the co-spectrum (in-phase covariance) and quadrature spectrum (out-of-phase covariance) by frequency, plus coherence (frequency-domain squared correlation), phase (lead-lag shift in radians; phase divided by frequency gives the time lag), and gain (regression slope of the second series on the first at each frequency). Coherence near one means the second series is predictable from the first at that frequency up to phase and scale. `spectral transfer` evaluates the theoretical transfer function \u2014 gain and phase by frequency \u2014 of a named filter on a grid of `--nobs` observations; it takes no data file. Gain near one marks frequencies the filter keeps, gain near zero marks those it kills; comparing the HP gain against the `ideal` band-pass shows the HP filter's leakage and compression. Both leaves share the `--format`/`-f`, `--output`/`-o`, `--plot-save`, `--plot` surface.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman spectral cross` | Co-/quadrature spectrum, coherence, phase, gain of two columns by frequency | `cross_spectral_analysis` |\n| `friedman spectral transfer` | Theoretical gain and phase by frequency of `--filter hp\\|bk\\|hamilton\\|ideal`; no data file | `filter_transfer_function` |\n\n| Argument | Type | Required | Leaves | Description |\n|---|---|---|---|---|\n| `data` | String | yes | cross | Path to CSV data file |\n\n| Option | Leaves | Default | Description |\n|---|---|---|---|\n| `--var1` | cross | `1` | First variable column index |\n| `--var2` | cross | `2` | Second variable column index |\n| `--filter` | transfer | `hp` | `hp`,
