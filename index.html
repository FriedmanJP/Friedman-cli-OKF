`bk`, `hamilton`, `ideal` |\n| `--lambda` | transfer | `1600.0` | Filter parameter (e.g. HP \u03bb) |\n| `--nobs` | transfer | `200` | Observations for the frequency grid |\n| `--format` / `-f` | both | `table` | `table`, `csv`, `json` |\n| `--output` / `-o` | both | \u2014 | Write to file instead of stdout |\n| `--plot-save` | both | \u2014 | Save interactive plot to HTML file |\n| `--plot` (flag) | both | off | Open interactive plot in browser |\n\n# Examples\n\n```bash\nfriedman spectral cross :fred_md --var1 1 --var2 2\nfriedman spectral transfer --filter hp --lambda 1600 --nobs 200\nfriedman spectral transfer --filter ideal --nobs 200\n```\n\n# See also\n\n* [Correlograms and Spectral Density](spectral-density.md) - single-series ACF, periodogram, and spectral density\n* [Trend-Cycle Filters and Nowcasting](../forecast/filter-nowcast.md) - the HP/BK/Hamilton filters whose frequency responses `transfer` evaluates", "spectral-filter/spectral-density": "# Summary\n\nThree single-series leaves describe second-order structure nonparametrically or semi-parametrically. `spectral acf` reports sample autocorrelation (ACF) and partial autocorrelation (PACF) by lag with cumulative Ljung-Box Q-statistics and p-values \u2014 ACF at lag k is the correlation of yt with yt\u2212k, PACF at lag k conditions on the intermediate lags \u2014 and, with `--ccf-with`, appends the cross-correlation (CCF) against a second column. Slowly decaying ACF with a sharp PACF cutoff diagnoses autoregressive structure, and the reverse diagnoses moving-average structure. `spectral periodogram` reports the raw periodogram (squared DFT magnitude at each Fourier frequency): unbiased but inconsistent, so read peak locations from it and magnitudes from `density`. `spectral density` estimates the spectral density with a confidence band by frequency via `--method periodogram` (raw ordinates), `welch` (default; averaged overlapping segments), `smoothed` (kernel smoothing with `--bandwidth`), or `ar` (implied spectrum of a fitted autoregression). All three leaves take the CSV positional `data` plus `--format`/`-f`, `--output`/`-o`, `--plot-save`, and `--plot`.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman spectral acf` | ACF/PACF by lag with Ljung-Box Q and p-values; CCF with `--ccf-with` | `acf_pacf` (autocorrelation, partial autocorrelation, Q, p-value by lag); `cross_correlation` (CCF by lag; only with `--ccf-with`) |\n| `friedman spectral periodogram` | Raw periodogram power by Fourier frequency (inconsistent by design) | `periodogram` |\n| `friedman spectral density` | Spectral density with confidence band by frequency | `spectral_density` |\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `data` | String | yes | Path to CSV data file |\n\n| Option | Short | Leaves | Default | Description |\n|---|---|---|---|---|\n| `--column` | `-c` | all 3 | `1` | Column index (1-based) |\n| `--max-lag` | \u2014 | acf | min(20, T\u22121) | Maximum lag |\n| `--ccf-with` | \u2014 | acf | \u2014 | Column index for cross-correlation |\n| `--method` | `-m` | density | `welch` | `periodogram`, `welch`, `smoothed`, `ar` |\n| `--bandwidth` | \u2014 | density | auto | Smoothing bandwidth (smoothed method) |\n| `--format` | `-f` | all 3 | `table` | `table`, `csv`, `json` |\n| `--output` | `-o` | all 3 | \u2014 | Write to file instead of stdout |\n| `--plot-save` | \u2014 | all 3 | \u2014 | Save interactive plot to HTML file |\n| `--plot` (flag) | \u2014 | all 3 | off | Open interactive plot in browser |\n\n# Examples\n\n```bash\nfriedman spectral acf :nile --column 1 --max-lag 20\nfriedman spectral acf :fred_md --column 1 --ccf-with 2\nfriedman spectral periodogram :nile --column 1\nfriedman spectral density :nile --method welch\nfriedman spectral density :nile --method smoothed --bandwidth 0.1\n```\n\n# See also\n\n* [Cross-Spectra and Transfer Functions](spectral-cross.md) - two-series coherence/phase/gain and theoretical filter responses\n* [Trend-Cycle Filters and Nowcasting](../forecast/filter-nowcast.md) - the HP/BK/Hamilton filters whose frequency responses `transfer` evaluates", "test/cointegration": "# Summary\n\nThese 27 leaves test long-run relationships (`coint` system, residual-based, panel, and bounds tests; `vecm` restriction tests; `nardl-symmetry`; `park-added`) and parameter stability (`stability` break, CUSUM, factor-break, bubble, and cointegration-stability tests). Every leaf takes a required `data` CSV plus `--format`/`-f`, `--output`/`-o`, `--result`, `--save-result`, except `stability nyblom` and `stability recursive-residuals`, which omit `--result`/`--save-result`.\n\nNull directions vary and must be read per leaf: cointegration tests use H0 of no cointegration (low p supports a relationship), the bounds test has no p-value at all (F/t against I(0)/I(1) bands), VECM leaves test H0 that the economic restriction holds, and `hansen-instability`/`park-added` test H0 of stable/genuine cointegration. CUSUM leaves report a path-plus-band verdict, not a p-value; Nyblom reports statistics against Hansen 5% critical values. VECM restriction matrices live in a `[vecm_restriction]` TOML section, row-major (`H` p\u00d7s with s \u2265 r; `b` p\u00d7r with exactly r columns).\n\nLEAVES open question (intermediates): `coint`, `vecm`, and `stability` are CLI path segments only \u2014 no `##` headers exist for them in the generated reference, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Cointegration (9 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test coint johansen` | rank \u2264 r (trace and max-eigenvalue) | `johansen_trace_test`, `johansen_max_eigenvalue_test` |\n| `friedman test coint engle-granger` | no cointegration | `engle_granger_test` |\n| `friedman test coint phillips-ouliaris` | no cointegration (Z_t, Z_alpha) | `phillips_ouliaris_test`, `phillips_ouliaris_summary` |\n| `friedman test coint gregory-hansen` | no cointegration with one shift | `gregory_hansen_test` |\n| `friedman test coint ardl-bounds` | no level relationship (bounds, no p-value) | `ardl_bounds_test_i_0_i_1_bounds_no_p_value`, `ardl_bounds_test_summary` |\n| `friedman test coint kao` | no panel cointegration | `kao_cointegration`, `kao_cointegration_summary` |\n| `friedman test coint pedroni` | no panel cointegration | `pedroni_cointegration`, `pedroni_cointegration_summary` |\n| `friedman test coint westerlund` | no panel error correction | `westerlund_cointegration`, `westerlund_cointegration_summary` |\n| `friedman test coint fisher-johansen` | no panel cointegration (combined ranks) | `fisher_johansen_panel_cointegration_test`, `fisher_johansen_summary` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `johansen` | `data` (required) | `--lags`/`-p` (2), `--trend` (`constant`: none\\|constant\\|trend) |\n| `engle-granger` | `data` (required) | `--dep`, `--trend` (`constant`: none\\|constant\\|trend), `--lags` (`aic`: aic\\|bic\\|tstat\\|N), `--max-lags` |\n| `phillips-ouliaris` | `data` (required) | `--dep`, `--trend` (`constant`), `--kernel` (`bartlett`: bartlett\\|parzen\\|qs\\|tukey-hanning), `--bandwidth` (`nw`: nw\\|andrews\\|nw94\\|number) |\n| `gregory-hansen` | `data` (required) | `--model` (`C`: C\\|C/T\\|C/S), `--lags` (`aic`: aic\\|bic\\|N), `--max-lags` (auto), `--trim` (0.15) |\n| `ardl-bounds` | `data` (required) | `--dep`, `--p`/`--q` (`auto`), `--max-p`/`--max-q` (4), `--ic` (`aic`: aic\\|bic), `--trend` (`none`: none\\|const\\|trend), `--case` (3, PSS 1..5), `--level` (0.05: 0.10\\|0.05\\|0.025\\|0.01), `--cv-source` (`pss`) |\n| `kao` | `data` (required, long panel) | `--id-col`, `--time-col`, `--dep`, `--indep` |\n| `pedroni` | `data` (required, long panel) | `--id-col`, `--time-col`, `--dep`, `--indep`, `--trend` (`constant`: constant\\|trend) |\n| `westerlund` | `data` (required, long panel) | `--id-col`, `--time-col`, `--dep`, `--indep`, `--trend` (`constant`) |\n| `fisher-johansen` | `data` (required, long panel) | `--id-col`, `--time-col`, `--vars` (\u22652 series), `--deterministic` (`constant`: none\\|constant\\|trend), `--lags` (2), `--combine` (`mw`: mw\\|choi) |\n\n## VECM restrictions and relatives (7 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test vecm beta` | beta = H\u00b7phi | `vecm_restriction_h` |\n| `friedman test vecm alpha` | alpha = A\u00b7psi | `vecm_restriction_a` |\n| `friedman test vecm joint` | joint beta and alpha restriction | `vecm_joint_h_a` |\n| `friedman test vecm known-beta` | beta = b (fully specified) | `vecm_known_b` |\n| `friedman test vecm weak-exog` | weak exogeneity of `--vars` | `vecm_weak_exogeneity` |\n| `friedman test nardl-symmetry` | long/short-run symmetry (per regressor) | `nardl_symmetry_tests_h0_long_run_short_run`, `nardl_symmetry_test_summary` |\n| `friedman test park-added` | genuine cointegration (H(p,q)) | `park_added_variables_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `beta` | `data` (required) | `--config` ([vecm_restriction] H), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`: johansen\\|engle_granger), `--significance` (0.05) |\n| `alpha` | `data` (required) | `--config` ([vecm_restriction] A), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`), `--significance` (0.05) |\n| `joint` | `data` (required) | `--config` (H and A matrices), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`), `--significance` (0.05) |\n| `known-beta` | `data` (required) | `--config` ([vecm_restriction] b), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`), `--significance` (0.05) |\n| `weak-exog` | `data` (required) | `--vars` (names/indices, no config), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`), `--significance` (0.05) |\n| `nardl-symmetry` | `data` (required) | `--dep`, `--asymmetric` (`all` or indices), `--p`/`--q` (`auto`), `--max-p`/`--max-q` (4), `--ic` (`aic`), `--case` (3) |\n| `park-added` | `data` (required) | `--dep`, `--method` (`fmols`: fmols\\|ccr\\|dols), `--trend` (`const`: none\\|const\\|linear), `--kernel`/`--bandwidth` (fit HAC), `--leads`/`--lags` (`auto`), `--q-add` (2, test df), `--hac-kernel`/`--hac-bandwidth` (test HAC) |\n\n## Stability and breaks (11 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test stability chow` | constant coefficients at break(s) | `chow_test` |\n| `friedman test stability andrews` | no break at unknown date | `andrews_break_test` |\n| `friedman test stability bai-perron` | m breaks selected by IC | `bai_perron_test` |\n| `friedman test stability cusum` | stability (path stays in band) | `cusum_path`, `cusum_summary` |\n| `friedman test stability cusumsq` | variance stability (path in band) | `cusumsq_path`, `cusumsq_summary` |\n| `friedman test stability recursive-residuals` | \u2014 (reports the residuals) | `recursive_residuals`, `recursive_residuals_summary` |\n| `friedman test stability factor-break` | stable factor loadings | `factor_break_test`, `per_series_break_diagnostics` |\n| `friedman test stability sadf` | unit root vs one bubble | `explosive_episodes_sadf`, `sadf_summary` |\n| `friedman test stability gsadf` | unit root vs multiple bubbles | `explosive_episodes_gsadf`, `gsadf_summary` |\n| `friedman test stability hansen-instability` | stable cointegration (L_c) | `hansen_instability_test` |\n| `friedman test stability nyblom` | stable GARCH parameters | `nyblom_individual_stability`, `nyblom_joint_stability` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `chow` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--break-at` (required index or list), `--type` (`breakpoint`: breakpoint\\|forecast), `--level` (0.05) |\n| `andrews` | `data` (required) | `--response` (1), `--test` (`supwald`: sup/exp/mean \u00d7 wald/lr/lm), `--trimming` (0.15) |\n| `bai-perron` | `data` (required) | `--response` (1), `--max-breaks` (5), `--trimming` (0.15), `--criterion` (`bic`: bic\\|lwz) |\n| `cusum` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--level` (0.05) |\n| `cusumsq` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--level` (0.05) |\n| `recursive-residuals` | `data` (required) | `--dep`, `--cov-type` (`hc1`); no `--result`/`--save-result` |\n| `factor-break` | `data` (required, T\u00d7N) | `--factors` (2), `--method` (`breitung_eickmeier`: breitung_eickmeier\\|chen_dolado_gonzalo\\|han_inoue), `--id-col`/`--time-col` (optional) |\n| `sadf` | `data` (required) | `--column`/`-c` (1), `--r0` (`auto`), `--adflag` (0), `--mc-reps` (999), `--cv` (`asymptotic`: asymptotic\\|wildboot), `--seed` (20240716) |\n| `gsadf` | `data` (required) | `--column`/`-c` (1), `--r0` (`auto`), `--adflag` (0), `--mc-reps` (999), `--cv` (`asymptotic`), `--seed` (20240716) |\n| `hansen-instability` | `data` (required) | `--dep`, `--method` (`fmols`), `--trend` (`const`), `--kernel` (`bartlett`), `--bandwidth` (`andrews`), `--leads`/`--lags` (`auto`) |\n| `nyblom` | `data` (required) | `--column`/`-c` (1), `--model` (`garch`: garch\\|egarch\\|gjr-garch), `--p`/`--q` (1); no `--result`/`--save-result` |\n\n# Examples\n\n```bash\nfriedman test coint johansen :denmark --lags=2 --trend=constant\nfriedman test coint engle-granger :denmark --dep=LRM --lags=aic\nfriedman test coint ardl-bounds :denmark --dep=LRM --p=1 --q=1 --case=3 --level=0.05\nfriedman test vecm weak-exog :denmark --vars=IDE --rank=1\nfriedman test nardl-symmetry :denmark --dep=LRM --asymmetric=all --p=1 --q=1\nfriedman test stability andrews :denmark --response=1 --test=supwald --trimming=0.15\nfriedman test stability bai-perron :denmark --response=1 --max-breaks=5\nfriedman test stability chow :stackloss --dep=stack.loss --break-at=10\n```\n\n# See also\n\n* [Unit roots and long memory](unit-root.md) - integration-order pre-tests\n* [Regression diagnostics](diagnostics.md) - OLS residual and specification diagnostics\n* [VECM estimation](../estimate/timeseries.md) - fitting the cointegrated system under test", "test/diagnostics": "# Summary\n\nThese 23 leaves diagnose fitted models: serial-correlation and white-noise tests (`ljung-box`, `box-pierce`, `bartlett-wn`, `durbin-watson`, `bds`), heteroskedasticity tests (`white`, `glejser`, `harvey`, `arch-lm`, `sign-bias`), heteroskedasticity-based SVAR identification (`heteroskedasticity`, `identifiability`), OLS influence and collinearity (`influence`, `vif`), distributional checks (`edf`, `normality`, `dispersion`, `fisher`), linearity tests (`hansen-linearity`, `star-linearity`), and choice-model specification (`brant`, `hausman-iia`).\n\nKnow which series each leaf tests: `ljung-box` squares the passed column first (always a variance test), while `box-pierce` tests the levels; `arch-lm`/`ljung-box` test the column directly with no model fit, while `sign-bias` first fits the `--model` GARCH and tests its standardized residuals. The OLS-family leaves fit like `estimate regression reg` (`--dep` plus all other numeric columns, no prepended intercept; `--cov-type` forwarded). `test serial breusch-pagan` is the panel random-effects LM test, not a heteroskedasticity test \u2014 it lives in [panel-var.md](panel-var.md). Most leaves here accept `--result`/`--save-result`; the exceptions are `arch-lm`, `sign-bias`, `identifiability`, and `vif`.\n\nLEAVES open question (intermediates): `serial` is a CLI path segment only \u2014 no `##` header exists for it in the generated reference, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Serial correlation and white noise (5 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test serial ljung-box` | no serial correlation in squares | `ljung_box_squared_test` |\n| `friedman test serial box-pierce` | no autocorrelation to `--lags` | `box_pierce_test` |\n| `friedman test serial bartlett-wn` | white noise | `bartlett_white_noise_test` |\n| `friedman test serial durbin-watson` | no AR(1) | `durbin_watson_test` |\n| `friedman test serial bds` | iid (per embedding dimension) | `bds_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `ljung-box` | `data` (required) | `--column`/`-c` (1), `--lags`/`-p` (10) |\n| `box-pierce` | `data` (required) | `--column`/`-c` (1), `--lags`/`-p` (20) |\n| `bartlett-wn` | `data` (required) | `--column`/`-c` (1) |\n| `durbin-watson` | `data` (required) | `--column`/`-c` (1) |\n| `bds` | `data` (required) | `--column`/`-c` (1), `--max-dim` (6), `--eps-frac` (0.7) |\n\n## Heteroskedasticity (5 leaves + 2 SVAR leaves)\n\n| Command | H0 / role | Output tables |\n|---|---|---|\n| `friedman test serial white` | homoskedasticity | `white_test` |\n| `friedman test serial glejser` | homoskedasticity | `glejser_test` |\n| `friedman test serial harvey` | homoskedasticity (multiplicative) | `harvey_test` |\n| `friedman test serial arch-lm` | no ARCH effects | `arch_lm_test` |\n| `friedman test serial sign-bias` | no remaining asymmetry (Engle-Ng) | `sign_bias_test` |\n| `friedman test serial heteroskedasticity` | B0 from variance-regime changes | `structural_impact_matrix_b0` |\n| `friedman test identifiability` | non-Gaussian SVAR pre-checks | `identifiability_test_results` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `white` | `data` (required) | `--dep`, `--cov-type` (`hc1`); flag `--no-cross-terms` |\n| `glejser` | `data` (required) | `--dep`, `--cov-type` (`hc1`) |\n| `harvey` | `data` (required) | `--dep`, `--cov-type` (`hc1`) |\n| `arch-lm` | `data` (required) | `--column`/`-c` (1), `--lags`/`-p` (4); no `--result`/`--save-result` |\n| `sign-bias` | `data` (required) | `--column`/`-c` (1), `--model` (`garch`: garch\\|egarch\\|gjr-garch), `--p`/`--q` (1); no `--result`/`--save-result` |\n| `heteroskedasticity` | `data` (required) | `--lags`/`-p` (auto AIC), `--method` (`markov`: markov\\|garch\\|smooth_transition\\|external), `--config` (transition/regime vars), `--regimes` (2) |\n| `identifiability` | `data` (required) | `--lags`/`-p` (auto AIC), `--test`/`-t` (`all`: strength\\|gaussianity\\|independence\\|overidentification\\|lambda-distinct\\|gaussian-count\\|label-stability\\|all), `--method` (`fastica`: fastica\\|jade\\|sobi\\|dcov\\|hsic), `--contrast` (`logcosh`: logcosh\\|exp\\|kurtosis), `--n-bootstrap` (999); no `--result`/`--save-result` |\n\n## Influence, distributional, and linearity (9 leaves)\n\n| Command | H0 / role | Output tables |\n|---|---|---|\n| `friedman test influence` | per-observation leverage and influence | `influence_diagnostics`, `influence_summary` |\n| `friedman test vif` | VIF and tolerance per regressor | `variance_inflation_factors` |\n| `friedman test edf` | series follows `--dist` | `edf_test` |\n| `friedman test normality` | Gaussian VAR residuals (suite) | `normality_tests_for_var_residuals` |\n| `friedman test dispersion` | equidispersion (Cameron-Trivedi) | `overdispersion_test_cameron_trivedi_1990`, `dispersion_summary` |\n| `friedman test fisher` | white noise (periodicity) | `fisher_s_test` |\n| `friedman test hansen-linearity` | linearity vs SETAR | `hansen_1996_linearity_test` |\n| `friedman test star-linearity` | linearity vs STAR (LM3) | `star_linearity_test_lm3` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `influence` | `data` (required) | `--dep`, `--cov-type` (`hc1`) |\n| `vif` | `data` (required) | `--dep`, `--cov-type` (`hc1`); no `--result`/`--save-result` |\n| `edf` | `data` (required) | `--column`/`-c` (1), `--dist` (`normal`: normal\\|exponential\\|logistic\\|gumbel\\|gamma\\|weibull\\|chisq), `--test` (`ad`: ks\\|lilliefors\\|cvm\\|ad\\|watson), `--params` (`estimate`: estimate\\|specified), `--theta` (required with `specified`) |\n| `normality` | `data` (required) | `--lags`/`-p` (auto AIC) |\n| `dispersion` | `data` (required) | `--dep`, `--offset`/`--exposure`, `--cov-type` (`robust`), `--clusters`, `--maxiter` (100), `--tol` (1e-10), `--alpha` (0.05) |\n| `fisher` | `data` (required) | `--column`/`-c` (1) |\n| `hansen-linearity` | `data` (required) | `--column`/`-c` (1), `--p` (1), `--d` (1), `--trim` (0.15), `--reps` (1000) |\n| `star-linearity` | `data` (required) | `--column`/`-c` (1), `--p` (1), `--d` (1), `--transition-col` (0 = self-exciting) |\n\n## Discrete-choice specification (2 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test brant` | proportional odds | `brant_test` |\n| `friedman test hausman-iia` | IIA for the omitted category | `hausman_mcfadden_iia_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `brant` | `data` (required) | `--dep`, `--cov-type` (`hc1`) |\n| `hausman-iia` | `data` (required) | `--dep`, `--omit-category` (default: last) |\n\n# Examples\n\n```bash\nfriedman test serial white :stackloss --dep=stack.loss\nfriedman test serial white :stackloss --dep=stack.loss --no-cross-terms\nfriedman test serial arch-lm :gnp_hamilton --column=1 --lags=4\nfriedman test serial ljung-box :gnp_hamilton --column=1 --lags=10\nfriedman test serial sign-bias :gnp_hamilton --column=1 --model=garch\nfriedman test influence :stackloss --dep=stack.loss\nfriedman test vif :stackloss --dep=stack.loss\nfriedman test hansen-linearity :nile --p=1 --d=1\nfriedman test star-linearity :nile --p=1 --d=1\nfriedman test dispersion sim_counts.csv --dep=y\n```\n\n# See also\n\n* [Cointegration and stability](cointegration.md) - Chow, CUSUM, and Nyblom stability tests\n* [Panel, VAR, IV, and DiD tests](panel-var.md) - Breusch-Pagan panel LM and VAR diagnostics\n* [Regression estimation](../estimate/regression.md) - the OLS fits under diagnosis\n* [Regime-switching estimation](../estimate/regime-volatility.md) - where linearity rejection leads", "test/panel-var": "# Summary\n\nThese 25 leaves cover panel specification (`hausman`, `f-fe`, `breusch-pagan`, `pesaran-cd`, `wooldridge-ar`, `modified-wald`, `pmg-hausman`, `dh-causality`, `panic`), VAR/PVAR specification and comparison (`granger`, `lagselect`, `lm`, `lr`, `stability`, `hansen-j`, `mmsc`, `lagselect`, `stability`), weak-instrument-robust IV inference (`weak-instrument`, `anderson-rubin`, `wild-cluster`), and DiD diagnostics (`bacon`, `pretrend`, `negweight`, `honest`). Panel leaves read long-format CSVs with `--id-col`/`--time-col` (defaulting to the first/second columns); IV leaves share the `estimate regression iv` layout (`--endogenous`, `--instruments`, other numeric columns exogenous with a `const` for the intercept).\n\nKey readings: Hausman and Breusch-Pagan nulls point in opposite directions (rejecting both means fixed effects, not a contradiction); Pesaran-CD rejection invalidates every first-generation panel unit-root p-value on that panel; Granger pairs are directional (`--cause`/`--effect` indices, not names); `lr`/`lm` take two datasets (`data1` restricted, `data2` unrestricted); the inverted Anderson-Rubin set need not be an interval (`bounded|unbounded|disjoint|whole-line|empty`, single endogenous regressor only). Note `test serial breusch-pagan` is grouped here, not with the heteroskedasticity tests, because it is the panel random-effects LM test. The four `test did` leaves carry no `--result`/`--save-result`; all other leaves here do.\n\nLEAVES open question (intermediates): `panel`, `multivariate`, `pvar`, `iv`, and `did` are CLI path segments only \u2014 no `##` headers exist for them in the generated reference, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Panel specification (9 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test panel hausman` | RE consistent (pick FE on rejection) | `hausman_specification_test` |\n| `friedman test panel f-fe` | no fixed effects | `f_test_for_fixed_effects` |\n| `friedman test serial breusch-pagan` | no random effects (panel LM) | `breusch_pagan_lm_test` |\n| `friedman test panel pesaran-cd` | cross-sectional independence | `pesaran_cd_test` |\n| `friedman test panel wooldridge-ar` | no first-order serial correlation | `wooldridge_ar_test` |\n| `friedman test panel modified-wald` | homoskedastic FE errors | `modified_wald_test` |\n| `friedman test panel pmg-hausman` | long-run homogeneity (PMG/DFE vs MG) | `pmg_hausman_specification_test` |\n| `friedman test panel dh-causality` | no causality for any unit | `dumitrescu_hurlin_panel_causality` |\n| `friedman test panel panic` | panel unit root (Bai-Ng PANIC) | `panic_test_bai_ng` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `hausman` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `f-fe` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `breusch-pagan` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `pesaran-cd` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `wooldridge-ar` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `modified-wald` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col` |\n| `pmg-hausman` | `data` (required, long panel) | `--id-col`, `--time-col`, `--dep`, `--indep`, `--efficient` (`pmg`: pmg\\|dfe), `--trend` (`constant`: none\\|constant\\|trend), `--p` (1), `--q` (1), `--maxiter` (100), `--tol` (1e-8) |\n| `dh-causality` | `data` (required, long panel) | `--id-col`, `--time-col`, `--cause` (required), `--effect` (required), `--p` (1), `--bootstrap` (0), `--seed` (1234) |\n| `panic` | `data` (required, T\u00d7N) | `--factors` (`auto`), `--method` (`pooled`: pooled\\|individual), `--id-col`/`--time-col` (optional) |\n\n## VAR and PVAR diagnostics (9 leaves)\n\n| Command | H0 / role | Output tables |\n|---|---|---|\n| `friedman test multivariate granger` | no Granger causality (directional) | `granger_causality`, `var_granger_causality_all_pairwise` |\n| `friedman test multivariate lagselect` | lag order by IC | `lag_order_selection`, `optimal_lag` |\n| `friedman test multivariate lm` | nested VAR restrictions | `lagrange_multiplier_test` |\n| `friedman test multivariate lr` | nested VAR restrictions | `likelihood_ratio_test` |\n| `friedman test multivariate stability` | companion eigenvalues inside unit circle | `companion_matrix_eigenvalues` |\n| `friedman test pvar hansen-j` | valid overidentifying restrictions | `hansen_j_test` |\n| `friedman test pvar mmsc` | lag order by Andrews-Lu criteria | `mmsc_results` |\n| `friedman test pvar lagselect` | lag order by information criteria | `lag_selection_results` |\n| `friedman test pvar stability` | panel companion stability | `panel_var_companion_matrix_eigenvalues` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `granger` | `data` (required) | `--cause` (1), `--effect` (2), `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--model` (`vecm`: var\\|vecm); flag `--all` (var only) |\n| `lagselect` | `data` (required) | `--max-lags` (12), `--criterion` (`aic`: aic\\|bic\\|hqc) |\n| `lm` | `data1`, `data2` (both required) | `--lags1`/`--lags2` (auto) |\n| `lr` | `data1`, `data2` (both required) | `--lags1`/`--lags2` (auto) |\n| `stability` | `data` (required) | `--lags`/`-p` (auto AIC) |\n| `hansen-j` | `data` (required, long panel) | `--id-col`, `--time-col`, `--lags`/`-p` (1) |\n| `mmsc` | `data` (required, long panel) | `--id-col`, `--time-col`, `--max-lags` (4), `--criterion` (`bic`: bic\\|aic\\|hqic) |\n| `lagselect` | `data` (required, long panel) | `--id-col`, `--time-col`, `--max-lags` (4), `--criterion` (`bic`: bic\\|aic\\|hqic) |\n| `stability` | `data` (required, long panel) | `--id-col`, `--time-col`, `--lags`/`-p` (1) |\n\n## IV diagnostics (3 leaves)\n\n| Command | H0 / role | Output tables |\n|---|---|---|\n| `friedman t time-col`, `--leads` (3), `--horizon` (5), `--lags`/`-p` (4), `--cluster` (`unit`: unit\\|time\\|twoway), `--conf-level` (0.95), `--method` (`did`: did\\|event-study), `--did-method` (`twfe`: twfe\\|cs\\|sa\\|bjs\\|dcdh); no `--result`/`--save-result` |\n| `negweight` | `data` (required, panel) | `--treatment` (required), `--id-col`, `--time-col`; no `--result`/`--save-result` |\n| `honest` | `data` (required, panel) | `--outcome`/`--treatment` (required), `--id-col`, `--time-col`, `--mbar` (1.0), `--leads` (3), `--horizon` (5), `--lags`/`-p` (4), `--cluster` (`unit`), `--conf-level` (0.95), `--method` (`did`), `--did-method` (`twfe`); no `--result`/`--save-result` |\n\n# Examples\n\n```bash\nfriedman test panel hausman sim_panel.csv --dep=y --indep=x1,x2\nfriedman test serial breusch-pagan sim_panel.csv --dep=y --indep=x1,x2\nfriedman test panel pesaran-cd sim_panel.csv --dep=y --indep=x1,x2\nfriedman test multivariate lagselect :denmark --max-lags=4 --criterion=aic\nfriedman test multivariate granger :denmark --cause=1 --effect=2\nfriedman test pvar hansen-j sim_pvar.csv --id-col=id --time-col=time --lags=1\nfriedman test iv weak-instrument sim_iv.csv --dep=y --endogenous=x2 --instruments=z2,z3\nfriedman test iv anderson-rubin sim_iv.csv --dep=y --endogenous=x2 --instruments=z2,z3\nfriedman test iv wild-cluster sim_cluster.csv --dep=y --clusters=cluster --coefficient=x2\n```\n\n# See also\n\n* [Unit roots and long memory](unit-root.md) - panel unit-root tests used with these panels\n* [Regression diagnostics](diagnostics.md) - OLS residual and specification diagnostics\n* [Panel and discrete-choice estimation](../estimate/panel-choice.md) - the panel fits under test\n* [VAR estimation](../estimate/timeseries.md) - the VAR fits under test", "test/unit-root": "# Summary\n\nThese 21 leaves classify integration order: single-series unit-root/stationarity tests (`adf`, `kpss`, `pp`, `np`, `ers`, `dfgls`), break-robust variants (`za`, `lm-unitroot`, `adf-2break`, `fourier-adf`, `fourier-kpss`), seasonal roots (`hegy`), first-generation panel tests (`llc`, `ips`, `breitung`, `hadri`), second-generation panel tests (`cips`, `moon-perron`), semiparametric long-memory estimators (`gph`, `local-whittle`), and the random-walk `variance-ratio` test. Every leaf takes a required `data` CSV plus `--format`/`-f`, `--output`/`-o`, `--result` (replay a saved handle), and `--save-result`.\n\nRead nulls in opposite pairs: ADF/PP/NP/ERS/DFGLS test H0 of a unit root (rejection means stationary) while KPSS tests H0 of stationarity; the confirmatory pattern is ADF-rejects plus KPSS-fails-to-reject. Panel unit-root leaves read a wide T\u00d7N matrix (columns are units), unlike the long-format panel cointegration leaves. Deterministic-term vocabularies differ per leaf (`none|constant|trend|both` vs `constant|trend` vs `level|trend`) and are enforced, not coerced.\n\nLEAVES open question (intermediates): `unit-root` is a CLI path segment only \u2014 the generated reference has no `##` header for it, so each `###` entry below is counted exactly once. LEAVES open question (inventory): `INVENTORY.md` heads this command as \"(91)\" because it counts the four `test did` leaves under `did`, and its prose additionally omits `coint fisher-johansen`, `influence`, and `panel dh-causality` by name; LEAVES.md's 95 stands.\n\n# Functions\n\n## Single-series unit roots (11 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test unit-root adf` | unit root | `adf_test` |\n| `friedman test unit-root kpss` | stationary | `kpss_test` |\n| `friedman test unit-root pp` | unit root | `phillips_perron_test` |\n| `friedman test unit-root np` | unit root (Ng-Perron M-suite) | `ng_perron_test` |\n| `friedman test unit-root ers` | unit root (point-optimal) | `ers_point_optimal_test` |\n| `friedman test unit-root dfgls` | unit root (GLS-detrended) | `df_gls_test` |\n| `friedman test unit-root za` | unit root with one break | `zivot_andrews_test` |\n| `friedman test unit-root lm-unitroot` | unit root (breaks under null) | `lm_unit_root_test` |\n| `friedman test unit-root adf-2break` | unit root with two breaks | `adf_2_break_test` |\n| `friedman test unit-root fourier-adf` | unit root with smooth breaks | `fourier_adf_test` |\n| `friedman test unit-root fourier-kpss` | stationary with smooth breaks | `fourier_kpss_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `adf` | `data` (required) | `--column`/`-c` (1), `--max-lags` (auto AIC), `--trend` (`constant`: none\\|constant\\|trend\\|both) |\n| `kpss` | `data` (required) | `--column`/`-c` (1), `--trend` (`constant`: constant\\|trend) |\n| `pp` | `data` (required) | `--column`/`-c` (1), `--trend` (`constant`: none\\|constant\\|trend) |\n| `np` | `data` (required) | `--column`/`-c` (1), `--trend` (`constant`: constant\\|trend) |\n| `ers` | `data` (required) | `--column`/`-c` (1); flag `--trend` (constant-only default; needs 30+ obs) |\n| `dfgls` | `data` (required) | `--column`/`-c` (1), `--regression` (`constant`: constant\\|trend), `--lags` (`aic`: aic\\|bic\\|N), `--max-lags` (auto) |\n| `za` | `data` (required) | `--column`/`-c` (1), `--trend` (`both`: intercept\\|trend\\|both), `--trim` (0.15) |\n| `lm-unitroot` | `data` (required) | `--column`/`-c` (1), `--breaks` (0: 0\\|1\\|2), `--regression` (`level`: level\\|trend), `--lags` (`aic`), `--max-lags` (auto), `--trim` (0.15) |\n| `adf-2break` | `data` (required) | `--column`/`-c` (1), `--model` (`level`: level\\|trend\\|regime), `--lags` (`aic`), `--max-lags` (auto), `--trim` (0.10) |\n| `fourier-adf` | `data` (required) | `--column`/`-c` (1), `--regression` (`constant`: constant\\|trend), `--fmax` (3), `--lags` (`aic`), `--max-lags` (auto), `--trim` (0.15) |\n| `fourier-kpss` | `data` (required) | `--column`/`-c` (1), `--regression` (`constant`), `--fmax` (3), `--bandwidth` (auto) |\n\n## Seasonal and panel unit roots (7 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test unit-root hegy` | unit root at each seasonal frequency | `hegy_seasonal_unit_root_test`, `hegy_summary` |\n| `friedman test unit-root llc` | every unit has a unit root | `levin_lin_chu_test` |\n| `friedman test unit-root ips` | every unit has a unit root | `ips_per_unit_adf_statistics`, `im_pesaran_shin_test` |\n| `friedman test unit-root breitung` | every unit has a unit root | `breitung_panel_unit_root_test` |\n| `friedman test unit-root hadri` | all units stationary | `hadri_panel_stationarity_test` |\n| `friedman test unit-root cips` | unit root (cross-section dependence) | `pesaran_cips_test` |\n| `friedman test unit-root moon-perron` | unit root (factor dependence) | `moon_perron_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `hegy` | `data` (required) | `--column`/`-c` (1), `--frequency` (4: quarterly\\|12 monthly), `--deterministic` (`const-trend-seas`: none\\|const\\|const-seas\\|const-trend\\|const-trend-seas), `--lags` (`auto`) |\n| `llc` | `data` (required, wide T\u00d7N) | `--deterministic` (`constant`: none\\|constant\\|trend), `--lags` (`auto`), `--max-lags`, `--criterion` (`aic`: aic\\|bic\\|tstat); flag `--cs-demean` |\n| `ips` | `data` (required, wide T\u00d7N) | `--deterministic` (`constant`), `--lags` (`auto`), `--max-lags`, `--criterion` (`aic`); flag `--cs-demean` |\n| `breitung` | `data` (required, wide T\u00d7N) | `--deterministic` (`constant`), `--lags` (0, integer); flag `--cs-demean` |\n| `hadri` | `data` (required, wide T\u00d7N) | `--deterministic` (`constant`: constant\\|trend) |\n| `cips` | `data` (required, wide T\u00d7N) | `--lags` (`auto`), `--deterministic` (`constant`: constant\\|trend), `--id-col`/`--time-col` (optional) |\n| `moon-perron` | `data` (required, wide T\u00d7N) | `--factors` (`auto`), `--id-col`/`--time-col` (optional) |\n\n## Long memory and random walk (3 leaves)\n\n| Command | H0 | Output tables |\n|---|---|---|\n| `friedman test gph` | d = 0 (log-periodogram) | `gph_test` |\n| `friedman test local-whittle` | d = 0 (semiparametric Whittle) | `local_whittle_test` |\n| `friedman test variance-ratio` | random walk (all ratios = 1) | `variance_ratio_test`, `joint_random_walk_test` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `gph` | `data` (required) | `--column`/`-c` (1), `--bandwidth`/`-m` (floor(sqrt(T))), `--trim` (0) |\n| `local-whittle` | `data` (required) | `--column`/`-c` (1), `--bandwidth`/`-m` (floor(sqrt(T))) |\n| `variance-ratio` | `data` (required) | `--column`/`-c` (1), `--horizons` (`2,4,8,16`), `--method` (`lomackinlay`) |\n\n# Examples\n\n```bash\nfriedman test unit-root adf :nile --trend=constant\nfriedman test unit-root adf :nile --trend=trend --max-lags=8\nfriedman test unit-root kpss :nile --trend=constant\nfriedman test unit-root pp :nile --trend=constant\nfriedman test gph :nile --column=1 --bandwidth=32 --trim=1\nfriedman test local-whittle :nile --bandwidth=32\nfriedman test unit-root llc :denmark --deterministic=trend\nfriedman test unit-root ips :denmark --lags=2\nfriedman test variance-ratio :nile --horizons=2,5,10,20\n```\n\n# See also\n\n* [Cointegration and stability](cointegration.md) - what to run after finding I(1) series\n* [Regression diagnostics](diagnostics.md) - BDS, white-noise, and portmanteau tests\n* [Univariate estimation](../estimate/timeseries.md) - ARIMA/ARFIMA/ARDL fits for classified series"}, "types": ["Feature", "Package"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981", "Feature": "#3b82f6", "Package": "#8b5cf6"}};
window.BUNDLE_REPO = "https://github.com/FriedmanJP/Friedman-cli-OKF/blob/main/";
</script>
<script>

(function () {
  // FriedmanJP/Friedman-cli-OKF: graceful notice when the CDN
  // libraries (cytoscape/marked) fail to load instead of a dead page.
  if (typeof cytoscape === "undefined" || typeof marked === "undefined") {
    document.getElementById("graph").innerHTML =
      "<p class='muted' style='padding:24px'>Viewer libraries failed to load. " +
      "This page needs network access to cdn.jsdelivr.net for Cytoscape.js and marked.js.</p>";
    return;
  }
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // FriedmanJP/Friedman-cli-OKF: domain filter. Domains are the
  // top-level bundle directories (root concepts group under "(root)").
  const domains = [...new Set(bundle.nodes.map((n) => n.data.domain || "(root)"))].sort();
  const domainSelect = document.getElementById("filter-domain");
  for (const d of domains) {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = d;
    domainSelect.appendChild(opt);
  }
  domainSelect.addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", (n.data("domain") || "(root)") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    // FriedmanJP/Friedman-cli-OKF: concentric is the default layout.
    layout: { name: "concentric", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  // FriedmanJP/Friedman-cli-OKF: search covers description and
  // body text too (precomputed once), so function and method names match.
  const searchIndex = {};
  for (const n of bundle.nodes) {
    const d = n.data;
    searchIndex[d.id] = (
      (d.label || "") + " " + d.id + " " +
      (d.tags || []).join(" ") + " " + (d.description || "") + " " +
      (bundle.bodies[d.id] || "")
    ).toLowerCase();
  }
  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", !searchIndex[n.id()].includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl, conceptId);

    // FriedmanJP/Friedman-cli-OKF: view-source link to the
    // concept file in the bundle repository (hidden when unconfigured).
    const srcDt = document.getElementById("detail-source-dt");
    const srcDd = document.getElementById("detail-source-dd");
    const srcLink = document.getElementById("detail-source");
    if (window.BUNDLE_REPO) {
      srcDt.hidden = false;
      srcDd.hidden = false;
      srcLink.href = window.BUNDLE_REPO + conceptId + ".md";
    } else {
      srcDt.hidden = true;
      srcDd.hidden = true;
    }

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  // FriedmanJP/Friedman-cli-OKF: resolve a body href against the
  // current concept's directory (supports bundle-rooted /x.md and relative
  // x.md / ../x.md links, with optional #fragments).
  function resolveConceptHref(href, conceptId) {
    if (!href || /^(?:[a-z]+:)?\/\//i.test(href) || href.startsWith("#")) return null;
    const path = href.split("#", 1)[0].split("?", 1)[0];
    if (!path.endsWith(".md")) return null;
    let full;
    if (path.startsWith("/")) {
      full = path.slice(1, -3);
    } else {
      const dir = conceptId.includes("/") ? conceptId.slice(0, conceptId.lastIndexOf("/")) : "";
      full = (dir ? dir + "/" : "") + path.slice(0, -3);
    }
    const parts = [];
    for (const seg of full.split("/")) {
      if (seg === "" || seg === ".") continue;
      if (seg === "..") parts.pop();
      else parts.push(seg);
    }
    return parts.join("/");
  }

  function rewriteInternalLinks(root, conceptId) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      const target = resolveConceptHref(href, conceptId);
      if (target && nodeIndex[target]) {
        a.className = "internal";
        a.setAttribute("href", "#/concept/" + target);
        a.addEventListener("click", (e) => {
          e.preventDefault();
          showDetail(target);
        });
        return;
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();
