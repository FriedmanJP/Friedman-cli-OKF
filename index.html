e tolerance |\n| `determinacy-map` | `--threaded` / `--verbose-solver` / `--plot` / `--plot-save` | off | Threaded sweep / keep solver warnings / plot / save HTML |\n| `simulate` | `--periods` / `--burn` / `--seed` | `200` / `100` / `0` | Periods after burn-in / burn-in / seed (0 = none) |\n| `simulate` | `--antithetic` / `--plot` / `--plot-save` | off | Antithetic sampling / plot / save HTML |\n| `irf` | `--horizon` / `--shock-size` / `--n-sim` | `40` / `1.0` / `0` | Horizon / size in std devs / sim draws (0 = analytical) |\n| `irf` | `--constraints` / `--plot` / `--plot-save` | `\"\"` / off | OccBin TOML / plot / save HTML |\n| `fevd` | `--horizon` / `--unconditional` | `40` / off | Horizon / asymptotic FEVD (order >= 2 perturbation) |\n| `fevd` | `--plot` / `--plot-save` | off | Plot / save HTML |\n| `hd` | `--data, -d` / `--observables` / `--states` | `\"\"` / `\"\"` / `observables` | CSV data / observable names / `observables\\|all` |\n| `hd` | `--measurement-error` | `\"\"` | Meas-error s.d. (csv) or `auto` |\n| `hd` | `--plot` / `--plot-save` | off | Plot / save HTML |\n| `moments` | `--method` / `--order` / `--lags` | `perturbation` / `2` / `1` | Needs PerturbationSolution; order 1-3; autocov lags >= 1 |\n| `perfect-foresight` | `--shocks` / `--constraints` / `--constraint-solver` | `\"\"` | Shock-sequence CSV / constraints TOML / backend |\n| `perfect-foresight` | `--periods` / `--sparsity` / `--max-iter` / `--tol` | `100` / `auto` / `100` / `1e-8` | Periods / jacobian `auto\\|dense` / Newton iters / tol |\n| `perfect-foresight` | `--plot` / `--plot-save` | off | Plot / save HTML |\n| `estimate` | `--data, -d` / `--params` | `\"\"` | CSV data / comma-separated parameter names |\n| `estimate` | `--method` | `irf_matching` | `irf_matching\\|likelihood\\|bayesian\\|smm` |\n| `estimate` | `--solve-method` / `--solve-order` | `gensys` / `1` | Solution method / perturbation order |\n| `estimate` | `--weighting` / `--irf-horizon` / `--var-lags` / `--sim-ratio` / `--bounds` | `optimal` / `20` / `4` / `5` / `\"\"` | `identity\\|optimal\\|diagonal` / IRF horizon / VAR lags / SMM sim ratio / bounds TOML |\n\n# Examples\n\n```bash\ncat > rbc.toml <<'EOF'\n[model]\nparameters = { rho = 0.9, sigma = 0.01 }\nendogenous = [\"Y\", \"C\"]\nexogenous = [\"e\"]\nlinear = true\n[[model.equations]]\nexpr = \"Y[t] = rho * Y[t-1] + sigma * e[t]\"\n[[model.equations]]\nexpr = \"C[t] = Y[t]\"\nEOF\nfriedman dsge steady-state rbc.toml\nfriedman dsge solve rbc.toml --method=perturbation --order=2\nfriedman dsge irf rbc.toml --horizon 40\nfriedman dsge fevd rbc.toml --horizon 40\nfriedman dsge simulate rbc.toml --periods 200 --burn 100 --seed 7\nfriedman dsge moments rbc.toml --order 2 --lags 4\nfriedman dsge determinacy-map rbc.toml --config det.toml\nfriedman dsge estimate rbc.toml --data obs.csv --params rho,sigma --method irf_matching\nfriedman dsge perfect-foresight rbc.toml --shocks shocks.csv --periods 100\n```\n\n# See also\n\n* [Bayesian DSGE](bayes.md) - full posterior workflow on the same model files\n* [Structured Family Models](family.md) - bank, CT, DCEGM, firm, OLG nodes\n* [HA-DSGE](hadsge.md) - one-household heterogeneous-agent models", "dsge/family": "# Summary\n\nSix intermediate sub-nodes (`bank`, `ct`, `dcegm`, `firm`, `lifecycle`, `olg`) group 26 leaves over parameterized family models \u2014 no RA model file needed except `dcegm`, which takes a `model` argument (builtin `retirement` or a `.jl` DCEGMProblem/DCEGMSystem spec). Every leaf accepts `--format, -f` (`table`) and `--output, -o` (`\"\"`); MIT/IRF leaves share `--horizon`/`--shock-size`/`--persist` conventions (TFP impulse with AR(1) decay) and `--plot`/`--plot-save` unless noted. `transition` leaves take a required `--z-path` CSV of the TFP path (length >= 2, all positive); `lifecycle transition` instead takes `--k0` XOR `--z-path`. The `ct` node covers one-asset Aiyagari plus `--two-asset` Kaplan-Moll-Violante (with `--ge` for general equilibrium); `olg` covers Blanchard perpetual youth with an `--nk` New-Keynesian variant.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman dsge bank pe` | Bewley-bank partial equilibrium at given (R, rk) | `bewley_banks_pe`, `bewley_banks_pe_policy` |\n| `friedman dsge bank steady-state` | Bewley-bank credit-market stationary equilibrium | `bewley_banks_steady_state`, `bewley_banks_steady_state_policy` |\n| `friedman dsge bank irf` | Bewley-bank MIT IRF to TFP | `bewley_banks_irf_*` |\n| `friedman dsge bank transition` | Bewley-bank MIT TFP path | `bewley_banks_transition`, `bewley_banks_transition_diagnostics` |\n| `friedman dsge ct solve` | CT Aiyagari (or KMV two-asset) stationary equilibrium | `ct_aiyagari_prices`, `ct_aiyagari_aggregates`, `ct_two_asset_solution`, `ct_two_asset_ge` |\n| `friedman dsge ct irf` | MIT IRF of CT Aiyagari or two-asset GE | `ct_irf_*` |\n| `friedman dsge ct fevd` | FEVD from the CT MIT impulse (single TFP shock) | `ct_fevd_*` |\n| `friedman dsge ct transition` | MIT perfect-foresight transition (`ct_mit_shock`) | `ct_mit_shock_transition`, `ct_two_asset_transition` |\n| `friedman dsge dcegm solve <model>` | Discrete-continuous EGM household solution | `dcegm_solve_diagnostics`, `dcegm_policy`, `dcegm_kinks` |\n| `friedman dsge dcegm steady-state <model>` | DCEGM capital-market equilibrium | `dcegm_equilibrium` |\n| `friedman dsge dcegm irf <model>` | MIT IRF of a DCEGM equilibrium (needs GE) | `dcegm_irf_*` |\n| `friedman dsge dcegm fevd <model>` | FEVD of a DCEGM equilibrium (single TFP shock) | `dcegm_fevd_*` |\n| `friedman dsge dcegm simulate <model>` | MIT simulation of a DCEGM equilibrium (levels) | `dcegm_simulation` |\n| `friedman dsge dcegm transition <model>` | MIT TFP path of a DCEGM equilibrium | `dcegm_transition_path`, `dcegm_transition_diagnostics` |\n| `friedman dsge firm steady-state` | Khan-Thomas plant-level stationary equilibrium | `khan_thomas_steady_state`, `khan_thomas_policy` |\n| `friedman dsge firm irf` | Khan-Thomas MIT IRF of Y, I, K, N, C, Z | `khan_thomas_irf_*` |\n| `friedman dsge firm transition` | Khan-Thomas MIT TFP path (`--prices ss\\|ge`) | `khan_thomas_transition`, `khan_thomas_transition_diagnostics` |\n| `friedman dsge lifecycle steady-state` | Life-cycle OLG stationary equilibrium | `lifecycle_steady_state`, `lifecycle_age_profiles` |\n| `friedman dsge lifecycle irf` | MIT IRF of a life-cycle OLG steady state | `lifecycle_irf_*` |\n| `friedman dsge lifecycle fevd` | FEVD of a life-cycle OLG steady state | `lifecycle_fevd_*` |\n| `friedman dsge lifecycle simulate` | MIT simulation of a life-cycle OLG steady state | `lifecycle_simulation` |\n| `friedman dsge lifecycle transition` | Life-cycle perfect-foresight transition | `lifecycle_transition_path`, `lifecycle_transition_diagnostics` |\n| `friedman dsge olg solve` | Blanchard perpetual-youth steady state + saddle path | `blanchard_olg_steady_state`, `blanchard_olg_dynamics` |\n| `friedman dsge olg simulate` | Blanchard transitional dynamics from k0 | `blanchard_olg_transition` |\n| `friedman dsge olg irf` | Blanchard IRF via to_spec (TFP; NK adds monetary) | `blanchard_olg_irf_*` |\n| `friedman dsge olg fevd` | Blanchard FEVD via to_spec (TFP; NK adds monetary) | `blanchard_olg_fevd_*` |\n\nPer-node options (defaults from the generated reference):\n\nBank (`--n-n` 25 grid points, `--n-xi` 3 states throughout): `pe` adds `--n-min`/`--n-max` (0.05/8.0), `--beta`/`--sigma`/`--lambda` (0.99/0.95/0.2), `--zeta1`/`--zeta2` (0.02/2.0), `--r`/`--rk` (1.01/0.05), `--z`/`--alpha` (0.25/0.33), `--max-iter`/`--tol` (250/1e-6). `steady-state` adds `--r` (held fixed), `--r-lo`/`--r-hi` (NaN = default bracket), `--tol`/`--max-iter` (1e-4/24). `irf` adds `--horizon` (20), `--shock-size` (0.01), `--persist` (0.5), `--z` (0.25), `--plot`. `transition` adds required `--z-path`, `--z` (0.25).\n\nCT (`--alpha`/`--rho`/`--sigma`/`--delta`/`--z` = 0.36/0.05/2.0/0.05/1.0 throughout): `solve` adds `--a-min`/`--a-max` (0.0/30.0), `--grid-size` (100), `--max-iter`/`--tol` (100/1e-6), `--two-asset`, `--ge` (two-asset GE; requires `--two-asset`). `irf`/`fevd` add `--horizon` (40), `--shock-size` (0.01), `--persist` (0.0), `--dt` (0.25), `--grid-size` (100), `--two-asset`, `--plot`. `transition` adds `--shock-size` (0.95 = Z0/Z multiplier), `--periods` (40), `--dt` (0.25), `--a-max` (30.0), `--grid-size` (100), `--max-iter`/`--tol` (100/1e-6), `--z-path` (two-asset MIT), `--two-asset`, `--plot` (one-asset only).\n\nDCEGM (all take required `model`; `--n-periods` 20 finite horizon, 0 = infinite; `--beta` 0.98; `--wage` 20.0; `--n-a`/`--a-max` grid): `solve` adds `--r` (1.0), `--disutility` (1.0), `--sigma`/`--n-shocks` (0.0/1), `--taste-shock-scale` (0.0), `--pension`/`--credit-limit` (0.0), `--curvature` (2.0), `--max-iter`/`--tol` (500/1e-8), `--period`/`--income` (1/1 policy slice), `--view` (`policy\\|threshold`), `--plot`. `steady-state` adds firm `--alpha`/`--delta`/`--z`/`--l` (0.36/0.08/1.0/1.0), `--r-lo`/`--r-hi` (0.001/0.2), `--labor` (`exogenous\\|measured`), `--work-option` (`work`), `--n-sim` (40), `--tol`/`--max-iter` (1e-4/40), `--reprice-wage`. `irf`/`fevd`/`simulate` add firm `--alpha`/`--delta`/`--z`, `--horizon` 40 (irf/fevd) or `--periods` 40 (simulate), `--shock-size` (0.01; simulate 0.0), `--persist` (0.0); irf/fevd add `--plot`. `transition` adds required `--z-path`.\n\nFirm (`--n-k` 16 capital nodes, `--n-eps` 3 states, `--z` 1.0): `steady-state` adds `--alpha`/`--nu` (0.256/0.64), `--delta`/`--beta`/`--gamma` (0.069/0.977/1.016), `--xi-bar`/`--b` (0.0083/0.011), `--phi` (2.4), `--rho-z`/`--sigma-z`/`--rho-e`/`--sigma-e` (0.859/0.014/0.859/0.022), `--tol`/`--max-iter` (1e-5/16). `irf` adds `--horizon` (20), `--shock-size` (0.01), `--persist` (NaN = firm rho_z), `--prices` (`ss\\|ge`), `--plot`. `transition` adds required `--z-path`, `--prices` (`ss`).\n\nLifecycle: `steady-state` (`--j` 60, `--j-retire` 45, `--n-a` 200) adds `--survival` (0.99), `--a-max` (60.0), `--beta`/`--sigma` (0.97/2.0), `--alpha`/`--delta` (0.36/0.06), `--z` (1.0), `--n-pop` (0.0), `--replacement` (0.4), `--credit-limit` (0.0), `--income-rho`/`--income-sigma`/`--income-states` (0.95/0.2/5), `--config` (TOML `[lifecycle]` vectors), `--r-lo`/`--r-hi` (-0.02/0.1), `--tol`/`--max-iter` (1e-6/60), `--bequest-iter` (50), `--no-annuities`, `--plot`. `irf`/`fevd`/`simulate` use lighter grids (`--j` 40, `--j-retire` 30, `--n-a` 40, `--income-states` 3) with `--horizon`/`--periods` 20, `--shock-size` (0.01; simulate 0.0), `--persist` (0.0); irf/fevd add `--plot`. `transition` adds `--config`, `--k0` (NaN) XOR `--z-path`, `--horizon` (80, ignored with `--z-path`), `--tol`/`--max-iter`/`--relax` (1e-5/80/0.5).\n\nOLG (`--alpha`/`--beta`/`--delta`/`--gamma`/`--z`/`--debt` = 0.36/0.96/0.08/0.98/1.0/0.0; b != 0 see MEMs#237): `solve` adds nothing further. `simulate` adds `--k0` (0 = 80% of SS k), `--horizon` (50), `--plot`. `irf`/`fevd` add `--rho-z`/`--sigma-z` (0.0), `--horizon` (40), `--shock-size` (1.0, irf only), NK options `--kappa`/`--phi-pi`/`--phi-y`/`--rho-i`/`--sigma-i`/`--omega` (0.1/1.5/0.125/0.0/0.0/0.0), `--nk` flag (adds pi, i, rr, eps_i), `--plot`.\n\n# Examples\n\n```bash\nfriedman dsge bank steady-state\nfriedman dsge bank irf --horizon 20 --shock-size 0.01\nfriedman dsge ct solve\nfriedman dsge ct solve --two-asset --ge\nfriedman dsge ct irf --horizon 40\nfriedman dsge dcegm solve retirement\nfriedman dsge dcegm steady-state retirement\nfriedman dsge dcegm irf retirement --horizon 40\nfriedman dsge firm steady-state\nfriedman dsge firm transition --z-path 1.0,1.01,1.0 --prices ge\nfriedman dsge lifecycle steady-state\nfriedman dsge olg solve\nfriedman dsge olg irf --horizon 40 --nk\n```\n\n# See also\n\n* [RA Core: Solve and Analyze](core.md) - representative-agent solution methods\n* [HA-DSGE](hadsge.md) - one-household SSJ/Reiter/Krusell-Smith models\n* [Simulation (DGPs)](../data/simulate.md) - `data simulate olg` and `data simulate ct` DGPs", "dsge/hadsge": "# Summary\n\nOne-household HA-DSGE (promoted from `dsge ha`) over builtins `huggett` (start here), `krusell-smith`, `one-asset-hank`, `two-asset-hank`, `endogenous-labor` (leading `:` accepted), or a `.jl` file evaluating to a heterogeneous-agent `ModelSpec` (an RA spec is `usage/wrong-command`, the mirror of the RA loader rule). All 11 leaves take a required `model` argument and share `--hh-solver` (`egm` default; SSJ is EGM-only; not with krusell-smith), `--distribution` (`young`/`winberry`), `--format`/`--output`. Method choice: `ssj` (sequence-space Jacobians; default for `solve`), `reiter` (linearized distribution + aggregates; the only method with distribution/inequality IRFs), `krusell-smith` (PLM fixed point; no linear IRF path). Set the asset grid upper bound generously: mass piling at `a_max` breaks market clearing invisibly (MEMs warns on stderr).\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman hadsge steady-state <model>` | Stationary equilibrium + Euler accuracy | `ha_steady_state_aggregates`, `ha_steady_state_prices`, `ha_steady_state_diagnostics`, `ha_euler_accuracy_log10_by_convention` |\n| `friedman hadsge solve <model>` | Solve via ssj/reiter/krusell-smith | `ha_dsge_solve_diagnostics`, `krusell_smith_plm_coefficients`, steady-state tables |\n| `friedman hadsge irf <model>` | Aggregate IRFs (ssj/reiter) | `ha_dsge_irf_*` (per shock) |\n| `friedman hadsge fevd <model>` | Aggregate FEVD (ssj/reiter) | `ha_dsge_fevd_*` (per variable) |\n| `friedman hadsge hd <model>` | Historical decomposition of aggregates | `ha_historical_decomposition_*` (per shock) |\n| `friedman hadsge simulate <model>` | Aggregate paths from linearized solution | `ha_dsge_simulation` |\n| `friedman hadsge simulate-panel <model>` | Individual asset holdings from SS policies | `ha_panel_simulation_summary` |\n| `friedman hadsge distribution-irf <model>` | Wealth-distribution IRF (Reiter only) | `ha_distribution_irf` |\n| `friedman hadsge inequality-irf <model>` | Gini and wealth-percentile IRFs (Reiter only) | `ha_inequality_irf` |\n| `friedman hadsge accuracy <model>` | Den Haan (2010) PLM accuracy test | `den_haan_accuracy`, `reference_vs_plm_only_aggregate_path`, `den_haan_simulation_settings` |\n| `friedman hadsge estimate <model>` | Bayesian HA estimation (MH/SMC) | `ha_dsge_bayesian_posterior`, `ha_dsge_bayesian_settings` |\n\nLeaf options beyond the shared `--hh-solver`/`--distribution`/`--format`/`--output`:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `steady-state` | `--euler-points` | `midpoints` | Euler-error points: `midpoints\\|nodes` |\n| `steady-state` | `--max-iter` / `--tol` | `0` / `0.0` | GE iters / clearing tol (0 = upstream default) |\n| `steady-state` | `--save-model` | `\"\"` | Save handle |\n| `solve` | `--method` | `ssj` | `ssj\\|reiter\\|krusell-smith` |\n| `solve` | `--n-reduced` / `--t-horizon` | `30` / `300` | Reduced states (SSJ/Reiter) / sequence horizon (SSJ) |\n| `solve` | `--save-model` | `\"\"` | Save handle |\n| `irf` | `--method` / `--horizon` / `--n-reduced` | `reiter` / `40` / `30` | `ssj\\|reiter` / horizon / reduced states |\n| `irf` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `fevd` | `--method` / `--horizon` / `--n-reduced` | `reiter` / `40` / `30` | `ssj\\|reiter` / horizon / reduced states |\n| `fevd` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `hd` | `--method` / `--data, -d` / `--observables` | `ssj` / `\"\"` / `\"\"` | `ssj\\|reiter` / CSV levels / aggregates (ss.aggregates/ss.prices keys) |\n| `hd` | `--measurement-error` / `--n-reduced` / `--t-horizon` | `\"\"` / `30` / `300` | s.d. csv or `auto` / reduced states / SSJ horizon |\n| `hd` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `simulate` | `--method` / `--periods` / `--seed` / `--n-reduced` | `reiter` / `200` / `0` / `30` | `ssj\\|reiter` / periods / seed / reduced states |\n| `simulate` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `simulate-panel` | `--n-agents` / `--periods` / `--seed` | `1000` / `100` / `0` | Agents / periods / seed (no `--method`) |\n| `distribution-irf` | `--method` / `--horizon` / `--shock-index` / `--shock-size` / `--n-reduced` | `reiter` / `40` / `1` / `1.0` / `30` | Must be reiter / horizon / 1-based shock / size (std) / states |\n| `inequality-irf` | `--method` / `--horizon` / `--shock-index` / `--shock-size` / `--n-reduced` | `reiter` / `40` / `1` / `1.0` / `30` | Must be reiter / horizon / 1-based shock / size (std) / states |\n| `inequality-irf` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `accuracy` | `--method` / `--n-reduced` | `krusell-smith` / `30` | Solution to score / reduced states |\n| `accuracy` | `--t-sim` / `--t-burn` / `--t-fit` | `10000` / `1000` / `4000` | Sim length / burn-in / PLM fit length |\n| `accuracy` | `--rho-z` / `--sigma-z` / `--seed` | `0.95` / `0.007` / `98765` | Shock persistence / s.d. / seed |\n| `accuracy` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `estimate` | `--data` / `--priors` / `--observables` | `\"\"` (data, priors required) | Observed aggregates CSV / priors TOML / aggregates |\n| `estimate` | `--method` / `--sampler` | `ssj` / `mh` | Re-solved each draw: `ssj\\|reiter` / `mh\\|smc` |\n| `estimate` | `--n-draws` / `--burnin` / `--n-smc` / `--n-mh-steps` / `--ess-target` | `2000` / `500` / `500` / `1` / `0.5` | RWMH draws / burn-in / SMC particles / MH steps / ESS target |\n| `estimate` | `--t-horizon` / `--n-reduced` / `--proposal-scale` / `--adapt-interval` | `300` / `15` / `0.01` / `100` | SSJ truncation / reduced states / RWMH scale / adapt interval |\n| `estimate` | `--measurement-error` / `--seed` | `none` / `0` | `none\\|auto` (10% per-obs var) / seed |\n\n# Examples\n\n```bash\nfriedman hadsge steady-state huggett --format json\nfriedman hadsge solve huggett --method reiter --n-reduced 10\nfriedman hadsge irf huggett --method reiter --horizon 40\nfriedman hadsge distribution-irf huggett --horizon 40 --shock-index 1\nfriedman hadsge inequality-irf huggett --horizon 40\nfriedman hadsge simulate-panel huggett --n-agents 1000 --periods 100 --seed 7\nfriedman hadsge accuracy krusell-smith --t-sim 10000 --t-burn 1000\nfriedman hadsge estimate one-asset-hank --data aggregates.csv --priors priors.toml --method ssj --sampler mh --n-draws 2000\n```\n\n# See also\n\n* [RA Core: Solve and Analyze](core.md) - representative-agent solution methods\n* [Structured Family Models](family.md) - bank, CT, DCEGM, firm, OLG nodes\n* [Simulation (DGPs)](../data/simulate.md) - `data simulate ha` aggregate deviations", "estimate/panel-choice": "# Summary\n\nThese 14 leaves fit panel estimators (`preg`, `piv`, `plogit`, `pprobit`, `pmg`, `pvar`, `xtcointreg`) and discrete-choice models (`logit`, `probit`, `ologit`, `oprobit`, `mlogit`, `poisson`, `nbreg`). Every leaf takes a required `data` CSV plus `--output`/`-o`, `--format`/`-f` (`table|csv|json`), `--save-model`. Panel leaves read long-format panels with `--id-col`/`--time-col` (defaulting to the first/second columns); choice leaves default `--dep` to the first numeric column. `preg` supports Arellano-Bond/Blundell-Bond GMM (`--method ab|bb`) and high-dimensional fixed effects (`--absorb`); `poisson`/`nbreg` share the `--offset`/`--exposure` and `--irr` incidence-rate-ratio surface.\n\nLEAVES open question (intermediates): `panel` and `choice` are CLI path segments only \u2014 no `##` headers exist for them in the generated reference, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Panel (7 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate panel preg` | Panel OLS incl. AB/BB GMM and HDFE | `panel_regression_coefficients`, `model_statistics`, `dynamic_panel_diagnostics`, `hdfe_absorption` |\n| `friedman estimate panel piv` | Panel IV (FE/RE/FD/Hausman-Taylor) | `panel_iv_coefficients`, `weak_instrument_diagnostics` |\n| `friedman estimate panel plogit` | Panel logit | `panel_logit_coefficients`, `model_statistics` |\n| `friedman estimate panel pprobit` | Panel probit | `panel_probit_coefficients`, `model_statistics` |\n| `friedman estimate panel pmg` | Panel ARDL: PMG/MG/DFE | `panel_ardl_long_run_coefficients`, `panel_ardl_short_run_ec_coefficients`, `panel_ardl_diagnostics` |\n| `friedman estimate panel pvar` | GMM panel VAR | `panel_var_coefficients`, `panel_summary` |\n| `friedman estimate panel xtcointreg` | Panel FMOLS/DOLS cointegrating regression | `panel_cointegrating_regression_coefficients`, `panel_cointegrating_regression_diagnostics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `preg` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col`, `--cov-type` (`cluster`: ols\\|cluster\\|twoway\\|driscoll-kraay\\|pcse), `--method`/`-m` (`fe`), `--ar1` (`none`: none\\|common\\|panel-specific), `--pcse-unbalanced` (`casewise`), `--absorb` (HDFE dims, fe only), `--hdfe-tol` (1e-8), `--hdfe-maxiter` (1000), `--min-lag-endo` (2), `--max-lag-endo` (99); flags `--twoway`, `--collapse` |\n| `piv` | `data` (required, long panel) | `--dep`, `--exog`, `--endog`, `--instruments`, `--method`/`-m` (`fe`: fe\\|re\\|fd\\|hausman-taylor), `--cov-type` (`cluster`: ols\\|cluster\\|twoway\\|driscoll-kraay), `--id-col`, `--time-col` |\n| `plogit` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col`, `--cov-type` (`cluster`: ols\\|cluster\\|twoway\\|driscoll-kraay), `--method`/`-m` (`pooled`) |\n| `pprobit` | `data` (required, long panel) | `--dep`, `--indep`, `--id-col`, `--time-col`, `--cov-type` (`cluster`), `--method`/`-m` (`pooled`) |\n| `pmg` | `data` (required) | `--id-col`, `--time-col`, `--dep`, `--indep`, `--method` (`pmg`: pmg\\|mg\\|dfe), `--trend` (`constant`: none\\|constant\\|trend), `--p` (1), `--q` (1), `--maxiter` (100), `--tol` (1e-8) |\n| `pvar` | `data` (required, long panel) | `--id-col`/`--time-col` (required), `--lags`/`-p` (1), `--dependent`, `--predet`, `--exog`, `--transformation` (`fd`: fd\\|fod), `--steps` (`twostep`: onestep\\|twostep), `--method` (`gmm`: gmm\\|feols), `--min-lag-endo` (2), `--max-lag-endo` (99); flags `--system`, `--collapse` |\n| `xtcointreg` | `data` (required) | `--id-col`, `--time-col`, `--dep`, `--indep`, `--method` (`fmols`: fmols\\|dols), `--pooling` (`group`: group\\|pooled), `--trend` (`const`: none\\|const\\|linear), `--kernel` (`bartlett`: bartlett\\|parzen\\|qs\\|tukey-hanning), `--bandwidth` (`andrews`: andrews\\|nw94\\|lag), `--leads`/`--lags` (`auto`), `--ic` (`aic`: aic\\|bic), `--dols-se` (`lrv`: lrv\\|robust) |\n\n## Discrete choice (7 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate choice logit` | Binary logit (IRLS) | `logit_regression_coefficients`, `fit_statistics` |\n| `friedman estimate choice probit` | Binary probit (IRLS) | `probit_regression_coefficients`, `fit_statistics` |\n| `friedman estimate choice ologit` | Ordered logit with cutpoints | `ordered_logit_coefficients`, `cutpoints`, `fit_statistics` |\n| `friedman estimate choice oprobit` | Ordered probit with cutpoints | `ordered_probit_coefficients`, `cutpoints`, `fit_statistics` |\n| `friedman estimate choice mlogit` | Multinomial logit, tidy by alternative | `multinomial_logit_coefficients`, `fit_statistics` |\n| `friedman estimate choice poisson` | Poisson QMLE with robust default | `poisson_regression_coefficients`, `incidence_rate_ratios`, `fit_statistics` |\n| `friedman estimate choice nbreg` | Negative-binomial (NB2) with dispersion | `negative_binomial_regression_coefficients`, `overdispersion_parameter`, `incidence_rate_ratios`, `fit_statistics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `logit` | `data` (required) | `--dep`, `--cov-type` (`hc1`: ols\\|hc0\\|hc1\\|hc2\\|hc3\\|cluster), `--clusters`, `--maxiter` (100), `--tol` (1e-8) |\n| `probit` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--clusters`, `--maxiter` (100), `--tol` (1e-8) |\n| `ologit` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--clusters` |\n| `oprobit` | `data` (required) | `--dep`, `--cov-type` (`hc1`), `--clusters` |\n| `mlogit` | `data` (required) | `--dep`, `--cov-type` (`ols`: ols\\|hc0\\|hc1\\|hc2\\|hc3) |\n| `poisson` | `data` (required) | `--dep`, `--offset`/`--exposure` (exclusive), `--cov-type` (`robust`: robust\\|mle\\|hc0\\|hc1\\|hc2\\|hc3\\|cluster), `--clusters`, `--maxiter` (100), `--tol` (1e-10), `--conf-level` (0.95); flag `--irr` |\n| `nbreg` | `data` (required) | `--dep`, `--offset`/`--exposure` (exclusive), `--maxiter` (1000), `--tol` (1e-10), `--conf-level` (0.95); flag `--irr` |\n\n# Examples\n\n```bash\nfriedman estimate panel preg panel.csv --dep=y --indep=x1,x2 --id-col=id --time-col=time\nfriedman estimate panel pvar panel.csv --id-col=id --time-col=time --lags=1 --dependent=y,x1\nfriedman estimate panel pmg panel.csv --dep=y --indep=x1,x2 --method=pmg --p=1 --q=1\nfriedman estimate choice logit choice.csv --dep=voted --cov-type=hc1\nfriedman estimate choice mlogit choice.csv --dep=mode\nfriedman estimate choice poisson counts.csv --dep=visits --exposure=days --irr\nfriedman estimate choice nbreg counts.csv --dep=visits --irr\n```\n\n# See also\n\n* [Regression](regression.md) - cross-section and systems regression estimators\n* [Time-series and factor estimation](timeseries.md) - multivariate, univariate, and factor estimators\n* [Panel, VAR, IV, and DiD tests](../test/panel-var.md) - Hausman, F-FE, and PVAR specification tests\n* [Regression diagnostics](../test/diagnostics.md) - Brant, Hausman-IIA, and dispersion choice-model tests", "estimate/regime-volatility": "# Summary\n\nThese 20 leaves fit nonlinear conditional-mean models (threshold regression, SETAR, STAR, Markov-switching regression and autoregression, TVP regression) and conditional-variance models (ARCH, GARCH, EGARCH, GJR-GARCH, IGARCH, CGARCH, APARCH, FIGARCH, FIEGARCH, GARCH-MIDAS, CCC/DCC/BEKK, stochastic volatility). Every leaf takes a required `data` CSV path plus the shared `--output`/`-o`, `--format`/`-f` (`table|csv|json`), and `--save-model` flags; most regime and several volatility leaves add `--plot`/`--plot-save`. The `setar`/`threshold` leaves attach a Hansen (1996) linearity test unless `--no-linearity` is passed.\n\nLEAVES open question (intermediates): `regime` and `volatility` are CLI path segments only \u2014 the generated reference has no `##` headers for them, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Regime-switching (6 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate regime threshold` | Cross-section threshold regression, Hansen CI | `threshold_regression_coefficients`, `threshold_regression_diagnostics` |\n| `friedman estimate regime setar` | Self-exciting TAR with linearity test | `setar_coefficients`, `setar_diagnostics` |\n| `friedman estimate regime star` | Smooth-transition AR (LSTR1/LSTR2/ESTR/auto) | `star_regime_coefficients`, `star_transition_parameters`, `star_diagnostics` |\n| `friedman estimate regime ms-ar` | Markov-switching AR (Hamilton form default) | `ms_ar_regime_coefficients`, `ms_ar_regime_variances`, `ms_ar_transition_matrix`, `ms_ar_regime_probabilities`, `ms_ar_diagnostics` |\n| `friedman estimate regime ms` | K-state Markov-switching regression | `ms_regression_regime_coefficients`, `ms_regression_regime_variances`, `ms_regression_transition_matrix`, `ms_regression_regime_probabilities`, `ms_regression_diagnostics` |\n| `friedman estimate regime tvp` | Kalman-filter TVP regression | `tvp_hyper_parameters`, `tvp_coefficient_paths`, `tvp_diagnostics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `threshold` | `data` (required) | `--dep` (first numeric), `--threshold-col` (required splitter), `--trim` (0.15), `--reps` (1000), `--ci-level` (0.95: 0.90\\|0.95\\|0.99); flags `--het`, `--no-linearity` |\n| `setar` | `data` (required) | `--column`/`-c` (1), `--p` (1), `--d` (`1` or `auto`), `--trim` (0.15), `--reps` (1000), `--ci-level` (0.95); flags `--het`, `--no-linearity` |\n| `star` | `data` (required) | `--column`/`-c` (1), `--p` (1), `--d` (1), `--type` (`auto`: lstr1\\|lstr2\\|estr\\|auto), `--n-gamma`/`--n-c` (15), `--transition-col` (0 = self-exciting) |\n| `ms-ar` | `data` (required) | `--column`/`-c` (1), `--p` (1), `--k-regimes` (2), `--max-iter` (1000); flag `--switching-variance` (default off) |\n| `ms` | `data` (required) | `--dep` (first numeric), `--k-regimes` (2), `--max-iter` (500), `--tol` (1e-8); flag `--no-switching-variance` (default: variance switches) |\n| `tvp` | `data` (required) | `--dep` (first numeric), `--init-mode` (`kappa`: kappa\\|diffuse), `--kappa` (1e6); flag `--no-intercept` (default: time-varying intercept included) |\n\n## Univariate volatility (11 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate volatility arch` | ARCH(q) | `arch_coefficients` |\n| `friedman estimate volatility garch` | GARCH(p,q), normal/Student/GED | `garch_coefficients`, `conditional_distribution` |\n| `friedman estimate volatility egarch` | EGARCH with leverage, 3 distributions | `egarch_coefficients`, `conditional_distribution` |\n| `friedman estimate volatility gjr-garch` | GJR-GARCH asymmetry, 3 distributions | `gjr_garch_coefficients`, `conditional_distribution` |\n| `friedman estimate volatility igarch` | Integrated GARCH | `igarch_coefficients`, `igarch_diagnostics` |\n| `friedman estimate volatility cgarch` | Component GARCH (permanent/transitory) | `cgarch_coefficients`, `cgarch_diagnostics` |\n| `friedman estimate volatility aparch` | Asymmetric power ARCH (est. delta/gamma) | `aparch_coefficients`, `aparch_diagnostics` |\n| `friedman estimate volatility figarch` | Fractionally integrated GARCH | `figarch_coefficients`, `figarch_diagnostics` |\n| `friedman estimate volatility fiegarch` | Fractionally integrated EGARCH | `fiegarch_coefficients`, `fiegarch_diagnostics` |\n| `friedman estimate volatility garch-midas` | GARCH-MIDAS two-frequency variance | `garch_midas_coefficients`, `garch_midas_diagnostics` |\n| `friedman estimate volatility sv` | MCMC stochastic volatility | `sv_coefficients` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `arch` | `data` (required) | `--column`/`-c` (1), `--q` (1) |\n| `garch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--dist` (`normal`: normal\\|student\\|ged) |\n| `egarch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--dist` (`normal`: normal\\|student\\|ged) |\n| `gjr-garch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--dist` (`normal`: normal\\|student\\|ged) |\n| `igarch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1) |\n| `cgarch` | `data` (required) | `--column`/`-c` (1) |\n| `aparch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--fix-delta`/`--fix-gamma` (pin power/asymmetry; default estimates) |\n| `figarch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--d0` (0.4), `--truncation` (1000), `--dist` (`normal`) |\n| `fiegarch` | `data` (required) | `--column`/`-c` (1), `--p`/`--q` (1), `--d0` (0.4), `--truncation` (1000), `--dist` (`normal`) |\n| `garch-midas` | `data` (required) | `--column`/`-c` (1), `--m-freq` (required HF-per-block), `--k` (12), `--rv` (`realized`: realized\\|macro), `--span` (`fixed`: fixed\\|rolling), `--config` ([garch_midas] x_lf, required for `--rv macro`) |\n| `sv` | `data` (required) | `--column`/`-c` (1), `--draws`/`-n` (5000) |\n\n## Multivariate volatility (3 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate volatility ccc` | Constant conditional correlation GARCH | `ccc_garch_conditional_correlation`, `ccc_garch_diagnostics` |\n| `friedman estimate volatility dcc` | Dynamic conditional correlation (cDCC option) | `dcc_garch_conditional_correlation`, `dcc_garch_dynamics_parameters`, `dcc_garch_diagnostics` |\n| `friedman estimate volatility bekk` | Scalar/diagonal BEKK(1,1) | `bekk_conditional_correlation`, `bekk_dynamics_parameters`, `bekk_diagnostics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `ccc` | `data` (required) | `--p`/`--q` (1, univariate-margin orders) |\n| `dcc` | `data` (required) | `--p`/`--q` (1), `--correction` (`none`: none\\|aielli) |\n| `bekk` | `data` (required) | `--kind` (`scalar`: scalar\\|diagonal) |\n\n# Examples\n\n```bash\nfriedman estimate regime setar :nile --column=1 --p=1 --d=1\nfriedman estimate regime star :nile --column=1 --p=1 --type=auto\nfriedman estimate regime ms-ar :gnp_hamilton --column=1 --p=2 --k-regimes=2\nfriedman estimate regime threshold thr.csv --dep=y --threshold-col=z --trim=0.15\nfriedman estimate volatility garch :nile --column=1 --p=1 --q=1\nfriedman estimate volatility egarch :nile --column=1 --dist=student\nfriedman estimate volatility garch-midas ret.csv --m-freq=22 --k=12 --rv=realized\nfriedman estimate volatility dcc retpanel.csv --p=1 --q=1 --correction=aielli\nfriedman estimate volatility sv :nile --column=1 --draws=5000\n```\n\n# See also\n\n* [Time-series and factor estimation](timeseries.md) - multivariate, univariate, and factor estimators\n* [Regression](regression.md) - cross-section and systems regression estimators\n* [Regression diagnostics](../test/diagnostics.md) - ARCH-LM, sign-bias, and Nyblom volatility diagnostics\n* [Linearity tests](../test/diagnostics.md) - Hansen and STAR linearity pre-tests for regime models", "estimate/regression": "# Summary\n\nThese 22 leaves cover single-equation regression (`reg`, `iv`, `qreg`, `rdd`), moment-based estimation (`gmm`, `smm`), equation systems (`sur`, `3sls`), penalized fits (`lasso`, `ridge`, `elastic-net`), robust and limited-dependent-variable models (`robust`, `tobit`, `truncreg`, `heckman`), model selection (`select`), cointegrating regression (`cointreg`), state-space models (`statespace`), non-Gaussian SVAR identification by ML (`ml`), and nonparametric fits (`kde`, `kernel-reg`, `lowess`). Every leaf takes a required `data` CSV plus `--output`/`-o`, `--format`/`-f` (`table|csv|json`), `--save-model`; TOML-config leaves add `--config`/`--config-json`/`--set`/`--strict`.\n\nConventions worth knowing: `--dep` names the dependent column (default: first numeric column) and remaining numeric columns are regressors \u2014 no intercept is prepended unless the CSV has a `const` column (systems leaves prepend one per equation unless `--no-intercept`). Coefficient tables follow the C051 tidy format (`term|estimate|std_error|stat|p_value|ci_lower|ci_upper`) with a separate fit-statistics table. `regression ml` is maximum-likelihood non-Gaussian SVAR identification, not machine learning.\n\nLEAVES open question (intermediates): `regression` is a CLI path segment only \u2014 no `##` header exists for it in the generated reference, so each `###` entry below is counted exactly once.\n\n# Functions\n\n## Linear, IV, and systems (6 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate regression reg` | OLS/WLS with HC/cluster/Conley covariances | `reg_coefficients`, `fit_statistics`, `conley_spatial_hac_settings` |\n| `friedman estimate regression iv` | k-class IV (2SLS/LIML/Fuller/k-class) | `iv_coefficients`, `iv_diagnostics` |\n| `friedman estimate regression gmm` | GMM with configurable weighting | `gmm_estimates`, `gmm_diagnostics` |\n| `friedman estimate regression smm` | Simulated method of moments | `smm_estimates` |\n| `friedman estimate regression sur` | Seemingly unrelated regressions (FGLS/MLE) | `sur_coefficients`, `sur_system_statistics` |\n| `friedman estimate regression 3sls` | Three-stage least squares systems | `3sls_coefficients`, `3sls_system_statistics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `reg` | `data` (required) | `--dep`, `- _impact_matrix_b0`, `model_fit`, `parameter_estimates_with_standard_errors` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `qreg` | `data` (required) | `--dep`, `--tau` (`0.5`, single or comma-list), `--se` (`iid`: iid\\|robust\\|boot), `--n-boot` (500), `--alpha` (0.05) |\n| `rdd` | `data` (required) | `--outcome`, `--running`, `--fuzzy` (fuzzy design), `--cutoff` (0.0), `--bandwidth`/`--bias-bandwidth` (0 = CCT auto), `--kernel` (`triangular`: triangular\\|epanechnikov\\|uniform), `--order` (1), `--level` (0.95) |\n| `select` | `data` (required) | `--dep`, `--method` (`bidirectional`: forward\\|backward\\|bidirectional\\|best-subset\\|gets), `--criterion` (`pvalue`: pvalue\\|aic\\|bic), `--p-enter` (0.05), `--p-remove` (0.1), `--keep` (forced regressors) |\n| `cointreg` | `data` (required) | `--dep`, `--method` (`fmols`: fmols\\|ccr\\|dols), `--trend` (`const`: none\\|const\\|linear), `--kernel` (`bartlett`: bartlett\\|parzen\\|qs\\|tukey-hanning), `--bandwidth` (`andrews`), `--leads`/`--lags` (`auto`), `--ic` (`aic`: aic\\|bic), `--dols-se` (`lrv`: lrv\\|robust) |\n| `statespace` | `data` (required) | `--column`/`-c` (1), `--model` (`local-level`: local-level\\|local-linear-trend), `--init-mode` (`kappa`: kappa\\|diffuse), `--kappa` (1e6), `--config` ([statespace] general-system TOML) |\n| `ml` | `data` (required) | `--lags`/`-p` (auto AIC), `--distribution`/`-d` (`student_t`: student_t\\|skew_t\\|ghd\\|mixture_normal\\|pml\\|skew_normal) |\n\n## Nonparametric (3 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate regression kde` | Kernel density estimation | `kernel_density_estimate`, `kernel_density_diagnostics` |\n| `friedman estimate regression kernel-reg` | Nadaraya-Watson/local-linear/local-poly | `kernel_regression_fit`, `kernel_regression_diagnostics` |\n| `friedman estimate regression lowess` | LOWESS with robustifying passes | `lowess_fit`, `lowess_diagnostics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `kde` | `data` (required) | `--column`/`-c` (1), `--kernel` (`gaussian`: gaussian\\|epanechnikov\\|triangular\\|uniform), `--bw` (`silverman`: silverman\\|sj\\|number), `--npoints` (512), `--cut` (3.0) |\n| `kernel-reg` | `data` (required) | `--dep`, `--indep` (required predictor), `--method` (`ll`: nw\\|ll\\|lp), `--degree` (1), `--bw` (`cv`: cv\\|rot\\|number), `--kernel` (`gaussian`) |\n| `lowess` | `data` (required) | `--dep`, `--indep` (required predictor), `--frac` (0.6667), `--iter` (3) |\n\n# Examples\n\n```bash\nfriedman estimate regression reg :stackloss --dep=stack.loss --cov-type=hc1\nfriedman estimate regression iv iv.csv --dep=y --endogenous=x_endog --instruments=z1,z2\nfriedman estimate regression qreg q.csv --dep=y --tau=0.25,0.5,0.75 --se=boot\nfriedman estimate regression lasso pen.csv --dep=y --lambda=auto --select=cv\nfriedman estimate regression heckman sel.csv --dep=wage --select=employed --outcome-vars=educ,exper --select-vars=educ,exper,kids --method=twostep\nfriedman estimate regression cointreg :denmark --dep=LRM --method=fmols --trend=const\nfriedman estimate regression kde :nile --column=1 --kernel=gaussian --bw=silverman\n```\n\n# See also\n\n* [Time-series and factor estimation](timeseries.md) - multivariate, univariate, and factor estimators\n* [Panel and discrete choice](panel-choice.md) - panel and choice estimators\n* [Regression diagnostics](../test/diagnostics.md) - White, influence, VIF, and Chow diagnostics for OLS fits\n* [IV diagnostics](../test/panel-var.md) - weak-instrument and Anderson-Rubin inference", "estimate/timeseries": "# Summary\n\nThese 20 leaves fit multivariate systems (VAR, BVAR, VECM, SVAR, SVEC, LP, TVP-VAR, MFVAR), univariate dynamics (ARIMA, SARIMA, ARFIMA, ARDL, NARDL, MIDAS), and factor structures (static, dynamic, GDFM, structural DFM, FastICA statistical identification). Every leaf takes a required `data` CSV path (a file or a bundled `:dataset` such as `:denmark`) and the shared flags `--output`/`-o`, `--format`/`-f` (`table|csv|json`), and `--save-model` (persist the fit to a `.jld2`/`.fmod` handle for `forecast`, `predict`, `irf`, `fevd`, `hd`); several leaves add `--plot`/`--plot-save`, and the TOML-config leaves add `--config`/`--config-json`/`--set`/`--strict`.\n\nLEAVES open question (intermediates): the generated reference contains no `##` section headers for this file \u2014 `multivariate`, `univariate`, and `factor` are CLI path segments only, not leaves, so each `###` entry below is counted exactly once. LEAVES open question (inventory): `INVENTORY.md` heads this command as \"~74\" but its prose enumerates all 76 `estimate` leaves (naming `sarima` twice); no leaf is missing or extra.\n\n# Functions\n\n## Multivariate systems (9 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate multivariate var` | OLS VAR(p); `--lags` omitted selects via AIC | `var_coefficients`, `information_criteria` |\n| `friedman estimate multivariate bvar` | Minnesota-prior BVAR with posterior sampling | `bvar_coefficients`, `minnesota_hyperparameters`, `information_criteria` |\n| `friedman estimate multivariate vecm` | Johansen or Engle-Granger VECM, auto rank | `cointegrating_vectors_beta`, `adjustment_coefficients_alpha`, `information_criteria` |\n| `friedman estimate multivariate svar` | AB-model SVAR, recursive to overidentified | `svar_a`, `svar_b`, `svar_summary` |\n| `friedman estimate multivariate svec` | Structural VECM with long/short-run zeros | `svec_b0`, `svec_xi`, `svec_summary` |\n| `friedman estimate multivariate lp` | Local projections, 6 methods incl. LP-IV | `lp_coefficients`, `lp_coefficients_expansion`, `lp_coefficients_recession`, `lp_estimation_summary`, `montiel_olea_pflueger_effective_f`, `lp_iv_anderson_rubin_bands` |\n| `friedman estimate multivariate tvpvar` | TVP-VAR with stochastic volatility (Primiceri 2005) | `tvp_var_stochastic_volatility_path_posterior_sd_68_band`, `tvp_var_specification` |\n| `friedman estimate multivariate mfvar` | Mixed-frequency VAR (Schorfheide-Song 2015) | `mf_var_latent_high_frequency_path_68_credible_band`, `mf_var_specification` |\n| `friedman estimate multivariate favar` | Two-step or Bayesian factor-augmented VAR | `favar_coefficients`, `bayesian_favar` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `var` | `data` (required) | `--lags`/`-p` (auto AIC), `--trend` (`constant`: none\\|constant\\|trend\\|both) |\n| `bvar` | `data` (required) | `--lags`/`-p` (4), `--prior` (`minnesota`), `--draws`/`-n` (2000), `--sampler` (`direct`\\|gibbs), `--method` (`mean`\\|median), `--hyperopt` (`glp`\\|grid), `--config` (prior hyperparameters) |\n| `vecm` | `data` (required) | `--lags`/`-p` (2, in levels), `--rank`/`-r` (`auto`), `--deterministic` (`constant`: none\\|constant\\|trend), `--method` (`johansen`\\|engle_granger), `--significance` (0.05) |\n| `svar` | `data` (required) | `--lags`/`-p` (auto AIC), `--pattern` (`recursive`: recursive\\|blanchard-quah\\|a-model\\|b-model\\|ab-model), `--config` ([svar] A/B matrices), `--n-starts` (5), `--max-iter` (400) |\n| `svec` | `data` (required) | `--lags`/`-p` (2), `--rank`/`-r` (`auto`), `--deterministic` (`constant`), `--method` (`johansen`\\|engle_granger), `--significance` (0.05), `--config` ([svec] zero matrices), `--n-starts` (5), `--max-iter` (400) |\n| `lp` | `data` (required) | `--method` (`standard`: standard\\|iv\\|smooth\\|state\\|propensity\\|robust), `--shock` (1), `--horizons` (20), `--control-lags` (4), `--vcov` (`newey_west`: newey_west\\|white\\|driscoll_kraay), method-gated `--instruments`, `--knots`, `--lambda`, `--state-var`, `--gamma`, `--transition`, `--treatment`, `--score-method`, `--mop-tau`, `--mop-bandwidth`, `--ar-level`, `--ar-grid`, `--ar-span`; flags `--mop-f`, `--ar-bands` |\n| `tvpvar` | `data` (required) | `--lags`/`-p` (2), `--draws`/`-n` (2000), `--burnin` (1000), `--thin` (1), `--n-train` (0), `--k-q` (0.01), `--k-s` (0.1), `--k-w` (0.01); flags `--no-tvp`, `--no-sv` |\n| `mfvar` | `data` (required, high-frequency CSV with blanks) | `--lags`/`-p` (2), `--low-freq` (auto gap detection), `--freq-ratio` (3), `--aggregation` (`growth`: stock\\|flow\\|average\\|growth), `--draws`/`-n` (1000), `--burnin` (500), `--prior` (`minnesota`\\|diffuse) |\n| `favar` | `data` (required) | `--factors`/`-r` (auto IC), `--lags`/`-p` (2), `--key-vars` (names/indices), `--method` (`two_step`\\|bayesian), `--draws`/`-n` (5000, bayesian) |\n\n## Univariate dynamics (6 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate univariate arima` | ARIMA with auto order selection | `arima_coefficients`, `information_criteria` |\n| `friedman estimate univariate sarima` | Seasonal ARIMA, explicit or auto orders | `sarima_coefficients`, `information_criteria` |\n| `friedman estimate univariate arfima` | Fractional integration, CSS or exact ML | `arfima_coefficients`, `arfima_diagnostics` |\n| `friedman estimate univariate ardl` | ARDL with long-run multipliers, PSS case | `ardl_coefficients`, `ardl_long_run_coefficients`, `ardl_diagnostics` |\n| `friedman estimate univariate nardl` | Asymmetric ARDL with cumulative multipliers | `nardl_coefficients`, `nardl_asymmetric_long_run_coefficients`, `nardl_diagnostics`, `nardl_cumulative_dynamic_multipliers`, `nardl_multipliers_summary` |\n| `friedman estimate univariate midas` | Mixed-frequency MIDAS, 5 weight schemes | `midas_weight_curve`, `midas_coefficients`, `midas_diagnostics` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `arima` | `data` (required) | `--column`/`-c` (1), `--p` (auto), `--d` (0), `--q` (0), `--max-p`/`--max-d`/`--max-q` (5/2/5), `--criterion` (`bic`: aic\\|bic), `--method`/`-m` (`css_mle`: ols\\|css\\|mle\\|css_mle) |\n| `sarima` | `data` (required) | `--column`/`-c` (1), `--p`/`--d`/`--q` (auto/0/0), `--P`/`--D`/`--Q` (0), `--s` (12), `--max-p`/`--max-q`/`--max-P`/`--max-Q` (2/2/1/1), `--criterion` (`aic`: aic\\|bic), `--method` (`css_mle`: css_mle\\|mle\\|css), `--max-iter` (500); flags `--auto`, `--no-intercept` |\n| `arfima` | `data` (required) | `--column`/`-c` (1), `--p` (0), `--q` (0), `--method`/`-m` (`css`: css\\|mle), `--d0` (GPH pre-estimate), `--max-iter` (500) |\n| `ardl` | `data` (required) | `--dep` (first numeric), `--p`/`--q` (`auto`), `--max-p`/`--max-q` (4), `--ic` (`aic`: aic\\|bic), `--case` (3, PSS 1..5), `--trend` (`none`: none\\|const\\|trend) |\n| `nardl` | `data` (required) | `--dep`, `--asymmetric` (`all` or 1-based indices), `--p`/`--q` (`auto`), `--max-p`/`--max-q` (4), `--ic` (`aic`: aic\\|bic), `--case` (3), `--horizon` (12), `--nreps` (500), `--level` (0.95); flags `--no-bootstrap`, `--plot` |\n| `midas` | `data` (required, low-frequency target CSV) | `--column` (1), `--hf-data` (required HF CSV), `--hf-column` (1), `--m` (required freq ratio), `--k` (required HF lags), `--weights` (`expalmon`: expalmon\\|beta2\\|beta3\\|almon\\|umidas), `--p-ar` (0), `--poly-degree` (2), `--horizon` (1), `--max-iter` (500) |\n\n## Factor models (5 leaves)\n\n| Command | Description | Output tables |\n|---|---|---|\n| `friedman estimate factor static` | Static PCA factors, IC auto-selection | `scree_data_eigenvalues_variance_shares`, `factor_loadings` |\n| `friedman estimate factor dynamic` | Dynamic factor model, two-step or EM | `dynamic_factor_loadings` |\n| `friedman estimate factor gdfm` | Generalized dynamic factor model (FHLR) | `gdfm_common_variance_shares` |\n| `friedman estimate factor sdfm` | Structural DFM with shock identification | `sdfm_estimation_summary` |\n| `friedman estimate factor fastica` | Statistical SVAR identification (ICA family) | `structural_impact_matrix_b0`, `structural_shocks` |\n\n| Leaf | Arguments | Key options (default) |\n|---|---|---|\n| `static` | `data` (required) | `--nfactors`/`-r` (auto IC), `--criterion` (`ic1`: ic1\\|ic2\\|ic3) |\n| `dynamic` | `data` (required) | `--nfactors`/`-r` (auto), `--factor-lags`/`-p` (1), `--method` (`twostep`: twostep\\|em) |\n| `gdfm` | `data` (required) | `--nfactors`/`-r` (auto), `--dynamic-rank`/`-q` (auto), `--spectral` (`lag-window`: lag-window\\|smoothed-periodogram) |\n| `sdfm` | `data` (required) | `--factors`/`-q` (auto), `--id` (`cholesky`: cholesky\\|sign\\|proxy\\|lewis-tvv\\|sv-em\\|gmm-moments), `--q-method` (`hallin-liska`: hallin-liska\\|bai-ng\\|amengual-watson), `--method` (`fglr`: fglr\\|gdfm-var), `--spectral` (`lag-window`), `--instrument`, `--var-lags` (1), `--horizon` (40), `--config`, `--bandwidth` (0=auto), `--kernel` (`bartlett`: bartlett\\|parzen\\|quadratic_spectral) |\n| `fastica` | `data` (required) | `--lags`/`-p` (auto AIC), `--method` (`fastica`: fastica\\|jade\\|sobi\\|dcov\\|hsic), `--contrast` (`logcosh`: logcosh\\|exp\\|kurtosis) |\n\n# Examples\n\n```bash\nfriedman estimate multivariate var :denmark\nfriedman estimate multivariate var :denmark --lags=2\nfriedman estimate multivariate bvar :denmark --lags=4 --draws=5000 --sampler=gibbs\nfriedman estimate multivariate vecm :denmark --lags=2 --rank=1 --deterministic=constant\nfriedman estimate multivariate lp :denmark --method=iv --shock=1 --horizons=20 --mop-f\nfriedman estimate univariate ardl ardl.csv --dep=y --p=1 --q=1 --case=3\nfriedman estimate univariate arima :nile --column=1 --p=1 --d=1 --q=1\nfriedman estimate univariate midas lf.csv --hf-data=hf.csv --m=3 --k=6 --weights=expalmon\nfriedman estimate factor static :denmark --nfactors=3\nfriedman estimate factor sdfm :denmark --factors=2 --id=cholesky --var-lags=1\n```\n\n# See also\n\n* [Regime-switching and volatility](regime-volatility.md) - nonlinear time-series and volatility estimators\n* [Regression](regression.md) - cross-section and systems regression estimators\n* [Panel and discrete choice](panel-choice.md) - panel and choice estimators\n* [Unit roots and long memory](../test/unit-root.md) - pre-estimation integration-order tests\n* [Impulse responses](../impulse/irf.md) - structural IRFs from fitted multivariate models", "forecast/filter-nowcast": "# Summary\n\nEleven leaves split series into trend and cycle or estimate the current quarter from mixed-frequency panels. The six `filter` leaves regress nothing: each splits every selected column into a trend (permanent) and cycle (transitory) component and reports the cycle variance ratio on stderr. `hp` penalizes second-difference curvature with \u03bb (6.25 annual, 1600 quarterly, 129600 monthly); `bhp` iteratively re-applies HP until a stopping criterion fires (Phillips\u2013Shi 2021), hardening the trend against breaks; `hamilton` defines the cycle as the residual of projecting yt on yt\u2212h\u2026yt\u2212h\u2212p+1 (first h+p\u22121 observations have no cycle value); `bn` splits into random-walk trend and stationary cycle analytically from an ARIMA fit or via state space; `bk` keeps oscillations with periods between `--pl` and `--pu` through a symmetric \u00b1K window (costing K observations at each end); `x13` runs X-13ARIMA-SEATS seasonal adjustment via a pure-Julia X-11/SEATS port (no external binary), emitting five tables and requiring at least 3\u00d7frequency observations. The five `nowcast` leaves estimate the current quarter from a monthly/quarterly panel: columns split via `--monthly-vars`/`--quarterly-vars` (omit both and all-but-last are monthly with the last as target; `--target-var 0` means last). `dfm` fits a dynamic factor model by EM, `bvar` a mixed-frequency BVAR (`conjugate` vs `litterman` log-likelihoods are not comparable \u2014 compare lags within a prior, priors out of sample), `bridge` runs bridge equations with separate `--lag-m`/`--lag-q`/`--lag-y` knobs, `news` attributes a nowcast revision to releases by comparing two same-shape vintages (`--data-new`/`--data-old`, no positional; newer fills cells, never adds rows), and `forecast` multi-steps a fitted DFM/BVAR model. Known gap: `--method=bridge` on `nowcast forecast` fails \u2014 upstream defines `forecast` only for DFM/BVAR models.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman filter hp` | Hodrick\u2013Prescott trend/cycle by time index | `hp_filter` (per-variable trend and cycle) |\n| `friedman filter bhp` | Boosted HP trend/cycle (Phillips & Shi 2021) | `boosted_hp_filter` |\n| `friedman filter hamilton` | Hamilton (2018) regression-filter trend/cycle over the valid range | `hamilton_filter` |\n| `friedman filter bn` | Beveridge\u2013Nelson permanent/transitory split | `beveridge_nelson_decomposition` |\n| `friedman filter bk` | Baxter\u2013King band-pass trend/cycle over the untrimmed range | `baxter_king_filter` |\n| `friedman filter x13` | X-13ARIMA-SEATS seasonal adjustment (X-11 / SEATS, pure Julia) | `x_13_seasonally_adjusted`; `x_13_trend`; `x_13_seasonal_factors`; `x_13_irregular`; `x_13_diagnostics` (ARIMA order, AIC, \u03c3\u00b2, outlier count, T) |\n| `friedman nowcast dfm` | DFM nowcast by EM (Banbura\u2013Giannone\u2013Reichlin) | `nowcast_dfm` (nowcast, forecast, log-likelihood, EM iterations) |\n| `friedman nowcast bvar` | Mixed-frequency BVAR nowcast | `nowcast_bvar` (nowcast, forecast, log-likelihood); `nowcast_bvar_hyperparameters` (optimized \u03bb, \u03b8, \u03bc, \u03b1, \u03b8\u00d7) |\n| `friedman nowcast bridge` | Bridge-equation nowcast | `nowcast_bridge` (nowcast, forecast, equation count) |\n| `friedman nowcast news` | News decomposition (Banbura & Modugno 2014) across two vintages | `nowcast_news_decomposition` (per-variable news impacts) |\n| `friedman nowcast forecast` | Multi-step forecast from a fitted DFM/BVAR nowcasting model (`bridge` fails: no upstream method) | `nowcast_forecast` (path by horizon, one column per variable) |\n\nFilter leaves share the `data` CSV positional plus `--columns`/`-c` (comma-separated indices; default all numeric), `--format`/`-f`, `--output`/`-o`, `--plot-save`, `--plot`, and `--result`/`--save-result` handles:\n\n| Option / Flag | Leaves | Default | Description |\n|---|---|---|---|\n| `--lambda` / `-l` | hp, bhp | `1600.0` | Smoothing parameter (6.25 annual, 1600 quarterly, 129600 monthly) |\n| `--stopping` | bhp | `BIC` | `BIC`, `ADF`, `fixed` |\n| `--max-iter` | bhp | `100` | Maximum boosting iterations |\n| `--sig-p` | bhp | `0.05` | ADF significance level (ADF stopping only) |\n| `--horizon` | hamilton | `8` | Forecast horizon h |\n| `--lags` / `-p` | hamilton | `4` | Lags p in the projection |\n| `--method` | bn (`arima\\|statespace`), x13 (`seats\\|x11`) | `arima` / `seats` | Decomposition method |\n| `--p` / `--q` | bn | auto | AR/MA orders (ARIMA method only) |\n| `--pl` / `--pu` / `--K` | bk | `6` / `32` / `12` | Min/max oscillation period; truncation half-length |\n| `--frequency` | x13 | `12` | Seasonal period: 4 (quarterly) or 12 (monthly) |\n| `--transform` | x13 | `auto` | Pre-transformation: `auto`, `log`, `none` (`log` for strictly-positive multiplicative seasonality) |\n| `--critical-value` | x13 | `0.0` | Outlier critical value (0 = automatic) |\n| `--outliers` | x13 | `true` | Detect AO/LS/TC outliers (`true`/`false`) |\n| `--trading-day` (flag) | x13 | off | Trading-day regressors |\n| `--easter` (flag) | x13 | off | Easter effect regressor |\n\nNowcast leaves share the panel split plus `--format`/`-f` and `--output`/`-o` (dfm/forecast/news also take `--plot-save`/`--plot`; bridge/bvar do not):\n\n| Option | Leaves | Default | Description |\n|---|---|---|---|\n| `data` (arg) | dfm, bvar, bridge, forecast | \u2014 | Path to CSV panel (news takes vintages instead) |\n| `--monthly-vars` | all 5 | `0` | Monthly variables (first N columns; omit with `--quarterly-vars` for all-but-last) |\n| `--quarterly-vars` | all 5 | `0` | Quarterly variables (remaining columns) |\n| `--target-var` | all 5 | `0` | Target variable index (0 = last) |\n| `--factors` / `-r` | dfm (2), forecast-DFM (2), news-DFM (2) | `2` | Number of factors |\n| `--lags` / `-p` | dfm (1), bvar (5), forecast (1), news (1) | \u2014 | Factor VAR lags / VAR lags |\n| `--idio` | dfm | `ar1` | Idiosyncratic component: `ar1`, `iid` |\n| `--max-iter` | dfm | `100` | Maximum EM iterations |\n| `--prior` | bvar | `conjugate` | `conjugate` (GLP dummy-observation NIW) or `litterman` (fixed-\u03a3) |\n| `--theta-cross` | bvar | \u2014 | Cross-variable tightness > 0 (litterman only; usage error with conjugate) |\n| `--lambda0` / `--theta0` / `--miu0` / `--alpha0` | bvar | `0.2` / `1.0` / `1.0` / `2.0` | Initial shrinkage \u03bb, lag-decay \u03b8, sum-of-coefficients \u03bc, co-persistence \u03b1 |\n| `--lag-m` / `--lag-q` / `--lag-y` | bridge | `1` / `1` / `1` | Monthly-indicator / quarterly-indicator / dependent-variable lags |\n| `--data-new` / `--data-old` | news | (required) | New / old vintage CSV (same shape; newer fills cells, never adds rows) |\n| `--method` | news (`dfm\\|bvar`), forecast (`dfm\\|bvar\\|bridge`) | `dfm` | Nowcasting model (`forecast --method=bridge` fails upstream) |\n| `--target-period` | news | `0` | Target period (0 = last) |\n| `--horizons` | forecast | `4` | Forecast horizon (no short flag: `-h` is help) |\n\n# Examples\n\n```bash\nfriedman filter hp :nile --lambda=1600\nfriedman filter hp :nile --columns=1 --lambda=6.25\nfriedman filter hamilton :nile --horizon=8 --lags=4\nfriedman filter bn :nile --p=2 --q=2\nfriedman filter bk :nile --pl=6 --pu=32 --K=12\nfriedman filter bhp :nile --lambda=1600 --stopping=BIC\nawk 'BEGIN{srand(7); print \"y\"; for(t=1;t<=120;t++) printf \"%.4f\\n\", 100+10*sin(2*3.14159265*t/12)+0.05*t+0.3*(rand()-0.5)*2}' > monthly.csv && friedman filter x13 monthly.csv --frequency=12 --method=x11 --transform=none\nfriedman nowcast dfm :fred_md --factors=3 --lags=2\nfriedman nowcast bvar :fred_md --lags=5\nfriedman nowcast bvar :fred_md --prior=litterman --theta-cross=0.5\nfriedman nowcast bridge :fred_md --lag-m=2 --lag-q=1 --lag-y=1\nfriedman nowcast forecast :fred_md --method=dfm --horizons=4\n```\n\n# See also\n\n* [Forecasting and Forecast Evaluation](forecast.md) - out-of-sample projections; `forecast evaluate` scores saved nowcast paths\n* [Correlograms and Spectral Density](../spectral-filter/spectral-density.md) - ACF/periodogram/density diagnostics for filtered series\n* [Cross-Spectra and Transfer Functions](../spectral-filter/spectral-cross.md) - theoretical gain/phase of the HP, BK, and Hamilton filters", "forecast/forecast": "# Summary\n\nThirty-five leaves project fitted models forward. Twenty-nine model leaves re-estimate on the `data` CSV (or reuse a `--model` handle) and forecast: multivariate VAR/BVAR/FAVAR/LP/scenario/VECM, factor static/dynamic/GDFM/SDFM, regime MS/MS-AR/SETAR/STAR, univariate ARFIMA/ARIMA/MIDAS/SARIMA, and eleven volatility leaves (ARCH/GARCH/EGARCH/GJR-GARCH/SV plus APARCH/CGARCH/FIGARCH/FIEGARCH/IGARCH/GARCH-MIDAS). Most render the tidy `horizon | variable | value | lower | upper` table (`lower`/`upper` are missing when no interval ships); three deliberate exceptions keep information the generic schema would drop \u2014 ARFIMA uses the single-series `horizon | forecast | lower | upper` form, MIDAS adds a standard error plus a summary table, and volatility leaves use `horizon | variance | volatility` (GARCH-MIDAS splits into `total_variance | long_run | short_run | volatility`). Six `forecast evaluate` leaves score already-computed forecasts model-agnostically: `data` carries the realized column named by `--actual`, forecasts arrive as `--forecasts` columns or `--result` handle stems (never both), and each leaf validates its forecast-count arity. `scenario` is the Waggoner\u2013Zha conditional forecast: a `--conditions-file` long CSV (`variable,period,value[,sd]`) pins paths \u2014 `sd` 0/absent is hard, positive is soft \u2014 and the leaf reports the conditioned path beside its `unconditional` baseline plus the implied structural shocks; check the shocks before believing the path. Note the reserved-name trap: `--conditions` is a pre-dispatch global (GPL notice), so the leaf spells it `--conditions-file`. SETAR/STAR forecast leaves offer no `--plot`/`--plot-save` (no upstream plot recipe for the forecast type).\n\n# Functions\n\nEvaluate leaves (model-agnostic; arity in parentheses):\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman forecast evaluate metrics` | Point accuracy per forecast (\u22651): ME, MAE, RMSE, MAPE, sMAPE, MASE, Theil U1/U2 + Theil MSE bias/variance/covariance split; only evaluate leaf with plot flags | `forecast_accuracy_metrics` (one row per forecast); `theil_mse_decomposition` |\n| `friedman forecast evaluate dm` | Diebold\u2013Mariano (1995) equal-accuracy test (exactly 2); `d = g(e1) \u2212 g(e2)`, positive favors fc2; HLN correction on by default (`t_{T\u22121}`); invalid for nested models | `diebold_mariano_test` (statistic, p-value, mean differential, lrvar, HLN, n) |\n| `friedman forecast evaluate clark-west` | Clark\u2013West (2007) adjusted-MSPE test for nested models (exactly 2, ordered small then big); one-sided `greater` vs N(0,1) | `clark_west_test` |\n| `friedman forecast evaluate mincer-zarnowitz` | Efficiency regression `actual = a + b\u00b7fc` (exactly 1); joint test of (a,b)=(0,1) via \u03c7\u00b2(2) Wald and F(2,T\u22122) | `mincer_zarnowitz_efficiency_test` |\n| `friedman forecast evaluate encompassing` | HLN (1998) encompassing test (exactly 2): `b2 = 0` in `actual = a + b1\u00b7fc1 + b2\u00b7fc2`; non-rejection means fc1 encompasses fc2 | `forecast_encompassing_test` |\n| `friedman forecast evaluate combine` | Blend \u22652 forecasts: `equal`, `bates-granger` (inverse-MSE), `granger-ramanathan` (constrained LS; weights may be negative) | `forecast_combination_weights` (`model \\| weight \\| mse`, weights sum to 1); `combined_forecast_series` (`--emit-series`) |\n\nModel leaves:\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman forecast multivariate var` | VAR forecasts; auto lags unless `--lags`; analytical or bootstrap intervals | `var_forecast` (tidy) |\n| `friedman forecast multivariate bvar` | BVAR forecasts with posterior credible bands; `--sampler direct\\|gibbs`, TOML `--config` prior | `bvar_forecast` (tidy; 68% bands) |\n| `friedman forecast multivariate favar` | FAVAR forecasts; `--panel-forecast` switches factor-level to panel-wide output | `favar_forecast` (tidy) |\n| `friedman forecast multivariate lp` | Direct LP forecasts along a `--shock-size` impulse to variable `--shock` | `lp_forecast` (tidy) |\n| `friedman forecast multivariate scenario` | Waggoner\u2013Zha conditional forecast under `--method var\\|bvar` | `conditional_forecast` (+ `unconditional` baseline); `implied_structural_shocks`; `scenario_settings` |\n| `friedman forecast multivariate vecm` | VECM level forecasts; `--rank auto` via Johansen; intervals off by default | `vecm_forecast` (tidy) |\n| `friedman forecast factor static` | PCA static-factor forecasts reconstructed to observables | `static_factor_forecast` (tidy) |\n| `friedman forecast factor dynamic` | Dynamic-factor forecasts; factors follow a VAR(`--factor-lags`) | `dynamic_factor_forecast` (tidy) |\n| `friedman forecast factor gdfm` | GDFM forecasts; `--method ar\\|one-sided\\|spectral` projection | `gdfm_forecast` (tidy) |\n| `friedman forecast factor sdfm` | Structural-DFM panel forecasts; `--id` identification, `--q-method` auto rank | `sdfm_forecast` (tidy) |\n| `friedman forecast regime ms` | MS-regression forecasts averaged over `--reps` simulated regime paths (+ predicted regime probabilities); `--x-future` required unless intercept-only | `ms_regression_forecast` (tidy); `ms_regression_predicted_regime_probabilities` |\n| `friedman forecast regime ms-ar` | MS-AR forecasts over simulated regime paths (+ predicted regime probabilities); Hamilton constant-variance default | `ms_ar_forecast` (tidy); `ms_ar_predicted_regime_probabilities` |\n| `friedman forecast regime setar` | SETAR bootstrap-simulation forecasts; `--d` integer or `auto`; `--ci-level` must be 0.90/0.95/0.99; no plot flags | `setar_forecast` (tidy) |\n| `friedman forecast regime star` | Self-exciting STAR bootstrap-simulation forecasts (`--type lstr1\\|lstr2\\|estr\\|auto`); no plot flags | `star_forecast` (tidy) |\n| `friedman forecast univariate arfima` | ARFIMA forecasts; `--method css\\|mle`; AR(\u221e) truncation `--trunc-lag` | `arfima_forecast` (`horizon \\| forecast \\| lower \\| upper`) |\n| `friedman forecast univariate arima` | ARIMA forecasts; omit `--p` for auto selection bounded by `--max-p`/`--max-d`/`--max-q` under `--criterion` | `arima_forecast` (tidy) |\n| `friedman forecast univariate midas` | Direct h-step ADL-MIDAS forecast of the low-frequency target; `--hf-data`/`--m`/`--k` required | `midas_forecast` (+ `se`); `midas_forecast_summary` |\n| `friedman forecast univariate sarima` | SARIMA forecasts; `--auto` forces `auto_sarima`; seasonal bounds `--max-P`/`--max-Q` | `sarima_forecast` (tidy) |\n| `friedman forecast volatility arch` | ARCH variance path (Gaussian-only; no `--dist`) | `arch_volatility_forecast` (`horizon \\| variance \\| volatility`) |\n| `friedman forecast volatility garch` | GARCH variance path; `--dist normal\\|student\\|ged` | `garch_volatility_forecast` |\n| `friedman forecast volatility egarch` | EGARCH variance path; `--dist` | `egarch_volatility_forecast` |\n| `friedman forecast volatility gjr-garch` | GJR-GARCH variance path; `--dist` | `gjr_garch_volatility_forecast` |\n| `friedman forecast volatility sv` | SV variance path; `--draws` MCMC (Gaussian-only) | `sv_volatility_forecast` |\n| `friedman forecast volatility aparch` | APARCH variance path; optional `--fix-delta`/`--fix-gamma` | `aparch_volatility_forecast` |\n| `friedman forecast volatility cgarch` | Component-GARCH variance path | `cgarch_volatility_forecast` |\n| `friedman forecast volatility figarch` | FIGARCH variance path; `--d0`, `--truncation`, `--dist` | `figarch_volatility_forecast` |\n| `friedman forecast volatility fiegarch` | FIEGARCH variance path; `--d0`, `--truncation`, `--dist` | `fiegarch_volatility_forecast` |\n| `friedman forecast volatility igarch` | IGARCH variance path | `igarch_volatility_forecast` |\n| `friedman forecast volatility garch-midas` | GARCH-MIDAS variance path split into long/short-run; `--m-freq` required; no interval level or plot flags | `garch_midas_volatility_forecast` (`total_variance \\| long_run \\| short_run \\| volatility`) |\n\nEvery leaf takes the `data` CSV positional. Evaluate leaves share `--actual` (required), `--forecasts`, `--result` (comma-separated handle stems), `--format`/`-f`, `--output`/`-o`:\n\n| Option / Flag | Evaluate leaves | Default | Description |\n|---|---|---|---|\n| `--horizon` | clark-west, dm | `1` | Forecast horizon (sets truncation lag h\u22121) |\n| `--alternative` | clark-west | `greater` | `two-sided`, `less`, `greater` |\n| `--alternative` | dm | `two-sided` | `two-sided`, `less`, `greater` |\n| `--loss` | dm | `se` | `se` (squared), `ad` (absolute) |\n| `--no-hln` (flag) | dm | off | Disable HLN correction (use N(0,1)) |\n| `--lags` | mincer-zarnowitz, encompassing | `0` | Newey\u2013West HAC lag (0 = White) |\n| `--kernel` | mincer-zarnowitz, encompassing | `bartlett` | `bartlett`, `parzen`, `quadratic_spectral`, `tukey_hanning` |\n| `--method` | combine | `equal` | `equal`, `bates-granger`, `granger-ramanathan` |\n| `--emit-series` (flag) | combine | off | Also emit the combined series |\n| `--seasonal-period` | metrics | `1` | Seasonal lag for MASE naive scaling |\n| `--plot` / `--plot-save` | metrics only | off | Display / save interactive plot |\n\nModel-leaf options (all 29 also take `--output`/`-o`, `--format`/`-f`, `--model` to skip re-estimation, `--result`/`--save-result` handles; all but setar/star/garch-midas/ms/ms-ar take `--plot`/`--plot-save`):\n\n| Option / Flag | Leaves | Default | Description |\n|---|---|---|---|\n| `--horizons` | all model leaves | `12` (vol extended: `10`) | Forecast horizon (short `-H` on arfima/aparch/cgarch/figarch/fiegarch/igarch/garch-midas) |\n| `--lags` / `-p` | var (auto), bvar (4), favar (2), lp (4), vecm levels (2), scenario (auto/4) | \u2014 | Lag orders |\n| `--draws` / `-n` | bvar (2000), scenario-bvar (2000), sv (5000) | \u2014 | MCMC draws |\n| `--sampler` | bvar, scenario-bvar | `direct` | `direct`, `gibbs` |\n| `--config` (+ `--config-json`, `--set`, `--strict`) | bvar, scenario, sdfm, garch-midas | \u2014 | TOML config (BVAR prior / sign restrictions / garch_midas x_lf) |\n| `--confidence` | var, vecm, scenario, arfima, arima | `0.95` | Interval level |\n| `--conf-level` | static, lp, aparch, cgarch, figarch, fiegarch, igarch | `0.95` | Interval level |\n| `--ci-level` | sarima, setar, star | `0.95` | Band coverage (setar/star: exactly 0.90/0.95/0.99) |\n| `--ci-method` | var (analytical\\|bootstrap), vecm (none\\|bootstrap\\|parametric), static (none\\|bootstrap\\|parametric), lp (analytical\\|bootstrap\\|none), sdfm (`--ci` none\\|bootstrap) | \u2014 | Interval method |\n| `--conditions-file` | scenario | (required) | Long CSV `variable,period,value[,sd]` |\n| `--method` | scenario (`var\\|bvar`), dynamic (`twostep\\|em`), gdfm (`ar\\|one-sided\\|spectral`), lp vcov \u2014 no; arfima (`css\\|mle`), arima (`ols\\|css\\|mle\\|css_mle`), sarima (`css_mle\\|mle\\|css`) | \u2014 | Estimator/projection selectors |\n| `--replications` | scenario (1000), vecm (500), sdfm `--reps` (200) | \u2014 | Simulation/bootstrap draws for bands |\n| `--shock` / `--shock-size` | lp | `1` / `1.0` | Shocked variable index; impulse size |\n| `--vcov` | lp | `newey_west` | `newey_west`, `white`, `driscoll_kraay` |\n| `--n-boot` | lp | `500` | Bootstrap replications |\n| `--rank` / `-r` | vecm | `auto` | Cointegration rank |\n| `--deterministic` | vecm | `constant` | `none`, `constant`, `trend` |\n| `--nfactors` / `-r` | static, dynamic, gdfm | auto | Factor counts |\n| `--factor-lags` / `-p` | dynamic | `1` | Factor VAR lag order |\n| `--dynamic-rank` / `-q` | gdfm | auto | Dynamic rank |\n| `--spectral` | gdfm, sdfm | `lag-window` | `lag-window` (FHLR), `smoothed-periodogram` |\n| `--factors` / `-q/-r` | sdfm (`-q`), favar (`-r`) | auto | Dynamic factors / factor count |\n| `--id` | sdfm | `cholesky` | `cholesky`, `sign`, `proxy`, `lewis-tvv`, `sv-em`, `gmm-moments` (proxy needs `--instrument`) |\n| `--q-method` | sdfm | `hallin-liska` | `hallin-liska`, `bai-ng`, `amengual-watson` |\n| `--instrument` | sdfm | \u2014 | Proxy-instrument CSV column (with `--id proxy`) |\n| `--var-lags` | sdfm | `1` | Factor VAR lag order |\n| `--key-vars` | favar | \u2014 | Key variable names or indices |\n| `--panel-forecast` (flag) | favar | off | Panel-wide instead of factor-level output |\n| `--dep` | ms | first numeric | Dependent variable column |\n| `--k-regimes` | ms, ms-ar | `2` | Number of regimes (\u2265 2) |\n| `--max-iter` | ms (500), ms-ar (1000), arfima (500), sarima (500), midas (500) | \u2014 | EM/optimizer iterations |\n| `--tol` | ms | `1e-8` | EM convergence tolerance |\n| `--x-future` | ms | \u2014 | CSV of future regressors, h\u00d7k (required unless intercept-only) |\n| `--reps` | ms, ms-ar, setar, star | `1000` | Simulated regime paths / bootstrap paths |\n| `--ci-level` (ms/ms-ar) | ms, ms-ar | `0.9` | Band coverage in (0,1) |\n| `--no-switching-variance` (flag) | ms | off | Force common \u03c3\u00b2 (default: \u03c3\u00b2 switches) |\n| `--switching-variance` (flag) | ms-ar | off | Let \u03c3\u00b2 switch (default: Hamilton constant-variance form) |\n| `--column` / `-c` | ms-ar, setar, star, arfima, arima, midas, sarima, all volatility | `1` | Series column index |\n| `--p` | ms-ar, setar, star, arfima (0), arima (auto), sarima (auto), garch-family (1) | \u2014 | AR/GARCH orders |\n| `--d` | setar (`1`, String: int or `auto`), star (`1`), arfima \u2014 no; arima (`0`), sarima (`0` + `--D`/`--P`/`--Q`/`--s` 12) | \u2014 | Delay lag / differencing / seasonal orders |\n| `--type` | star | `auto` | `lstr1`, `lstr2`, `estr`, `auto` |\n| `--d0` | arfima (GPH), figarch/fiegarch (0.4) | \u2014 | Fractional-d starting value |\n| `--trunc-lag` | arfima | `200` | AR(\u221e) truncation lag |\n| `--max-p`/`--max-d`/`--max-q` + `--criterion` | arima | `5`/`2`/`5`, `bic` | Auto-selection bounds and `aic\\|bic` |\n| `--max-p`/`--max-q`/`--max-P`/`--max-Q` + `--criterion` | sarima | `2`/`2`/`1`/`1`, `aic` | Auto-selection bounds and criterion |\n| `--auto` (flag) | sarima | off | Force `auto_sarima` |\n| `--no-intercept` (flag) | sarima | off | Exclude intercept |\n| `--hf-data` / `--hf-column` / `--m` / `--k` | midas | required/`1`/required/required | HF indicator CSV, HF column, HF-per-LF ratio, HF lags |\n| `--weights` | midas | `expalmon` | `expalmon`, `beta2`, `beta3`, `almon`, `umidas` |\n| `--p-ar` / `--poly-degree` / `--horizon` / `--level` | midas | `0` / `2` / `1` / `0.95` | ADL lags, Almon degree, direct horizon, interval level |\n| `--q` | arima/auto, vol arch (1), garch-family (1) | \u2014 | MA/ARCH orders |\n| `--dist` | egarch, garch, gjr-garch (`normal\\|student\\|ged`), figarch, fiegarch (`normal`) | `normal` | Conditional innovation distribution |\n| `--fix-delta` / `--fix-gamma` | aparch | \u2014 | Fix power/asymmetry parameters |\n| `--d0` / `--truncation` | figarch, fiegarch | `0.4` / `1000` | Fractional-d start; ARCH(\u221e) truncation |\n| `--m-freq` / `--k` / `--rv` / `--span` | garch-midas | required/`12`/`realized`/`fixed` | HF-per-LF block, MIDAS lags, `realized\\|macro` driver, `fixed\\|rolling` span |\n| `--strict` (flag) | bvar, scenario, sdfm, garch-midas | off | Config schema warnings become errors (exit 4) |\n\n# Examples\n\n```bash\nfriedman forecast multivariate var :denmark --horizons 6\nfriedman forecast multivariate bvar :denmark --horizons 6 --draws 500 --sampler gibbs\nfriedman forecast multivariate vecm :denmark --rank 1 --deterministic constant --lags 2\ncat > scenario.csv <<'EOF'\nvariable,period,value,sd\nLRM,1,0.5,0\nLRM,2,0.4,0\nLRY,4,0.3,0.5\nEOF\nfriedman forecast multivariate scenario :denmark --conditions-file scenario.csv --horizons 6\nfriedman forecast univariate arima :nile --p 1 --d 1 --q 1 --horizons 6\nfriedman forecast regime setar :gnp_hamilton --p 1 --d 1 --horizons 6\nfriedman forecast volatility garch returns.csv --column 2 --p 1 --q 1 --horizons 6\nfriedman forecast volatility sv returns.csv --column 2 --draws 500 --horizons 6\ncat > eval.csv <<'EOF'\ny,f1,f2,f3\n2.10,2.00,2.20,2.05\n1.80,1.90,1.70,1.85\n2.40,2.30,2.50,2.35\nEOF\nfriedman forecast evaluate metrics eval.csv --actual y --forecasts f1,f2,f3\nfriedman forecast evaluate dm eval.csv --actual y --forecasts f1,f2 --loss se --horizon 1\nfriedman forecast evaluate clark-west eval.csv --actual y --forecasts f1,f2\nfriedman forecast evaluate combine eval.csv --actual y --forecasts f1,f2,f3 --method bates-granger\n```\n\n# See also\n\n* [In-Sample Fitted Values](predict.md) - fitted values from the same model families\n* [Model Residuals](residuals.md) - residuals completing the fit\u2013diagnose loop\n* [Trend-Cycle Filters and Nowcasting](filter-nowcast.md) - filters and mixed-frequency nowcasts\n* [Policy Counterfactuals and Optimal Policy](../causal-policy/policy-counterfactual.md) - McKay\u2013Wolf rule counterfactuals as the structural scenario parallel", "forecast/predict": "# Summary\n\nThirty-eight leaves return what a fitted model implies for the estimation sample \u2014 conditional means, conditional variances, state paths, or per-category probabilities \u2014 completing the fit\u2013diagnose loop (`estimate` fits, `predict` implies, `residuals` leaves unexplained). Every leaf re-estimates from the `data` CSV or reuses a `--model` handle (pass stems without suffix: `--model var`, never `--model var.jld2`); stdout carries data only, diagnostics go to stderr. Implementation shape (LEAVES.md open question 5, confirmed in `src/commands/fitted.jl`): a 23-entry `FITTED_MODEL_KINDS` table (var, bvar, arima, vecm, static, dynamic, gdfm, arch, garch, egarch, gjr-garch, sv, favar, reg, logit, probit, preg, piv, plogit, pprobit, ologit, oprobit, mlogit) is expanded by `_specs_for_verb` into both verbs \u2014 23 of the 38 predict leaves \u2014 while 15 leaves carry hand-written specs because their option sets diverge from the loop (sarima, poisson, nbreg, ms-ar, ms, statespace, sur, 3sls, arfima, plus the six extended-GARCH variants igarch/cgarch/aparch/figarch/fiegarch/garch-midas, which are not in the shared volatility table). The generated reference groups leaves under family intermediates (`choice`, `factor`, `multivariate`, `panel`, `regime`, `regression`, `univariate`, `volatility`) for display; each `###` leaf below is covered exactly once. Asymmetries to note: `predict` exists for the Markov-switching models only (`ms`, `ms-ar`) \u2014 SETAR/STAR have `residuals` leaves but no `predict` leaf because upstream exposes no fitted values for `ThresholdModel`/`STARModel`; the plain volatility leaves refit at Gaussian-QMLE defaults with no `--dist` option; `--marginal-effects`/`--odds-ratio`/`--classification-table` on binary choice are bare mutually-exclusive flags that replace the fitted-values output.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman predict choice logit` | Binary logit fitted probabilities + optional AMEs / odds ratios / classification | `logit_fitted_probabilities`; `average_marginal_effects_logit` (`--marginal-effects`); `odds_ratios_logit` (`--odds-ratio`); `classification_metrics` + `confusion_matrix` (`--classification-table`, at `--threshold`) |\n| `friedman predict choice probit` | Binary probit fitted probabilities + optional AMEs / classification (no odds ratios) | `probit_fitted_probabilities`; `average_marginal_effects_probit`; `classification_metrics`; `confusion_matrix` |\n| `friedman predict choice ologit` | Ordered-logit per-category probabilities (+ per-category AMEs) | `ordered_logit_predicted_probabilities` (`prob_<cat>` per row); `ordered_logit_average_marginal_effects` (`--marginal-effects`; delta-method SEs, no z/p) |\n| `friedman predict choice oprobit` | Ordered-probit per-category probabilities (+ per-category AMEs) | `ordered_probit_predicted_probabilities`; `ordered_probit_average_marginal_effects` |\n| `friedman predict choice mlogit` | Multinomial-logit per-alternative probabilities (+ per-alternative AMEs) | `multinomial_logit_predicted_probabilities`; `multinomial_logit_average_marginal_effects` |\n| `friedman predict choice poisson` | Poisson conditional means exp(x'\u03b2 + offset) | `poisson_conditional_means` (`observation \\| fitted`) |\n| `friedman predict choice nbreg` | Negative-binomial conditional means | `negative_binomial_conditional_means` |\n| `friedman predict factor static` | Static-factor common component, one column per series | `static_factor_common_component` |\n| `friedman predict factor dynamic` | Dynamic-factor common component | `dynamic_factor_common_component` |\n| `friedman predict factor gdfm` | GDFM common component | `gdfm_common_component` |\n| `friedman predict multivariate var` | VAR fitted values (auto lags when omitted) | `var_predictions` (one column per variable) |\n| `friedman predict multivariate bvar` | BVAR fitted values at the posterior mean | `bvar_predictions` |\n| `friedman predict multivariate vecm` | VECM fitted values via the VAR representation | `vecm_predictions` |\n| `friedman predict multivariate favar` | FAVAR fitted values | `favar_predictions` (factors + observed variables) |\n| `friedman predict panel preg` | Panel regression fitted values (default `--method fe`) | `panel_regression_fitted_values` |\n| `friedman predict panel piv` | Panel IV (2SLS) fitted values; `--endog` hard-required | `panel_iv_fitted_values` |\n| `friedman predict panel plogit` | Panel logit fitted probabilities (default `--method pooled`) | `panel_logit_fitted_probabilities` |\n| `friedman predict panel pprobit` | Panel probit fitted probabilities (default `--method pooled`; no FE
