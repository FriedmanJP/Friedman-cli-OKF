<head>
<meta charset="utf-8">
<!-- FriedmanJP/Friedman-cli-OKF: viewport for narrow screens. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
/* FriedmanJP/Friedman-cli-OKF: this bundle uses status "approved". */
.badge.status-approved { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

/* FriedmanJP/Friedman-cli-OKF: stack panes on narrow screens. */
@media (max-width: 900px) {
  body { height: auto; }
  header { flex-wrap: wrap; gap: 8px; }
  .controls { flex-wrap: wrap; }
  .controls input { width: 100%; }
  main { flex-direction: column; }
  #graph { flex: none; height: 46vh; border-right: none; border-bottom: 1px solid #e2e8f0; }
  #detail { flex: none; overflow-y: visible; }
}

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search titles, tags, bodies">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <!-- FriedmanJP/Friedman-cli-OKF: domain filter. -->
    <select id="filter-domain">
      <option value="">All domains</option>
    </select>
    <select id="layout">
      <option value="concentric" selected>concentric</option>
      <option value="cose">cose (force)</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
        <!-- FriedmanJP/Friedman-cli-OKF: view-source row. -->
        <dt id="detail-source-dt" hidden>Source</dt><dd id="detail-source-dd" hidden><a id="detail-source" target="_blank" rel="noopener">View concept file</a></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

"id": "overview__spectral-filter/spectral-density", "source": "overview", "target": "spectral-filter/spectral-density"}}, {"data": {"id": "overview__spectral-filter/spectral-cross", "source": "overview", "target": "spectral-filter/spectral-cross"}}, {"data": {"id": "overview__infra/model-handles", "source": "overview", "target": "infra/model-handles"}}, {"data": {"id": "overview__infra/serve-show", "source": "overview", "target": "infra/serve-show"}}, {"data": {"id": "overview__infra/repl-completions", "source": "overview", "target": "infra/repl-completions"}}, {"data": {"id": "overview__configuration/config-files", "source": "overview", "target": "configuration/config-files"}}, {"data": {"id": "overview__configuration/output-envelope", "source": "overview", "target": "configuration/output-envelope"}}, {"data": {"id": "overview__configuration/cli-engine", "source": "overview", "target": "configuration/cli-engine"}}, {"data": {"id": "overview__installation-architecture/installation", "source": "overview", "target": "installation-architecture/installation"}}, {"data": {"id": "overview__installation-architecture/architecture", "source": "overview", "target": "installation-architecture/architecture"}}, {"data": {"id": "overview__installation-architecture/testing", "source": "overview", "target": "installation-architecture/testing"}}, {"data": {"id": "spectral-filter/spectral-cross__spectral-filter/spectral-density", "source": "spectral-filter/spectral-cross", "target": "spectral-filter/spectral-density"}}, {"data": {"id": "spectral-filter/spectral-cross__forecast/filter-nowcast", "source": "spectral-filter/spectral-cross", "target": "forecast/filter-nowcast"}}, {"data": {"id": "spectral-filter/spectral-density__spectral-filter/spectral-cross", "source": "spectral-filter/spectral-density", "target": "spectral-filter/spectral-cross"}}, {"data": {"id": "spectral-filter/spectral-density__forecast/filter-nowcast", "source": "spectral-filter/spectral-density", "target": "forecast/filter-nowcast"}}, {"data": {"id": "test/cointegration__test/unit-root", "source": "test/cointegration", "target": "test/unit-root"}}, {"data": {"id": "test/cointegration__test/diagnostics", "source": "test/cointegration", "target": "test/diagnostics"}}, {"data": {"id": "test/cointegration__estimate/timeseries", "source": "test/cointegration", "target": "estimate/timeseries"}}, {"data": {"id": "test/diagnostics__test/panel-var", "source": "test/diagnostics", "target": "test/panel-var"}}, {"data": {"id": "test/diagnostics__test/cointegration", "source": "test/diagnostics", "target": "test/cointegration"}}, {"data": {"id": "test/diagnostics__estimate/regression", "source": "test/diagnostics", "target": "estimate/regression"}}, {"data": {"id": "test/diagnostics__estimate/regime-volatility", "source": "test/diagnostics", "target": "estimate/regime-volatility"}}, {"data": {"id": "test/panel-var__test/unit-root", "source": "test/panel-var", "target": "test/unit-root"}}, {"data": {"id": "test/panel-var__test/diagnostics", "source": "test/panel-var", "target": "test/diagnostics"}}, {"data": {"id": "test/panel-var__estimate/panel-choice", "source": "test/panel-var", "target": "estimate/panel-choice"}}, {"data": {"id": "test/panel-var__estimate/timeseries", "source": "test/panel-var", "target": "estimate/timeseries"}}, {"data": {"id": "test/unit-root__test/cointegration", "source": "test/unit-root", "target": "test/cointegration"}}, {"data": {"id": "test/unit-root__test/diagnostics", "source": "test/unit-root", "target": "test/diagnostics"}}, {"data": {"id": "test/unit-root__estimate/timeseries", "source": "test/unit-root", "target": "estimate/timeseries"}}], "bodies": {"causal-policy/did": "# Summary\n\nThree leaves estimate treatment effects from a staggered-adoption panel CSV (positional `data`; `--id-col`/`--time-col` default to the first/second columns; `--outcome` and `--treatment` are required). `did estimate` reports the average treatment effect on the treated (ATT) by event time under two-way fixed effects by default, with heterogeneity-robust alternatives `--method cs` (Callaway\u2013Sant'Anna), `sa` (Sun\u2013Abraham), `bjs` (Borusyak\u2013Jaravel\u2013Spiess imputation), and `dcdh` (de Chaisemartin\u2013D'Haultfoeuille). `did event-study` runs a local-projection event study whose pre-treatment leads test parallel trends and whose lags trace the dynamic response. `did lp-did` implements the Dube\u2013Girardi\u2013Jorda\u2013Taylor LP-DiD estimator with clean-comparison, reweighting, and matching machinery. The four `test did` diagnostics (Bacon decomposition, pretrend, negative weights, HonestDiD) are separate leaves owned by the test domain, spelled `friedman test did \u2026`.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman did estimate` | ATT by event time; `--method twfe` (default), `cs`, `sa`, `bjs`, `dcdh` | `did_estimation` (ATT, SE, CI by event time); `group_time_att_callaway_sant_anna` (cohort-by-event-time ATT matrix, CS only) |\n| `friedman did event-study` | LP event study: leads test parallel trends, lags trace dynamics | `event_study_lp` (coefficient, SE, CI by event time) |\n| `friedman did lp-did` | LP-DiD with clean comparisons, reweighting, matching | `lp_did_dube_et_al_2023` (coefficient, SE, CI, N by event time); pooled pre/post effects on stderr unless `--only-pooled`/`--only-event` |\n\nAll three leaves take one argument and share the display/export surface:\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `data` | String | yes | Path to panel CSV data file |\n\n| Option / Flag | Leaves | Default | Description |\n|---|---|---|---|\n| `--outcome` | all | (required) | Outcome variable column name |\n| `--treatment` | all | (required) | Treatment indicator column name |\n| `--id-col` | all | first column | Panel unit ID column |\n| `--time-col` | all | second column | Time column |\n| `--covariates` | all | \u2014 | Comma-separated covariate column names |\n| `--cluster` | all | `unit` | `unit`, `time`, `twoway` |\n| `--conf-level` | all | `0.95` | Confidence level |\n| `--output` / `-o`, `--format` / `-f` | all | `table` | Export path; `table`, `csv`, `json` |\n| `--plot-save` | all | \u2014 | Save plot to HTML file |\n| `--plot` (flag) | all | off | Open interactive plot in browser |\n\nEstimator-specific options:\n\n| Option / Flag | Leaf | Default | Description |\n|---|---|---|---|\n| `--method` | estimate | `twfe` | `twfe`, `cs`, `sa`, `bjs`, `dcdh` |\n| `--leads` | estimate | `0` | Pre-treatment periods |\n| `--horizon` | estimate, event-study, lp-did | `5` | Post-treatment periods/horizon |\n| `--control-group` | estimate | `never_treated` | `never_treated`, `not_yet_treated` |\n| `--n-boot` | estimate | `200` | Bootstrap replications (dcdh only) |\n| `--base-period` | estimate | `varying` | `varying`, `universal` (Callaway\u2013Sant'Anna only) |\n| `--leads` | event-study | `3` | Pre-treatment leads |\n| `--lags` / `-p` | event-study | `4` | Control lags |\n| `--pre-window` | lp-did | `3` | Pre-treatment window |\n| `--post-window` | lp-did | `0` | Post-treatment window (0 = use horizon) |\n| `--ylags` | lp-did | `0` | Outcome lags |\n| `--dylags` | lp-did | `0` | Differenced outcome lags |\n| `--pmd` | lp-did | \u2014 | Pre-treatment matching: `ccs`, `ipw`, or integer |\n| `--nonabsorbing` | lp-did | \u2014 | Non-absorbing treatment (integer periods) |\n| `--reweight` (flag) | lp-did | off | Reweight observations |\n| `--nocomp` (flag) | lp-did | off | No composition adjustment |\n| `--notyet` (flag) | lp-did | off | Use not-yet-treated as controls |\n| `--nevertreated` (flag) | lp-did | off | Use never-treated as controls |\n| `--firsttreat` (flag) | lp-did | off | Use first-treatment timing |\n| `--oneoff` (flag) | lp-did | off | One-off treatment specification |\n| `--only-pooled` (flag) | lp-did | off | Only report pooled estimates |\n| `--only-event` (flag) | lp-did | off | Only report event-time estimates |\n\n# Examples\n\n```bash\nfriedman data simulate did --n 10 --periods 12 --seed 7 --format csv --output did_panel.csv\nfriedman did estimate did_panel.csv --outcome=y --treatment=D\nfriedman did estimate did_panel.csv --outcome=y --treatment=D --method=cs --control-group=not_yet_treated\nfriedman did estimate did_panel.csv --outcome=y --treatment=D --method=sa --cluster=twoway\nfriedman did estimate did_panel.csv --outcome=y --treatment=D --method=dcdh --n-boot=500\nfriedman did event-study did_panel.csv --outcome=y --treatment=D --leads=3 --horizon=5\nfriedman did lp-did did_panel.csv --outcome=y --treatment=D --horizon=5 --reweight --pmd=ipw\nfriedman did lp-did did_panel.csv --outcome=y --treatment=D --horizon=5 --notyet --only-pooled\n```\n\n# See also\n\n* [Policy Causal-Effect Menus](policy-menus.md) - structural and VAR-based causal menus behind policy counterfactuals\n* [Policy Counterfactuals and Optimal Policy](policy-counterfactual.md) - rule counterfactuals built on identified policy shocks", "causal-policy/policy-counterfactual": "# Summary\n\nFourteen leaves turn an estimated causal-effect menu into policy answers. `policy counterfactual` (var/bvar/lp) imposes one builtin rule (`rate-peg`, `inflation-target`, `output-gap`, `ngdp`, `taylor`) or a TOML `[rule]` section \u2014 exactly one of `--rule`/`--rule-config`; `rate-target` is TOML-only since the pegged path lives there \u2014 on the response to the ONE `--nonpolicy-shock`; `--method auto` solves exactly when the menu is square, otherwise least-squares, and `rate-peg`/`taylor` need exactly one mapped instrument. `policy optimal` (var/bvar/lp) replaces the rule with a quadratic loss from `--loss-config` (required; `lambda` has no upstream default; `[loss.smoothing]` needs exactly one instrument) and certifies the optimum with the FOC norm in the summary. `policy moments` (var/bvar) compares unconditional second moments (Wold covariance) under baseline vs rule-or-loss \u2014 exactly one of the two \u2014 with optional business-cycle frequency bands. `policy history` (var/bvar) re-runs an observation window `--t-range lo:hi` (required, length \u2264 H\u22121) under a rule or loss, built from forecast revisions, never identified shocks. `policy opp` (var/bvar) is the Barnichon\u2013Mesters optimal policy perturbation \u03b4*: gaps, not levels \u2014 `--targets` is required on the model-forecast route and refused on the external `--values-file` route; bands sit at 60/75/90% with deliberately reversed polarity (rejection at the lower level is the conservative call); `--constraints-file` (TOML floors/ZLB, requires `--instrument-path`) selects SLSQP by default with `--method projection` as the crude floor-only fallback. `policy opp-sequence` (var/bvar) runs OPP across forecast vintages in `--forecasts-dir` (\u2265 2 dates) with the exact three-part revision decomposition (news + preference + aging = \u03b4t \u2212 \u03b4t\u22121). Every leaf re-derives its menu per invocation (no `--model` handles anywhere in the policy family); the thin-menu honesty signals (`rel_residual`, `spanned`, `error_path`) ship in the output data.\n\n# Functions\n\n| Leaf | Role | Output tables |\n|---|---|---|\n| `friedman policy counterfactual bvar` | Rule counterfactual on a BVAR menu (`--draws` posterior draws, TOML `--config` prior) | `policy_counterfactual_paths` (baseline vs counterfactual per variable/horizon, bands when propagated); `enforcing_policy_shocks_nu` (date-0 shock vector \u03bd*); `implementation_error_path`; `counterfactual_summary` (rule, H, `rel_residual`, `spanned`, draw counts) |\n| `friedman policy counterfactual lp` | Rule counterfactual on an LP menu (`--n-draws` independent-normal draws; TOML `--config` identification) | Same four counterfactual tables |\n| `friedman policy counterfactual var` | Rule counterfactual on a VAR menu (`--replications` bootstrap, 0 = point only) | Same four counterfactual tables |\n| `friedman policy optimal bvar` | Quadratic-loss optimal policy on a BVAR menu | `policy_counterfactual_paths` (baseline vs optimal); `enforcing_policy_shocks_nu`; `implementation_error_path` (stacked FOC-block residuals); `counterfactual_summary` (+ `loss_base`, `loss_cf`, `foc_norm`) |\n| `friedman policy optimal lp` | Quadratic-loss optimal policy on an LP menu | Same four optimal-policy tables |\n| `friedman policy optimal var` | Quadratic-loss optimal policy on a VAR menu | Same four optimal-policy tables |\n| `friedman policy moments bvar` | Second moments under rule-or-loss on a BVAR menu; `--draw-source ce\\|wold\\|both` | `counterfactual_standard_deviations` (baseline vs CF sd per variable, bands); `counterfactual_correlations` (per pair; needs \u2265 2 variables); `moments_summary` (policy, H, VMA `tail_share`, draw source, band) |\n| `friedman policy moments var` | Second moments under rule-or-loss on a VAR menu | Same three moments tables |\n| `friedman policy history bvar` | Historical re-run over `--t-range` on a BVAR menu (rule XOR loss) | `counterfactual_history` (realized vs counterfactual per date/variable, bands); `history_summary` (rule, window, `spanned`, draw counts) |\n| `friedman policy history var` | Historical re-run over `--t-range` on a VAR menu (rule XOR loss) | Same two history tables |\n| `friedman policy opp bvar` | BM optimal perturbation \u03b4* on a BVAR menu; model-forecast or external route; constrained OPP via `--constraints-file` | `opp_recommendation_delta` (\u03b4* and gradient per horizon, bands, rejections); `objective_gap_paths` (gaps before/after); `instrument_paths_announced_vs_recommended`; `opp_summary` (baseline/OPP loss, origin, failures, solver diagnostics) |\n| `friedman policy opp var` | BM optimal perturbation \u03b4* on a VAR menu | Same four OPP tables |\n| `friedman policy opp-sequence bvar` | OPP across vintages on a BVAR menu; `--forecasts-dir` of per-date gap CSVs | `opp_sequence_delta_by_date`; `opp_revision_decomposition` (news + preference + aging); `opp_sequence_summary` (span, loss path, counts) |\n| `friedman policy opp-sequence var` | OPP across vintages on a VAR menu | Same three sequence tables |\n\nShared menu plumbing (all 14 leaves take the `data` CSV positional plus `--output`/`-o`, `--format`/`-f`, `--plot-save`, and `--plot`):\n\n| Option | Leaves | Default | Description |\n|---|---|---|---|\n| `--horizon` | all 14 | `20` | Truncation horizon H (\u2265 1; MW use H=100) |\n| `--shocks` | all 14 | (required) | Identified policy-shock columns (indices or names) |\n| `--outcomes` | all 14 | (required) | Outcome map `name=index-or-column` |\n| `--instruments` | all 14 | \u2014 | Instrument map `name=index-or-column` |\n| `--lags` / `-p` | all 14 | AIC (var), 4 (bvar/lp) | Lag order |\n| `--normalize` | all 14 | `none` | `none`, `instrument-impact` |\n| `--draws` / `-n` | bvar \u00d77 | `2000` | Posterior draws |\n| `--config` | counterfactual/optimal bvar | \u2014 | TOML prior config |\n| `--replications` | var \u00d77 | `0` | Bootstrap draws (0 = point only) |\n| `--n-draws` | counterfactual/optimal lp | `500` | Independent-normal draws (not a joint posterior) |\n| `--config` | counterfactual/optimal lp | \u2014 | TOML identification config |\n| `--nonpolicy-shock` | counterfactual \u00d73, optimal \u00d73 | (required) | The ONE shock the rule/optimum responds to |\n| `--negate` (flag) | counterfactual \u00d73, optimal \u00d73 | off | Flip the non-policy shock's sign |\n| `--rule` | counterfactual \u00d73, moments \u00d72, history \u00d72 | \u2014 | Builtin: `rate-peg`, `inflation-target`, `output-gap`, `ngdp`, `taylor` (textbook rho/phi \u2014 use `--rule-config` for CMW taylor) |\n| `--rule-config` | counterfactual \u00d73, moments \u00d72, history \u00d72 | \u2014 | TOML `[rule]` section (rate-target paths, CMW taylor, custom pi_var/y_var) |\n| `--loss-config` | optimal \u00d73, moments \u00d72, history \u00d72, opp \u00d72, opp-sequence \u00d72 | (required except moments/history where rule XOR loss) | TOML `[loss]` section |\n| `--method` | counterfactual \u00d73 | `auto` | Projection: `auto` (exact when square), `ls`, `exact` |\n| `--use-draws` | counterfactual \u00d73, optimal \u00d73, moments \u00d72, history \u00d72 | `auto` | Propagate menu draws into bands: `auto`, `on`, `off` |\n| `--baseline-draws` | counterfactual \u00d73, optimal \u00d73 | `fixed` | `fixed` (MW convention) or `match` (pair draw d with draw d; equal counts enforced) |\n| `--quantiles` | counterfactual \u00d73, optimal \u00d73, moments \u00d72, history \u00d72 | `0.16,0.5,0.84` | Band quantiles in (0,1) |\n| `--spanned-tol` | counterfactual \u00d73 | `0.05` | `rel_residual` threshold behind `spanned` (optimal hardcodes 0.05 with no flag) |\n| `--draw-source` | moments \u00d72 | `ce` | Uncertainty source: `ce`, `wold`, `both` (matching counts enforced) |\n| `--frequencies` | moments \u00d72 | `none` | `none`, `business-cycle` (2\u03c0/32..2\u03c0/6), or `lo,hi` radians |\n| `--plot-view` | moments \u00d72 | `sd` | Plot panel: `sd`, `corr` |\n| `--t-range` | history \u00d72 | (required) | Observation window `lo:hi`, length \u2264 H\u22121 |\n| `--targets` | opp \u00d72 | (required, model route) | Explicit targets `name=value` per outcome \u2014 gaps, NOT levels; refused on the external route |\n| `--values-file` | opp \u00d72 | \u2014 | External gap-paths CSV (one column per outcome; replaces the model forecast) |\n| `--sd` | opp \u00d72 | \u2014 | External route: per-outcome forecast sd (BM damped covariance); required there |\n| `--rho` | opp \u00d72 | `0.9` | External route: BM damping \u03c1 in \u03a3[j,k]=sd_j\u00b7sd_k\u00b7\u03c1^\\|j\u2212k\\| |\n| `--cross-corr-file` | opp \u00d72 | \u2014 | External route: full covariance CSV \u2014 ignores `--sd`/`--rho` (mutually exclusive) |\n| `--min-sd` | opp \u00d72 | `0.0` | External route: sd floor (warns when it binds) |\n| `--origin` | opp \u00d72 | \u2014 | Forecast origin label, e.g. `2008M4` |\n| `--n-sim` | opp \u00d72 | `2000` | Simulation draws for `estimate_opp` bands (0 = point only; \u03b4* is the draw median per BM) |\n| `--levels` | opp \u00d72 | `0.6,0.75,0.9` | Band levels \u2014 BM reversed polarity |\n| `--instrument-path` | opp \u00d72 | \u2014 | Announced instrument path, H comma values (required with `--constraints-file`) |\n| `--constraints-file` | opp \u00d72 | \u2014 | TOML `[[constraint]]` tables \u2192 constrained OPP |\n| `--method` | opp \u00d72 | `auto` | Constrained solver: `auto`, `slsqp`, `projection` (crude floor-only fallback) |\n| `--matched-draws` (flag) | opp \u00d72, opp-sequence \u00d72 | off | Pair draw d across sources (equal counts enforced) |\n| `--interp-quarterly` (flag) | opp \u00d72 | off | External route: interpolate annual SEP paths to quarterly |\n| `--plot-view` | opp \u00d72 | `delta` | Plot panel: `delta`, `paths` |\n| `--forecasts-dir` | opp-sequence \u00d72 | (required) | Directory of per-date gap-path CSVs (sorted filenames = dates; \u2265 2 dates; H rows each) |\n| `--sd` | opp-sequence \u00d72 | (required) | Per-outcome forecast sd shared across dates |\n| `--rho` | opp-sequence \u00d72 | `0.9` | BM damping rho |\n| `--n-sim` | opp-sequence \u00d72 | `0` | Simulation draws per date (compounds cost) |\n| `--levels` | opp-sequence \u00d72 | `0.6,0.75,0.9` | Band levels (BM reversed polarity) |\n| `--plot-view` | opp-sequence \u00d72 | `fan` | Plot panel: `fan`, `decomposition` |\n\n# Examples\n\n```bash\ncat > loss.toml <<'EOF'\n[loss]\noutcomes = [\"infl\", \"ygap\"]\nlambda = [1.0, 0.5]\nEOF\nfriedman policy counterfactual var :denmark --lags 1 --shocks 3 --nonpolicy-shock 1 --outcomes infl=1,ygap=2 --instruments rate=3 --rule rate-peg --horizon 8\nfriedman policy optimal var :denmark --lags 1 --shocks 3 --nonpolicy-shock 1 --outcomes infl=1,ygap=2 --instruments rate=3 --loss-config loss.toml --horizon 8\nfriedman policy moments var :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --rule rate-peg --horizon 40\nfriedman policy history var :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --rule rate-peg --t-range 20:25 --horizon 12\nfriedman policy opp var :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --loss-config loss.toml --targets infl=2.0,ygap=0 --horizon 8\nmkdir -p vintages\nprintf 'infl,ygap\\n0.5,0.2\\n0.4,0.1\\n0.3,0.0\\n0.2,-0.1\\n' > vintages/2024Q1.csv\nprintf 'infl,ygap\\n0.6,0.3\\n0.5,0.2\\n0.4,0.1\\n0.3,0.0\\n' > vintages/2024Q2.csv\nfriedman policy opp-sequence var :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --loss-config loss.toml --forecasts-dir vintages --sd 0.5,0.5 --horizon 4\n```\n\n# See also\n\n* [Policy Causal-Effect Menus](policy-menus.md) - the empirical and model menus these counterfactuals re-weight\n* [Difference-in-Differences](did.md) - microeconometric treatment-effect estimation\n* [Forecasting and Forecast Evaluation](../forecast/forecast.md) - Waggoner\u2013Zha conditional forecasts as the parallel VAR-based scenario tool", "causal-policy/policy-menus": "# Summary\n\nThe McKay\u2013Wolf idea: the causal effects of identified policy shocks form a *menu*, and a rule counterfactual re-weights that menu so an alternative rule holds along the response to one non-policy shock \u2014 Lucas-robust, with no re-estimation under the new rule. Square-vs-thin is the central axis: a *square* menu (as many policy shocks as horizons) supports an exact solve, while a *thin* empirical menu gives a least-squares projection whose implementation error (`rel_residual`, `spanned`, `error_path`) ships in the output data. The four `policy effects` leaves each estimate their own menu from the data positional (no `--model` handle anywhere in the policy family \u2014 nothing is serializable, containers are re-derived per invocation) and print a tidy menu (`variable|role|shock|horizon|value`) plus a summary (`H`, `n_shocks`, `shock_labels`, `is_square`, `source`, `normalize`, `n_draws`). The two `policy news` leaves build square model menus \u2014 DSGE via one QZ solve of dimension n+H\u22121, HA from sequence-space jacobians \u2014 and `policy jacobian ha` exposes the standalone household jacobian behind the HA route. `policy spanning var` asks whether the model choice matters for one counterfactual (thin empirical vs full news menu), and `policy sufficiency dsge` is the population forecast-sufficiency laboratory that underwrites `policy history`. Reproducibility rides the global `--seed`; variables are referenced by `--outcomes name=index-or-column` / `--instruments` maps on empirical routes and `name=model_symbol` maps on structural routes.\n\n# Functions\n\n| Leaf | Estimator / route | Output tables |\n|---|---|---|\n| `friedman policy effects bvar` | BVAR menu, `--draws` posterior draws, TOML `--config` prior | `policy_causal_effects_menu` (entries by outcome, instrument, horizon); `policy_causal_effects_summary` (shape, normalization, dropped-draw honesty counts) |\n| `friedman policy effects lp` | Local-projection menu, `--n-draws` independent-normal draws (pointwise approximation, not a joint posterior) | Same menu + summary tables |\n| `friedman policy effects sign` | Sign-identified menu, `--replications` candidate rotations, TOML `--config` sign restrictions (required) | Same menu + summary tables |\n| `friedman policy effects var` | Frequentist VAR menu, `--replications` bootstrap draws (0 = point only) | Same menu + summary tables |\n| `friedman policy news dsge` | Square DSGE news menu perturbing `--policy-shock`; linear `--solver` only (nonlinear menus unsupported upstream) | Same menu + summary tables (solver diagnostics) |\n| `friedman policy news ha` | Square HA news menu from sequence-space jacobians; `--instruments` defaults to `rate=r` | Same menu + summary tables (rule-closure diagnostics) |\n| `friedman policy jacobian ha` | Household jacobian `dJ/dinput` for `--input r\\|w` vs `--jac-output` aggregate, tidy `row\\|col\\|value` with T\u00b2 rows; no plot recipe | `sequence_space_jacobian` |\n| `friedman policy spanning var` | Thin empirical (VAR) vs full DSGE-news counterfactual path for one rule; `--model-outcomes`/`--model-instruments` must match `--outcomes`/`--instruments` names in order | `spanning_thin_vs_full_counterfactual_paths`; `spanning_verdict` (`spanned`, max `gap_rel` vs `--tol`, `loading_inside`, `rel_residual_emp`) |\n| `friedman policy sufficiency dsge` | Population FEV ratios (Wold-info over full-info) per observable and horizon; consumes no data; invertibility is sufficient, not necessary | `forecast_sufficiency_fev_ratios`; `sufficiency_summary` (observable set, horizon, verdict) |\n\nAll `policy effects` leaves share one argument and the menu plumbing:\n\n| Argument | Type | Required | Description |\n|---|---|---|---|\n| `data` | String | yes | Path to CSV data file |\n\n| Option | Leaves | Default | Description |\n|---|---|---|---|\n| `--horizon` | effects \u00d74 | `20` | Truncation horizon H (\u2265 1; MW use H=100) |\n| `--shocks` | effects \u00d74 | (required) | Identified policy-shock columns (indices or names, comma-separated) |\n| `--outcomes` | effects \u00d74 | (required) | Outcome map `name=index-or-column`, e.g. `infl=2,ygap=1` |\n| `--instruments` | effects \u00d74 | \u2014 | Instrument map `name=index-or-column`, e.g. `rate=3` |\n| `--lags` / `-p` | effects \u00d74 | AIC (var/sign), 4 (bvar/lp) | Lag order |\n| `--normalize` | effects \u00d74 | `none` | `none`, `instrument-impact` (rescale so the first instrument's impact is +1) |\n| `--output` / `-o`, `--format` / `-f` | effects \u00d74 | `table` | Export path; `table`, `csv`, `json` |\n| `--draws` / `-n` | effects bvar | `2000` | Posterior draws |\n| `--config` | effects bvar | \u2014 | TOML prior config |\n| `--n-draws` | effects lp | `500` | Independent-normal N(value, se) draws |\n| `--config` | effects lp | \u2014 | TOML identification config |\n| `--replications` | effects sign | `1000` | Candidate rotations |\n| `--config` | effects sign | (required) | TOML sign-restriction config |\n| `--replications` | effects var | `0` | Bootstrap draws (0 = point only) |\n\nStructural-route options:\n\n| Option | Leaf | Default | Description |\n|---|---|---|---|\n| `model` (arg) | news dsge, sufficiency dsge | \u2014 | DSGE model file (TOML or .jl ModelSpec) |\n| `model` (arg) | news ha, jacobian ha | \u2014 | HA model (builtin name or .jl HA ModelSpec) |\n| `data` + `model` (args) | spanning var | \u2014 | CSV data file plus DSGE model file for the full news menu |\n| `--policy-shock` | news dsge, spanning var | (required) | Exogenous shock the news menu perturbs |\n| `--outcomes` | news dsge/ha | (required) | `name=model_variable` symbol map |\n| `--instruments` | news dsge/ha | (`rate=r` on ha) | `name=model_variable` symbol map |\n| `--horizon` | news dsge/ha | `100` | News horizon H |\n| `--solver` | news dsge, spanning var | `gensys` | `gensys`, `klein`, `blanchard-kahn` |\n| `--chunk` | news dsge | `0` | Shock columns per solve (0 = all at once) |\n| `--t-horizon` | news ha | `300` | Sequence-space truncation (\u2265 H; < H+50 warns) |\n| `--rule-closure` | news ha | `administered` | `administered`, `market` (market is huggett-only; its wedge is exactly neutral by construction) |\n| `--dx` | news ha, jacobian ha | `0.0001` | Finite-difference step |\n| `--behavioral-m` / `--behavioral-theta` | news dsge/ha | NaN (off) | Gabaix cognitive discounting / sticky expectations in [0,1]; news leaves only |\n| `--input` | jacobian ha | `r` | Price input: `r`, `w` |\n| `--jac-output` | jacobian ha | (required) | Household aggregate to differentiate, e.g. `C` or `A` |\n| `--t-horizon` | jacobian ha | `300` | Jacobian dimension T (table is T\u00b2 rows) |\n| `--nonpolicy-shock` | spanning var | (required) | Baseline non-policy shock |\n| `--model-outcomes` / `--model-instruments` | spanning var | \u2014 | SAME names in SAME order as `--outcomes`/`--instruments` (exact symbol equality) |\n| `--rule` / `--rule-config` | spanning var | \u2014 | Builtin counterfactual rule / TOML `[rule]` section |\n| `--tol` | spanning var | `0.1` | Spanned-verdict tolerance on `gap_rel` |\n| `--n-sim` | spanning var | `200` | Draw propagation for gap bands |\n| `--quantiles` | spanning var | `0.16,0.5,0.84` | Band quantiles in (0,1) |\n| `--lags` / `-p` | spanning var | AIC | VAR lag order |\n| `--replications` | spanning var | `0` | Bootstrap draws on the empirical menu |\n| `--horizon` | spanning var | `20` | Truncation horizon H |\n| `--shocks` / `--outcomes` / `--instruments` | spanning var | (required/\u2014) | Same empirical maps as `policy effects` |\n| `--observables` | sufficiency dsge | (required) | Comma-separated model variables the econometrician sees |\n| `--horizon` | sufficiency dsge | `40` | FEV comparison horizon |\n| `--method` | sufficiency dsge | `gensys` | DSGE solve method |\n\n`policy spanning var` and `policy sufficiency dsge` also take `--output`/`--format`/`--plot-save`/`--plot`; `policy news` and `policy jacobian ha` take `--output`/`--format` only (no plot flags).\n\n# Examples\n\n```bash\nfriedman policy effects var :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --horizon 8\nfriedman policy effects bvar :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --horizon 8 --draws 500\nfriedman policy effects lp :denmark --lags 1 --shocks 3 --outcomes infl=1,ygap=2 --instruments rate=3 --horizon 8\ncat > nk.toml <<'EOF'\n[model]\nparameters = { rho = 0.8, kappa = 0.3, phi = 1.5, sigma = 0.01 }\nendogenous = [\"ygap\", \"infl\", \"rate\"]\nexogenous = [\"e\", \"mp\"]\nlinear = true\n[[model.equations]]\nexpr = \"ygap[t] = rho * ygap[t-1] - 0.2 * rate[t] + sigma * e[t]\"\n[[model.equations]]\nexpr = \"infl[t] = 0.5 * infl[t-1] + kappa * ygap[t]\"\n[[model.equations]]\nexpr = \"rate[t] = phi * infl[t] + 0.01 * mp[t]\"\nEOF\nfriedman policy news dsge nk.toml --policy-shock mp --outcomes infl=infl,ygap=ygap --instruments rate=rate --horizon 8\nfriedman policy news ha huggett --outcomes c=C --horizon 4 --t-horizon 40\nfriedman policy jacobian ha huggett --input r --jac-output C --t-horizon 20\nfriedman policy spanning var :denmark nk.toml --lags 1 --shocks 3 --nonpolicy-shock 1 --outcomes infl=1,ygap=2 --instruments rate=3 --model-outcomes infl=infl,ygap=ygap --model-instruments rate=rate --policy-shock mp --rule rate-peg --horizon 8\nfriedman policy sufficiency dsge nk.toml --observables infl,rate --horizon 12\n```\n\n# See also\n\n* [Policy Counterfactuals and Optimal Policy](policy-counterfactual.md) - rule and loss counterfactuals, OPP, and historical re-runs built on these menus\n* [Difference-in-Differences](did.md) - microeconometric treatment-effect estimation\n* [Forecasting and Forecast Evaluation](../forecast/forecast.md) - Waggoner\u2013Zha conditional forecasts as the parallel VAR-based scenario tool", "configuration/cli-engine": "# Summary\n\nThe CLI framework is custom-built (adapted from Comonicon.jl): `Entry` holds a root `NodeCommand` tree of `NodeCommand`/`LeafCommand` nodes with typed `Argument`/`Option`/`Flag` surfaces. `bin/friedman` activates the project (instantiating when the Manifest is absent, retrying once on load failure) and calls `Friedman.main(ARGS)` \u2192 `run_cli`, which intercepts `repl`, strips leading globals, and dispatches: entry-level first-token globals, node tree-walk, then `dispatch_leaf` (`tokenize` \u2192 `bind_args` \u2192 handler). Every command file declares `CommandSpec`s (path, summary, args/options/flags, tables, handler, data/model/result kinds, family); `register!` finalizes them (family stamping + v1.0.0 path promotion) and `to_leaf`/`build_node` bridge them to the engine. `friedman schema [path...]` exposes the whole tree as raw JSON (not an envelope) with per-leaf draft-07 `input_schema` (`x-cli` argv annotations, `x-handle` roles), declared tables, the contract block (embedded envelope schema + exit taxonomy), and optional `--docs` agent guide.\n\n# Functions\n\n| Item | Kind | Role |\n|---|---|---|\n| `Entry` / `NodeCommand` / `LeafCommand` | tree | Top-level entry, command group, executable leaf |\n| `Argument` / `Option` / `Flag` | surface | Positional, `--opt` with optional choices, boolean `--flag` |\n| `tokenize` | parser | Raw tokens \u2192 positionals/options/flags; `--opt=val`, `-o val`, bundled `-abc`, `--` stops parsing, repeatable `--set`, negative numbers as values |\n| `bind_args` | parser | Bind to declared surface; unknown options error with did-you-mean (Levenshtein \u2264 2); `--model`/--result make `<data>` optional |\n| `convert_value` | parser | String \u2192 Int/Float64/String/Symbol/Bool with typed errors |\n| `dispatch` | dispatch | First-token `--version`/`-V`/`--warranty`/`--conditions`, top-level help, then node walk |\n| `dispatch_node` | dispatch | Match group name, recurse; `schema` takes a dedicated varpath dispatcher; unknown names raise `DispatchError` (exit 2) with replacement hint |\n| `dispatch_leaf` | dispatch | `-h`/`--help` anywhere prints leaf help; empty invocation with required positionals prints help; JSON mode accumulates one envelope, render-then-rethrow on error |\n| `print_help` | help | Colored `Usage:` + family-grouped subcommands / args / options / flags |\n| `CommandSpec` / `ArgSpec` / `OptionSpec` / `FlagSpec` / `TableSpec` | registry | Declarative leaf declaration incl. stable envelope table keys |\n| `wrap_legacy` | adapter | kwargs handler \u2192 `CmdContext`: stem resolution, kind checks, handle load/inject, `--save-*` persist, config merge |\n| `to_leaf` / `build_node` | adapter | Spec \u2192 engine nodes (depth-2 and depth-3 paths; kebab primary only, no aliases) |\n| `_finalize_spec` / `_promote_path` | families | Stamp family; promote `estimate <leaf>` \u2192 `estimate <family> <leaf>`, `did test` \u2192 `test did`, `dsge ha` \u2192 `hadsge`; replacements in `_PATH_REPLACEMENTS` |\n| `model_catalog` / `catalog_specs` | families | One row per model token across estimate/predict/residuals/forecast verbs |\n| `friedman schema [path...]` | leaf | Raw-JSON self-description; `--docs` embeds the agent guide; `--output` writes to file |\n| `bin/friedman` | launcher | `Pkg.activate` + instantiate-once + `Friedman.main(ARGS)` |\n| `bin/friedman-wrapper` | launcher | Uses `friedman.so` sysimage when present, else plain Julia |\n\nShared option groups (from `src/registry/spec.jl`):\n\n| Group | Contents |\n|---|---|\n| `OUTPUT_OPTIONS` | `--format`/`-f` (table\\|csv\\|json), `--output`/`-o` |\n| `PLOT_OPTIONS` + `PLOT_FLAGS` | `--plot-save`, `--plot` |\n| `SAVE_MODEL_OPTION` / `MODEL_OPTION` | `--save-model`, `--model` (handle) |\n| `RESULT_OPTION` / `SAVE_RESULT_OPTION` | `--result`, `--save-result` (handles; added only when `result_types` nonempty) |\n| `CONFIG_ERGONOMICS_OPTIONS` + `STRICT_FLAG` | `--config-json`, repeatable `--set`, `--strict` (added only when `--config` declared) |\n| `REG_OPTIONS`, `PREG_OPTIONS`, `SARIMA_OPTIONS`, `COUNT_*`, `BAYES_OPTIONS` | Family option sets composed by name |\n\nDispatch flags on the `schema` leaf:\n\n| Option/Flag | Type | Default | Description |\n|---|---|---|---|\n| `--format` / `-f` | `String` | `json` | Always json (raw schema document); choices: `json` |\n| `--output` / `-o` | `String` | `\"\"` | Write schema JSON to file |\n| `--docs` | flag | `false` | Embed the agent guide as a `docs` markdown string |\n\n# Examples\n\n```bash\nfriedman --version\nfriedman estimate --help\nfriedman estimate multivariate var --help\nfriedman schema estimate multivariate var | jq .input_schema\nfriedman schema --docs | jq -r .docs | head -n 40\njulia --project bin/friedman --version\n```\n\n# See also\n\n* [Config Files & Schema](config-files.md) - `--config` ergonomics wired through `wrap_legacy`\n* [Handles & Output](output-envelope.md) - globals, envelope accumulation in `dispatch_leaf`\n* [Installation](../installation-architecture/installation.md) - release launcher and sysimage behind `friedman-wrapper`", "configuration/config-files": "# Summary\n\nComplex model specifications live in TOML files passed via `--config` (every leaf declaring it also gains `--config-json`/`--set`/`--strict` through `with_config_ergonomics`). Layers merge as file < `--config-json` < `--set` (dotted `key=value`, repeatable, values parsed as bool/int/float else string) and the merged result is validated once: unknown keys warn with a nearest-match suggestion, or error under `--strict`; bad enum values and malformed TOML/JSON are typed `config/*` errors (exit 4). Every key shown in the guide is read by a `get_*` parser; unlisted top-level sections are ignored as free-form.\n\n# Functions\n\n| Parser | Section | Role |\n|---|---|---|\n| `load_config` / `merge_config` | \u2014 | Load one file / merge file+JSON+`--set`, validate once |\n| `validate_config_schema!` | \u2014 | Unknown-key warnings (errors under `--strict`), enum checks |\n| `apply_set!` | \u2014 | Apply one `--set dotted.key=value` override |\n| `get_prior` | `[prior]` | Minnesota prior: type, `lambda1..4`\u2192`tau`/`lambda`/`decay` (lambda4 not forwarded), optimization flag |\n| `get_identification` | `[identification]` | Sign/narrative method, sign matrix + horizons, narrative shock/periods/signs |\n| `get_uhlig_params` | `[identification.uhlig]` | Penalty-ID tuning: starts, refine, iterations, tolerances |\n| `get_lewis_tvv_params` | `[identification.lewis_tvv]` | Lewis TVV `weighting` (`one_step`/`two_step`/`cue`) |\n| `get_sv_svar_params` | `[identification.sv_svar]` | SV-SVAR EM knobs: hetero shocks, maxiter, Gibbs burn/draws, init |\n| `get_gmm` | `[gmm]` | LP-GMM moment/instrument names, or IV-GMM when `dep`+`theta0` set |\n| `get_smm` | `[smm]` | SMM simulator (`ar1`/`arp`/`var1`/`iid_normal`), theta0, lags, bounds, weighting |\n| `get_nongaussian` | `[nongaussian]` | Non-Gaussian SVAR method, contrast, distribution, regimes |\n| `get_dsge` | `[model]`+`[solver]` | DSGE variables, parameters, `[[model.equations]]`, linear flag, VFI payload, solver |\n| `get_dsge_constraints` | `[constraints]` | OccBin bounds and nonlinear constraints |\n| `get_dsge_priors` | `[priors.<name>]` | Per-parameter `{dist, a, b}` Bayesian priors |\n| `get_system` | `[[equations]]`+`[instruments]` | SUR/3SLS systems: dep/indep per equation, common or per-equation instruments |\n| `get_statespace` | `[statespace]` | General linear-Gaussian system matrices (T/H/Z/Q/R/d/c/a1/P1/init_mode) with dimension checks |\n| `get_determinacy` | `[determinacy]` | 1\u20132 swept params with lower/upper/points or explicit grids, method, div boundary |\n| `get_policy_rule` / loss fns | `[rule]`+`[loss]` | Policy rule (`taylor`+`cmw` guard) and diagonal/AIT loss |\n| `get_vecm_restriction` | `[vecm_restriction]` | Row-major H/A/b restriction matrices for VECM tests |\n| `get_garch_midas` | `[garch_midas]` | `x_lf` low-frequency driver (only for `--rv macro`) |\n\nConfig-related invocation surface (appended to every `--config` leaf):\n\n| Option/Flag | Type | Default | Description |\n|---|---|---|---|\n| `--config` | `String` | `\"\"` | TOML config file path |\n| `--config-json` | `String` | `\"\"` | JSON object merged over `--config` |\n| `--set` | `String` | `\"\"` | Override `key=value`; repeatable; dotted keys OK |\n| `--strict` | flag | `false` | Treat config schema warnings as errors (exit 4) |\n\nSchema tables (from `src/config.jl`):\n\n- `CONFIG_SCHEMA`: known sections `prior`, `identification`, `svar`, `svec`, `gmm`, `smm`, `nongaussian`, `model`, `solver`, `constraints`, `priors` (free param names).\n- `CONFIG_NESTED_SCHEMA`: `prior.hyperparameters`, `prior.optimization`, `identification.sign_matrix/narrative/uhlig/lewis_tvv/sv_svar`.\n- `CONFIG_ENUMS`: allow-lists for `prior.type`, `identification.method` (cholesky/sign/narrative/longrun/arias/uhlig/narrative-adrr/proxy/max-share/\u2026), `gmm.weighting`, `smm.weighting`, `smm.model`, `nongaussian.*`, `solver.method`.\n\n# Examples\n\n```bash\nfriedman estimate multivariate bvar macro.csv --config bvar.toml\nfriedman irf var macro.csv --id sign --config sign.toml --format json\nfriedman estimate regression gmm macro.csv --config gmm.toml --set gmm.weighting=optimal --strict\nfriedman dsge solve rbc.toml --config-json '{\"solver\":{\"order\":2}}'\n```\n\n```toml\n[prior]\ntype = \"minnesota\"\n[prior.hyperparameters]\nlambda1 = 0.2\nlambda2 = 0.5\nlambda3 = 1.0\n[prior.optimization]\nenabled = false\n```\n\n# See also\n\n* [Handles & Output](output-envelope.md) - exit-4 taxonomy and `--seed` handling that configs interact with\n* [CLI Engine & Registry](cli-engine.md) - `with_config_ergonomics` and `wrap_legacy` merge wiring\n* [Architecture](../installation-architecture/architecture.md) - data-flow and stem rules behind handle paths in configs", "configuration/output-envelope": "# Summary\n\nStdout carries data only \u2014 one JSON envelope, one table, or one CSV \u2014 while all status goes to stderr (`--quiet` drops info; validity warnings bypass quiet). Four leading-only globals (`--quiet`/`-q`, `--no-color`, `--json`, `--seed`) are stripped before dispatch; `--json` injects `--format json` when no `--format` is present, and `--seed` calls `Random.seed!` and is recorded in the envelope `meta`. `--format json` accumulates every `output_result`/`output_kv` table into one envelope (`schema_version: 1`, frozen at v1.0.0): `command`, `status` ok/error with co-occurring `error`, `meta` (cli/julia/mems versions, seed, argv, elapsed, manifest), `data` (stable registry-declared table keys; family tables use `<name>_<variable-slug>`), `warnings`, `artifacts`. Failures in JSON mode still emit exactly one error envelope on stdout (the `run_cli` error net covers pre-dispatch usage errors). Non-finite floats serialize as `\"NaN\"`/`\"Inf\"`/`\"-Inf\"`, never null.\n\n# Functions\n\n| Item | Kind | Role |\n|---|---|---|\n| `--quiet` / `-q` | global flag | Drop info-level status; warnings/errors still surface |\n| `--no-color` | global flag | Disable stderr styling (also honors `NO_COLOR`) |\n| `--json` | global flag | Force `--format json` when no `--format` given |\n| `--seed N` / `--seed=N` | global option | `Random.seed!(N)`; forwarded as estimators' `seed=`; recorded in manifest/meta |\n| `--version` / `-V`, `--warranty`, `--conditions` | first-token | Version / GPL notices; fire only as the first token |\n| `output_result` | emitter | Matrix/DataFrame \u2192 table (PrettyTables) / CSV / envelope table |\n| `output_kv` | emitter | Pairs \u2192 metric/value table (no scalar sibling in the envelope) |\n| `resolve_stem` | handle | Stem \u2192 `.jld2` preferred, `.csv` on data slots only, else exact path |\n| `resolve_save_path` | handle | Suffixless save path \u2192 append `.jld2` |\n| `load_data` | loader | CSV / handle / `:builtin` \u2192 DataFrame (`~` expanded, `FRIEDMAN_DATA_ROOT` confinement) |\n| `parse_dataset_name` | loader | Normalize `:fred-md`/`fred_md` spellings; typed `data/unknown-dataset` |\n| `dataset_to_dataframe` | loader | MEMs dataset \u2192 DataFrame (panels keep `group`/`time` ids) |\n| `df_to_matrix` / `variable_names` | loader | Numeric-only matrix and column names |\n| `save_model_dispatch` / `load_model_dispatch` | handle | `.jld2` native / `.fmod` interim / `model://` dispatch |\n| `CliError` / `exit_class` | errors | `class/code` taxonomy; envelope `error.exit_code` equals process exit |\n\nExit codes:\n\n| Code | Class | Meaning |\n|---|---|---|\n| 0 | \u2014 | Success |\n| 2 | `usage/*` | Unknown command/option, parse error, bad value |\n| 3 | `data/*` | Missing file, wrong kind, bad values, serialization |\n| 4 | `config/*` | Config/TOML errors |\n| 5 | `model/*` | Convergence, identification, solve, singular (incl. mapped MEMs domain errors) |\n| 6 | `env/*` | Model-version mismatch, missing completions, environment |\n| 1 | other | Internal/bug |\n\nBehavior notes:\n\n- `wrap_legacy` type-checks loaded handles against registry `data_kinds`/`model_types`/`result_types` before the handler runs (`data/wrong-kind`, `model/wrong-kind`, `data/wrong-result`, all exit 3/5). `--result` cannot combine with `--model` or a data path (`usage/invalid`).\n- Save rules: no suffix \u2192 append `.jld2`; `.csv` on data-edit output exports (metadata dropped); writing `.jld2` from CSV without `data import` is `usage/invalid`.\n- Data-edit of CSV with `-o out.jld2` is refused; `data import` itself is exempt.\n- MEMs `MacroModelError` subtypes map to `model/*` (exit 5); untyped orientation `ArgumentError`s match on message \u2192 `data/orientation` (exit 3).\n\n# Examples\n\n```bash\nfriedman --seed 7 estimate multivariate var macro.csv --lags 2 --format json\nfriedman --quiet --json irf var --model var --horizons 20\nfriedman estimate multivariate var macro.csv --format csv --output var.csv\nfriedman data simulate var --periods 200 --format json | jq .data.simulated_data.rows[0]\n```\n\n# See also\n\n* [Config Files & Schema](config-files.md) - `config/*` exit-4 sources and `--strict`\n* [CLI Engine & Registry](cli-engine.md) - dispatch pipeline and the `schema` self-description\n* [Model Handles](../infra/model-handles.md) - handle inspection and verification leaves", "data/clean": "# Summary\n\nNine leaves inspect and reshape datasets in place by type: a typed handle is cleaned/transformed as the same type (`*_clean.jld2`, `*_transformed.jld2` by default), CSV input still writes CSV, and a CSV edit with `-o out.jld2` is `usage/invalid` (run `data import` first). `describe`/`diagnose` accept a CSV path, a `:example` name, or a typed handle stem. NaN-padded series such as `mp_shocks` keep `NaN` outside each series' published sample (zero is a valid shock value): use `describe` (`first_valid`/`last_valid`), then `dropna --vars ...` or `keeprows --rows ...` to cut a finite sample. `validate` takes a model-type string (`--model var`), not a saved-model handle, and prints its verdict to stderr with no envelope table.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman data describe <data>` | Per-variable summary statistics (finite obs only) | `descriptive_statistics` |\n| `friedman data diagnose <data>` | NaN/Inf counts and constant-series flag per variable | `data_diagnostics` |\n| `friedman data fix <data>` | Clean via listwise / interpolate / mean | persists `*_clean` object |\n| `friedman data dropna <data>` | Drop rows containing NaN/Inf (all-empty is `data/invalid`) | `cleaned_data` |\n| `friedman data keeprows <data>` | Keep rows by index range/list (`--rows` required, `end` = last) | `filtered_data` |\n| `friedman data balance <data>` | Balance a panel via DFM imputation | `balanced_panel` |\n| `friedman data transform <data>` | Apply FRED tcodes 1-7 (one code per variable) | persists `*_transformed` object |\n| `friedman data filter <data>` | Trend-cycle filter (`hp\\|hamilton\\|bn\\|bk\\|bhp`), time-series only | `data_filter` |\n| `friedman data validate <data>` | Validate suitability for a model type (stderr verdict) | none |\n\nAll nine take a required `data` argument (handle stem or CSV path). Shared options on every leaf: `--format, -f` (`table`, default) and `--output, -o` (`\"\"`). Leaf-specific options:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `fix` | `--method, -m` | `listwise` | `listwise\\|interpolate\\|mean` |\n| `dropna` | `--vars` | `\"\"` | Column names to check, comma-separated (default: all); unknown name is `data/column-range` |\n| `keeprows` | `--rows` | `\"\"` (required) | Row indices, e.g. `1:100`, `1,5,10` |\n| `balance` | `--method` | `dfm` | `dfm` |\n| `balance` | `--factors, -r` | `3` | Number of factors |\n| `balance` | `--lags, -p` | `2` | Factor VAR lags |\n| `transform` | `--tcodes` | `\"\"` | Comma-separated FRED codes; count must match variables, codes 1-7 |\n| `filter` | `--method, -m` | `hp` | `hp\\|hamilton\\|bn\\|bk\\|bhp` |\n| `filter` | `--component` | `cycle` | `cycle\\|trend` |\n| `filter` | `--lambda, -l` | `1600.0` | Smoothing parameter (HP/BHP) |\n| `filter` | `--horizon` | `8` | Forecast horizon (Hamilton) |\n| `filter` | `--lags, -p` | `4` | Lags (Hamilton/BN) |\n| `filter` | `--columns, -c` | `\"\"` | Column indices, comma-separated (default: all) |\n| `validate` | `--model` | `\"\"` | Model type: `var\\|bvar\\|vecm\\|arima\\|garch\\|sv\\|lp\\|gmm\\|factor` |\n\nFRED codes: 1 level, 2 first difference, 3 second difference, 4 log, 5 first difference of log, 6 second difference of log, 7 first difference of percent change. `transform` on a `CrossSectionData` handle is `data/wrong-kind`, as is `filter` on a panel handle (time-series only).\n\n# Examples\n\n```bash\nfriedman data describe :stackloss\nfriedman data diagnose :mp_shocks\nfriedman data fix :denmark --method=interpolate --output=denmark_clean_tmp.csv\nfriedman data dropna :mp_shocks --vars=ygap,infl,ffr\nfriedman data keeprows :nile --rows=1:100\nfriedman data balance :grunfeld --factors=3 --lags=2\nfriedman data transform :denmark --tcodes=5,5,1,6,1\nfriedman data filter :nile --method=hp --component=cycle\nfriedman data filter :nile --method=hamilton --horizon=8 --lags=4\nfriedman data validate :denmark --model=var\n```\n\n# See also\n\n* [Handles and Examples](handles.md) - import CSVs to typed handles first\n* [Simulation (DGPs)](simulate.md) - synthetic samples with known truth", "data/handles": "# Summary\n\nThe preferred unit of work is a MEMs typed container (`TimeSeriesData`, `PanelData`, `CrossSectionData`) persisted as a **stem** \u2014 pass `macro`, not `macro.jld2`. Data leaves resolve a data slot as `macro.jld2` if it exists (preferred), else `macro.csv`, else the exact path. Every command that takes a `<data>` path also accepts a `:name` reference to a bundled dataset (`:fred_md`, `:grunfeld`, \u2026; both separator spellings resolve). The fixed dataset set lives in `src/io.jl` (`EXAMPLE_DATASETS`); the `wiot` IO table is not listed here and is served by the `io` family instead. An unknown name is `data/unknown-dataset` (exit 3) with a nearest-match hint.\n\n`data import` is the CSV \u2192 typed conversion (`-o out.jld2` or a stem); editing a CSV with `-o out.jld2` is `usage/invalid` (import first). `data export` is the inverse (typed handle \u2192 CSV; frequency/tcode/dates dropped with an stderr note). `data list` enumerates the catalog and `data load` materializes a named example (or `--path` CSV) to stdout/CSV.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman data list` | List bundled example datasets with type, dimensions, description | `available_datasets` |\n| `friedman data load [name]` | Load a named example (or `--path` CSV) and export | none (writes CSV / renders data) |\n| `friedman data import <data>` | Import CSV or `:example` to a typed `.jld2` handle | `imported_data` (kind, n_obs, n_vars, path, frequency) |\n| `friedman data export <data>` | Export a typed handle to CSV (panel adds group/time cols) | none (writes CSV directly) |\n\n`data list` takes no argument. Its options:\n\n| Option | Default | Description |\n|---|---|---|\n| `--format, -f` | `table` | `table\\|csv\\|json` |\n| `--output, -o` | `\"\"` | Export results to file |\n\n`data load` arguments and options:\n\n| Argument | Required | Description |\n|---|---|---|\n| `name` | no | Example dataset name (omit with `--path`) |\n\n| Option | Default | Description |\n|---|---|---|\n| `--output, -o` | `\"\"` | Output CSV file path |\n| `--format, -f` | `table` | `table\\|csv\\|json` |\n| `--vars` | `\"\"` | Comma-separated variable subset (unknown names: `data/column-range`) |\n| `--country` | `\"\"` | Country filter (PWT panel) |\n| `--dates` | `\"\"` | Column name for date labels (time-series only) |\n| `--path` | `\"\"` | CSV path alternative to named dataset; wins over `name` with stderr note |\n| `--transform, -t` (flag) | off | Apply FRED transformation codes (`usage/invalid` on cross-section) |\n\nGive either `<name>` or `--path`; neither is a usage error.\n\n`data import` arguments and options:\n\n| Argument | Required | Description |\n|---|---|---|\n| `data` | yes | CSV path, stem, or `:example` dataset (never an existing handle) |\n\n| Option | Default | Description |\n|---|---|---|\n| `--kind` | `\"\"` | `timeseries\\|panel\\|cross-section` (required for CSV; inferred for `:example`) |\n| `--frequency` | `other` | `daily\\|monthly\\|quarterly\\|annual\\|mixed\\|other` (`usage/invalid` with cross-section) |\n| `--dates` | `\"\"` | CSV column of date labels (timeseries) |\n| `--id-col` | `\"\"` | Panel group column (required for `--kind panel`) |\n| `--time-col` | `\"\"` | Panel time column (required for `--kind panel`) |\n| `--vars` | `\"\"` | Comma-separated variable subset |\n| `--tcodes` | `\"\"` | Comma-separated FRED tcode per variable |\n| `--note` | `\"\"` | Free-form note stored in the handle header |\n| `--output, -o` | `\"\"` | Output stem or path (default: input basename) |\n| `--format, -f` | `table` | `table\\|csv\\|json` |\n\n`--kind` mismatch on `:example` is `data/wrong-kind`; re-importing a handle is `usage/invalid`. Identifier/label columns (`--id-col`, `--time-col`, `--dates`) are metadata, not variables. Missing cells are rejected (`data/missing-values`) \u2014 drop or impute first.\n\n`data export` arguments and options:\n\n| Argument | Required | Description |\n|---|---|---|\n| `data` | yes | Handle stem or path (`TimeSeriesData`/`PanelData`/`CrossSectionData`) |\n\n| Option | Default | Description |\n|---|---|---|\n| `--output, -o` | `\"\"` | Output CSV path (default: `<stem>.csv`) |\n| `--format, -f` | `table` | `table\\|csv\\|json` |\n\nA raw CSV input is `data/wrong-kind`.\n\n# Examples\n\n```bash\nfriedman data list\nfriedman data load fred_md --output=macro_tmp.csv\nfriedman data load pwt --country=USA --output=us_data_tmp.csv\nfriedman data load --path=nile_tmp.csv\nfriedman data import :fred_md -o fred_md_demo\nfriedman data import grunfeld_tmp.csv --kind panel --id-col group --time-col time -o grunfeld_csv_demo\nfriedman data export fred_md_demo -o fred_md_tmp.csv\n```\n\n# See also\n\n* [Inspect, Clean, Transform](clean.md) - describe, diagnose, fix, and reshape handles\n* [Simulation (DGPs)](simulate.md) - synthetic samples with known truth\n* [IO Tables and Sources](../io/tables.md) - home of the `:wiot` example table", "data/simulate": "# Summary\n\n`data simulate` is an intermediate node (not a leaf): its 21 sub-leaves each draw a sample plus the population that generated it. Every leaf emits the same three tables: `simulated_data` (observables an estimator would read; time series carry `time`, panels `id`/`time`, cross-sections `obs`), `population_truth` (parameters flattened to `parameter,row,col,value`; scalars have `row = col = 0`), and `simulation_settings` (`model`, effective `seed`, kind/distribution). Leaf `--seed 0` defers to the global `--seed`; with neither set the draw is `Xoshiro(0)`, so unseeded calls still reproduce. Structural shocks are not copied into the truth table (the seed reproduces them); conditional variances `h` are included for volatility leaves.\n\nThe DSGE-family leaves (`dsge`, `ha`, `olg`, `ct`) have no fixed DGP: they solve the model and call MEMs `simulate`. `--order` applies only to `dsge --method perturbation` (any other combination is `usage/invalid`); `ha --method krusell-smith` has no aggregate path (`usage/invalid`). Keep the `ct` solver grid at its default: coarsened grids have failed to converge on some platforms while passing on others.\n\n# Functions\n\n| Leaf | What it draws |\n|---|---|\n| `friedman data simulate var` | Reference stationary VAR(1); truth: `A_1`, `B0`, `Sigma`, `c` |\n| `friedman data simulate svar` | Non-Gaussian SVAR, independent structural shocks (`--dist`, `--nu`) |\n| `friedman data simulate heteroskedastic-var` | Heteroskedastic SVAR: Markov, GARCH, smooth, or break |\n| `friedman data simulate arima` | Gaussian ARIMA, optional seasonal AR/MA left at zero |\n| `friedman data simulate garch` | GARCH-family returns; `h` path in the truth table |\n| `friedman data simulate sv` | Stochastic volatility (Gaussian, no leverage) |\n| `friedman data simulate vecm` | Rank-1 VECM; truth: `alpha`, `beta`, `Gamma`, `Sigma` |\n| `friedman data simulate cointreg` | Cointegrating regression; `--spurious` draws independent random walks |\n| `friedman data simulate ardl` | ARDL(1,1); truth: `phi`, `beta`, long-run multiplier `theta` |\n| `friedman data simulate factors` | Dynamic factor model (VAR factors, random loadings) |\n| `friedman data simulate lp-iv` | Local-projection IV (instrument `z`, endogenous `s`, outcome `y`) |\n| `friedman data simulate panel` | Linear or binary panel with optional correlated effects |\n| `friedman data simulate pvar` | Panel VAR(1) with random effects |\n| `friedman data simulate did` | Staggered adoption with realized ATT (`overall_att`, `att_e:`, `att_c:`) |\n| `friedman data simulate gmm` | Heteroskedastic OLS or IV moments |\n| `friedman data simulate regime` | Markov-switching, SETAR, LSTAR, or ESTAR |\n| `friedman data simulate cross-section` | Cross-section DGP from OLS through RDD |\n| `friedman data simulate dsge <model>` | Representative-agent path from solve + simulate (`.jl`/`.toml` spec) |\n| `friedman data simulate ha <model>` | HA aggregate **deviations** (`ssj`/`reiter`); SS levels as `ss_agg:*`/`ss_price:*` |\n| `friedman data simulate olg` | Blanchard perpetual-youth saddle path (deterministic; steady state as truth) |\n| `friedman data simulate ct` | Continuous-time Aiyagari MIT transition after an initial TFP shock |\n\nAll 21 emit `simulated_data`, `population_truth`, `simulation_settings`. Shared options on every leaf: `--format, -f` (`table`), `--output, -o` (`\"\"`), `--seed` (`0` = defer to global, else `Xoshiro(0)`). Only `dsge` and `ha` take a required `model` argument. Leaf-specific options:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `var`, `vecm` | `--periods` / `--burn` | `200` / `50` | Sample length after burn-in / burn-in draws |\n| `svar` | `--dist` / `--nu` | `t` / `5.0` | `gauss\\|t\\|laplace\\|mixture\\|skew`; t d.f. (> 2) |\n| `heteroskedastic-var` | `--kind` | `markov` | `markov\\|garch\\|smooth\\|external` |\n| `arima` | `--phi` / `--theta` / `--diff` / `--sigma` / `--drift` | `0.5` / `\"\"` / `0` / `1.0` / `0.0` | AR/MA csv lists, integration order, innov s.d., drift |\n| `garch` | `--kind` | `garch` | `arch\\|garch\\|egarch\\|gjr\\|aparch\\|igarch\\|cgarch\\|figarch\\|fiegarch` |\n| `sv` | `--mu` / `--phi` / `--sigma-eta` | `-0.5` / `0.95` / `0.2` | Log-var mean, persistence, vol-of-vol |\n| `cointreg` | `--endog-rho` / `--sigma-u` / `--spurious` | `0.7` / `1.0` / off | Endogeneity corr, error scale, no-cointegration flag |\n| `ardl` | `--phi` / `--beta0` / `--beta1` | `0.6` / `0.8` / `0.4` | Lag-DV, contemporaneous/lagged regressor coefs |\n| `factors` | `--series` | `12` | Observed series N |\n| `lp-iv` | `--pi1` / `--theta` | `1.5` / `1.0` | First-stage coef, impact response of y to s |\n| `panel` | `--kind` / `--n` | `linear` / `30` | `linear\\|logit\\|probit`; cross-sectional units |\n| `pvar` | `--n` / `--periods` | `15` / `20` | Units / sample length |\n| `did` | `--n` / `--periods` | `80` / `20` | Units / sample length (cohorts at dates 6, 11, 16 in-sample) |\n| `gmm` | `--kind` / `--n` / `--pi1` | `iv` / `200` / `1.0` | `ols\\|iv`; obs; first-stage strength (iv) |\n| `regime` | `--kind` | `ms` | `ms\\|setar\\|lstar\\|estr` |\n| `cross-section` | `--kind` / `--n` | `ols` / `200` | `ols\\|hc\\|cluster\\|iv\\|logit\\|probit\\|ordered\\|mlogit\\|poisson\\|nb\\|tobit\\|truncreg\\|heckman\\|qreg\\|rdd` |\n| `dsge` | `--method` / `--order` / `--meas-sd` / `--periods` / `--burn` | `gensys` / `1` / `\"\"` / `80` / `20` | `gensys\\|klein\\|blanchard-kahn\\|perturbation\\|projection\\|pfi\\|vfi`; order 1-3 (pert. only); meas-error s.d. |\n| `ha` | `--method` / `--n-reduced` / `--distribution` / `--hh-solver` / `--periods` | `reiter` / `10` / `young` / `egm` / `20` | `ssj\\|reiter`; reduced states; `young\\|winberry`; `egm\\|vfi` |\n| `olg` | `--alpha` / `--beta` / `--delta` / `--gamma` / `--z` / `--debt` / `--k0` / `--periods` | `0.36` / `0.96` / `0.08` / `0.98` / `1.0` / `0.0` / `0.0` / `40` | Technology/preference params; `k0 = 0` means 0.8 x SS |\n| `ct` | `--alpha` / `--rho` / `--sigma` / `--delta` / `--z` / `--shock-size` / `--grid-size` / `--a-max` / `--max-iter` / `--tol` / `--dt` / `--periods` | `0.36` / `0.05` / `2.0` / `0.05` / `1.0` / `0.95` / `40` / `30.0` / `80` / `1e-5` / `0.25` / `12` | Aiyagari params; impact TFP fraction; grid/solver settings |\n\n`--periods`/`--burn` defaults vary slightly by leaf (garch 300/50, regime 200/40, factors 80/20, pvar 20/\u2014, did 20/\u2014, ct 12/\u2014); the generated reference is authoritative per leaf.\n\n# Examples\n\n```bash\nfriedman data simulate var --periods 200 --burn 50 --seed 7 --format json\nfriedman data simulate arima --periods 200 --seed 7 --format json\nfriedman data simulate garch --periods 300 --seed 7 --format json\nfriedman data simulate did --n 80 --periods 20 --seed 7 -o did_demo\nfriedman data simulate cross-section --kind rdd --n 500 --seed 7\nfriedman data simulate dsge rbc.toml --method gensys --periods 80 --seed 7\nfriedman data simulate ha huggett --method reiter --periods 20 --seed 7\n```\n\n# See also\n\n* [Handles and Examples](handles.md) - import simulated CSVs to typed handles\n* [RA Core: Solve and Analyze](../dsge/core.md) - the DSGE solve behind `simulate dsge`\n* [HA-DSGE](../dsge/hadsge.md) - the HA solve behind `simulate ha`", "dsge/bayes": "# Summary\n\n`dsge bayes` is an intermediate node (not a leaf): its 15 sub-leaves re-estimate the posterior and then analyze it. All sampling leaves share the `BAYES_OPTIONS` set: `--data, -d` (CSV), `--params` (comma-separated names), `--priors` (priors TOML path), `--sampler` (`smc` default, `smc2`, `mh`), `--n-smc` (5000), `--n-particles` (500, smc2), `--n-draws`/`--burnin` (10000/5000), `--ess-target` (0.5), `--observables`, `--solver` (`gensys`/`klein`/`perturbation`), `--order` (1-3), `--constraint-solver`, `--prefilter` (`none`/`demean`/`first-difference`/`linear-detrend`/`hp`, the Dynare prefilter; `--hp-lambda` 1600 quarterly), `--measurement-error` (`none`/`auto`/csv), `--delayed-acceptance` (MH flag), plus `--format`/`--output`. Priors live in a TOML file with a `[priors]` section. Non-sampling leaves (`identification`, `posterior-mode`, `prior-predictive`) take a subset: no `--data`/`--sampler` where no posterior is drawn.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman dsge bayes estimate <model>` | Posterior draws via smc/smc2/mh | `bayesian_dsge_posterior` |\n| `friedman dsge bayes summary <model>` | Posterior moments + prior-vs-posterior | `bayesian_dsge_posterior_summary`, `prior_vs_posterior_comparison` |\n| `friedman dsge bayes irf <model>` | Posterior-mean IRFs | `bayesian_dsge_irf_*` (per shock) |\n| `friedman dsge bayes fevd <model>` | Posterior-mean FEVD | `bayesian_dsge_fevd_*` (per variable) |\n| `friedman dsge bayes hd <model>` | Posterior-mean HD with quantiles | `bayesian_dsge_historical_decomposition_*` (per shock) |\n| `friedman dsge bayes simulate <model>` | Posterior-mean simulated path | `bayesian_dsge_simulation` |\n| `friedman dsge bayes predictive <model>` | Posterior predictive simulations | `posterior_predictive_summary` |\n| `friedman dsge bayes prior-predictive <model>` | Prior predictive distribution (no data) | `prior_predictive_distribution`, `prior_predictive_summary` |\n| `friedman dsge bayes compare <model>` | Two-model comparison via log marginal likelihood | `bayesian_model_comparison` |\n| `friedman dsge bayes marginal-lik <model>` | Bridge-sampling + SMC log marginal likelihood | `marginal_likelihood_bridge_sampling` |\n| `friedman dsge bayes posterior-mode <model>` | Posterior mode + Laplace log ML (no sampling) | `posterior_mode`, `posterior_mode_diagnostics` |\n| `friedman dsge bayes mcmc-diag <model>` | R-hat, bulk/tail ESS, Geweke | `mcmc_convergence_diagnostics`, `mcmc_diagnostics_summary` |\n| `friedman dsge bayes identification <model>` | Iskrev rank identification test (no sampling) | `identification_diagnostics`, `singular_values` |\n| `friedman dsge bayes learning-rate <model>` | Koop-Pesaran-Smith learning rate on nested subsamples | `learning_rate_check`, `learning_rate_summary` |\n| `friedman dsge bayes overlap <model>` | Prior/posterior overlap weak-identification flags | `prior_posterior_overlap`, `overlap_summary` |\n\nAll 15 take a required `model` argument. Leaf-specific options beyond `BAYES_OPTIONS`:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `estimate` | `--save-model` | `\"\"` | Save fitted model to a handle |\n| `irf` / `fevd` | `--horizon` | `40` | Response / decomposition horizon |\n| `irf` / `fevd` | `--plot` / `--plot-save` | off | Browser plot / save HTML |\n| `hd` | `--horizon` / `--n-hd-draws` / `--quantiles` | `40` / `200` / `0.16,0.5,0.84` | Horizon / posterior draws / quantile levels |\n| `hd` | `--mode-only` / `--plot` / `--plot-save` | off | Posterior mode only / plot / save HTML |\n| `simulate` | `--periods` / `--plot` / `--plot-save` | `200` / off | Simulation periods / plot / save HTML |\n| `predictive` | `--n-sim` / `--periods` | `500` / `100` | Predictive simulations / periods each |\n| `predictive` | `--plot` / `--plot-save` | off | Plot / save HTML |\n| `prior-predictive` | `--periods` / `--n-draws` | `200` / `10000` | Periods per draw / prior draws (no `--data`/`--sampler`) |\n| `compare` | `--model2` / `--params2` / `--priors2` | `\"\"` | Second model file / params / priors TOML |\n| `marginal-lik` | `--proposal` / `--df` | `normal` / `5.0` | Bridge proposal `normal\\|t` / t d.f. |\n| `posterior-mode` | `--max-iter` / `--f-reltol` | `500` / `1e-8` | Optimizer iterations (>= 1) / rel tol (> 0); no sampling flags |\n| `identification` | `--n-lags` | `2` | Autocovariance lags in the Iskrev moment vector; `--params` required |\n| `learning-rate` | `--fractions` / `--threshold` / `--refit-n-smc` | `0.5,1.0` / `0.2` / `100` | Nested subsample fractions / flag threshold / SMC particles per refit |\n| `overlap` | `--threshold` / `--n-grid` | `0.8` / `0` | Overlap flag threshold / histogram bins (0 = auto) |\n\n# Examples\n\n```bash\nfriedman dsge bayes estimate rbc.toml --data obs.csv --params rho,sigma --priors priors.toml --observables Y,C --sampler smc --n-smc 500\nfriedman dsge bayes summary rbc.toml --data obs.csv --params rho,sigma --priors priors.toml\nfriedman dsge bayes irf rbc.toml --data obs.csv --params rho,sigma --priors priors.toml --horizon 40\nfriedman dsge bayes identification rbc.toml --params rho,sigma --observables Y,C\nfriedman dsge bayes posterior-mode rbc.toml --data obs.csv --params rho,sigma --priors priors.toml --observables Y,C\nfriedman dsge bayes compare rbc.toml --data obs.csv --params rho --priors priors.toml --model2 alt.toml --params2 rho --priors2 priors.toml\nfriedman dsge bayes prior-predictive rbc.toml --params rho,sigma --priors priors.toml --periods 200\n```\n\n# See also\n\n* [RA Core: Solve and Analyze](core.md) - point-solution and GMM estimation leaves\n* [HA-DSGE](hadsge.md) - Bayesian estimation of heterogeneous-agent models", "dsge/core": "# Summary\n\nRepresentative-agent DSGE from a `.toml` or `.jl` model file (auto-detected by extension; anything else is `usage/invalid-option`). TOML carries `[model]` (`endogenous`, `exogenous`, `parameters`, `[[model.equations]]` in `var[t]` form); a `.jl` file must evaluate to an RA `ModelSpec` (typically `@dsge begin ... end`, evaluated in a sandbox with MEMs exports in scope). A file evaluating to an agent-kind spec is `usage/wrong-command` \u2014 run it under `hadsge` or the matching `dsge` family command instead. An `E[t]` expectation wrapping `(...)` is `config/invalid`; write the `x[t+1]` lead directly (it means `E_t x_{t+1}`).\n\nSeven solution methods (`gensys`, `klein`, `blanchard-kahn`, `perturbation` orders 1-3, `projection`, `pfi`, `vfi`) are shared by `solve`, `irf`, `fevd`, `hd`, and `simulate`; `solve` adds OccBin constraints (`--constraints` TOML, optional `--constraint-solver` backend). `determinacy-map` needs a `--config` TOML with a `[determinacy]` section (REQUIRED). `estimate` is GMM-style (`irf_matching`, `likelihood`, `bayesian`, `smm`); full Bayesian work lives under `dsge bayes`.\n\n# Functions\n\n| Leaf | Purpose | Output tables |\n|---|---|---|\n| `friedman dsge steady-state <model>` | Deterministic steady state (+ OccBin steady state) | `dsge_steady_state` |\n| `friedman dsge solve <model>` | Solve by one of 7 methods (+ OccBin path) | `dsge_solution`, `perturbation_policy_gx`, `projection_solution`, `projection_diagnostics`, `vfi_value_*`, `determinacy_verdict`, `dsge_occbin_solution` |\n| `friedman dsge determinacy-map <model>` | 1-2 parameter determinacy sweep | `dsge_determinacy_map`, `determinacy_region_summary`, `determinacy_boundary` |\n| `friedman dsge simulate <model>` | Stochastic simulation (burn-in dropped) | `dsge_simulation` |\n| `friedman dsge irf <model>` | Analytical (or simulation-based / OccBin) IRFs | `dsge_irf_*` (per shock), `occbin_irf_*` (per variable) |\n| `friedman dsge fevd <model>` | h-step (or unconditional order>=2) FEVD | `dsge_fevd_*` (per variable) |\n| `friedman dsge hd <model>` | Kalman-smoother historical decomposition | `dsge_historical_decomposition_*` (per shock) |\n| `friedman dsge moments <model>` | Theoretical moments from a perturbation solution | `dsge_theoretical_moments`, `variance_covariance`, `autocovariances` |\n| `friedman dsge perfect-foresight <model>` | Newton deterministic transition path | `perfect_foresight_path` |\n| `friedman dsge estimate <model>` | GMM-style parameter estimation | `dsge_estimation` |\n\nAll ten take a required `model` argument (path to `.toml`/`.jl`). Every leaf accepts `--format, -f` (`table`) and `--output, -o` (`\"\"`).\n\nShared solver options (`solve`, `irf`, `fevd`, `hd`, `simulate`):\n\n| Option | Default | Description |\n|---|---|---|\n| `--method` | `gensys` | `gensys\\|klein\\|perturbation\\|projection\\|pfi\\|vfi\\|blanchard-kahn` |\n| `--order` | `1` | Perturbation order 1-3 |\n| `--degree` | `5` | Polynomial degree (projection/pfi/vfi) |\n| `--grid` | `auto` | `auto\\|chebyshev\\|smolyak` (vfi: `auto\\|tensor\\|smolyak`) |\n| `--next-state` | `\"\"` | VFI `auto\\|linear\\|residual`; PFI `linear\\|policy\\|nonlinear` |\n| `--howard-steps` | `-1` | Howard steps (vfi dflt 20, pfi 0; -1 = method default) |\n| `--n-grid` / `--n-choice` | `0` | VFI tensor nodes/state (>=3; 0 = 12) / line-search points (0 = 41) |\n| `--optimizer` | `\"\"` | VFI maximizer `auto\\|grid1d\\|fminbox-nm\\|fminbox-lbfgs` |\n| `--smolyak-mu` | `\"\"` | VFI Smolyak level (unset = 2) |\n| `--n-quad` / `--scale` / `--tol` / `--max-iter` / `--damping` / `--anderson-m` | `0` | VFI/PFI numerics (0 = upstream defaults: 5 / 3.0 / 1e-8 / 500 / 1.0 / 0) |\n\nLeaf-specific options beyond those:\n\n| Leaf | Option | Default | Description |\n|---|---|---|---|\n| `steady-state` | `--constraints` / `--constraint-solver` | `\"\"` | OccBin constraints TOML / backend (`nonlinearsolve\\|optim\\|nlopt\\|ipopt\\|path`) |\n| `solve` | `--evaluate-at` | `\"\"` | State vector `x1,x2,...` for VFI value evaluation |\n| `solve` | `--constraints` / `--constraint-solver` / `--periods` | `\"\"` / `\"\"` / `40` | OccBin constraints TOML / backend / simulation periods |\n| `solve` | `--save-model` / `--plot` / `--plot-save` | `\"\"` / off | Save handle / browser plot / save HTML |\n| `determinacy-map` | `--config` | `\"\"` (REQUIRED) | TOML with `[determinacy]` (params, lower/upper/points or grids) |\n| `determinacy-map` | `--rank-rtol` | `1e-8` | Sims rank-test relativ
